<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico">
  <title>TS-Django</title>
  <script>(function(){var d=document.documentElement,s=localStorage.getItem('skin');if(!s){var t=localStorage.getItem('theme');s=t==='dark'?'night':(t==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'night':'classic'):'classic')}if(s==='night'||s==='abyss')d.classList.add('dark');d.setAttribute('data-skin',s);var c=localStorage.getItem('themeColor');if(c)d.setAttribute('data-theme',c)})()</script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
