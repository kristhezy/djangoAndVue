{% extends 'base.html' %}
{% block content %}

<style>
    /* 批量删除线索：本页专用样式（布局/结构），公共控件 btn/select/textarea/pill 仍走 components.css */
    .batch-page {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
    }
    .batch-card {
        width: 680px;
        max-width: 100%;
        max-height: 100%;
        overflow-y: auto;
        background: #fff;
        border: 1px solid var(--gray-100);
        border-radius: var(--radius-2xl);
        box-shadow: var(--shadow-md);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }
    .batch-title {
        font-size: 20px;
        font-weight: 600;
        color: var(--gray-900);
        text-align: center;
        padding-bottom: 8px;
        border-bottom: 2px solid var(--gray-100);
    }
    /* 满宽字段：select 基础宽 180px，此处撑满整行并左对齐 */
    .batch-field {
        width: 100%;
        text-align: left;
    }
    .batch-textarea {
        width: 100%;
        height: 150px;
        resize: none;
    }
    /* 环境选择（单选框药丸分组） */
    .batch-env {
        display: flex;
        justify-content: center;
        gap: 12px;
        background: var(--gray-50);
        border-radius: var(--radius-lg);
        padding: 10px;
    }
    .batch-submit {
        display: flex;
        justify-content: center;
    }
    .batch-result {
        min-height: 40px;
        max-height: 360px;
        overflow-y: auto;
        padding: 10px;
        border-radius: var(--radius-lg);
        font-size: 15px;
        text-align: center;
        word-break: break-all;
        white-space: pre-wrap;
        color: var(--indigo-500);
    }
</style>

<div class="batch-page">
    <div class="batch-card">

        <h1 class="batch-title">批量删除线索</h1>

        <select id="companyId" class="select batch-field">
            <option value="" selected>选择企业ID</option>
            <option value="693225071459762176">石家庄七度文化传播有限公司(693225071459762176)【18630183501】</option>
            <option value="844635664262787073">石家庄七度文化传播有限公司转介绍(844635664262787073)【13303043501】</option>
        </select>

        <textarea id='phones' spellcheck="false" placeholder="输入手机号" class="textarea batch-textarea"></textarea>

        <div class="batch-env">
            <label class="pill"><input id='p' name="env" type="radio" value="prod" checked/> 生产环境</label>
            <label class="pill"><input id='t' name="env" type="radio" value="test"/> 测试环境</label>
        </div>

        <div class="batch-submit">
            <button id="mu" name="mu" type="button" class="btn btn--primary btn--lg">提交</button>
            <button type="button" class="btn btn--secondary btn--lg" data-draft-reset style="margin-left:12px">重置</button>
        </div>

        <div id='result' class="batch-result"></div>

    </div>
</div>

<script type="text/javascript">
    document.getElementById('mu').addEventListener('click',function(){
        var cid = document.getElementById('companyId').value;
        var phones = document.getElementById('phones').value;
        var env = document.querySelector("input[name='env']:checked").value;
        var data = JSON.stringify({
            "cid": cid,
            "phones": phones,
            "env": env
        })
        if (cid.length == 0){
            alert('企业ID不能为空！');
            return;
        }
        if (phones.length==0){
            alert('手机号码不能为空！');
            return;
        }
        const result = document.getElementById('result');
        result.innerHTML = "<img src='../static/img/loading.gif' height='10'/>";
        axios.post(`/sv/batchDeleteClue`,data,{headers: header})
        .then(response => {
            var res = response.data;
            console.log('批量删除用户数据succ:',res);
            result.innerHTML = res.data;
        })
        .catch(err => {console.log(`批量删除用户数据err: ${err}`)})
    });
</script>

{% endblock %}
