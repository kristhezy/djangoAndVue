{% extends 'base.html' %} 
{% block content %}
{% load static %}
<style>
    .right.part {
        display: flex;
        gap: 20px;
        padding: 16px;
        height: 99%;
    }

    .card {
        flex: 1;
        background: #fff;
        border-radius: 8px;
        padding: 20px;
        display: flex;
        flex-direction: column;
    }

    .card-title {
        text-align: center;
        margin-bottom: 0px;
        padding-bottom: 0px;
        border-bottom: 2px solid #f0f0f0;
    }

    .card-title h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        color: #333;
    }

    .form-group {
        display: flex;
        align-items: center;
        margin-bottom: 8px;
    }

    .form-group label {
        min-width: 80px;
        margin-right: 0px;
        font-weight: 400;
        user-select: none;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        padding: 8px 12px;
        border: 1px solid #d9d9d9;
        border-radius: 4px;
        outline: none;
        transition: border-color 0.3s;
        font-size: 14px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        border-color: #1890ff;
    }

    .form-group textarea {
        resize: vertical;
        min-height: 70px;
    }

    .form-group-inline {
        display: flex;
        gap: 8px;
    }

    .form-group-inline input,
    .form-group-inline select {
        flex: 1;
    }

    .env-group {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 15px;
    }

    .env-group label {
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 5px 16px;
        border-radius: 9999px;
        border: 1px solid #d1d5db;
        background: #fff;
        font-size: 13px;
        transition: all .15s;
        user-select: none;
    }
    .env-group label:has(input:checked) {
        background: #6366f1;
        color: #fff;
        border-color: #6366f1;
    }
    .env-group input[type="radio"] {
        display: none;
    }

    .btn-group {
        display: flex;
        justify-content: center;
        gap: 15px;
    }

    .btn-submit {
        background: #000;
        border: none;
        color: white;
        font-weight: bold;
    }

    .btn-submit:hover {
        background: #333;
    }

    .hint {
        color: gray;
        font-size: 12px;
        margin-left: 8px;
    }

    .result-panel {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #e0e0e0;
    }

    .result-panel h2 {
        font-size: 16px;
        margin-bottom: 10px;
        color: #333;
    }

    #jst {
        flex: 1;
        max-height: 96%;
        overflow-y: auto;
        padding: 0 10px;
        padding-top: 5px;
        border-radius: 4px;
        text-align: left;
        word-wrap: break-word;
        word-break: break-all;
    }

    #jst::-webkit-scrollbar {
        width: 5px;
    }

    #jst::-webkit-scrollbar-thumb {
        background-color: rgba(0, 0, 0, 0.3);
        border-radius: 10px;
    }

    #jst::-webkit-scrollbar {
        display: none;
    }

    #jst:hover::-webkit-scrollbar {
        display: block;
    }

    #result{
        flex: 1;
        margin-top: 10px;
        padding: 10px;
        border: 0px solid #f0f0f0;
        border-radius: 4px;
        max-height: 170px;
        overflow-y: auto;
        overflow-x: hidden;
        font-size: 15px;
        text-align: center;
        width: 100%;
        word-wrap: break-word;
        word-break: break-all;
        white-space: pre-wrap;
    }   

    .back-top {
        position: fixed;
        bottom: 70px;
        right: 60px;
        width: 40px;
        height: 40px;
        cursor: pointer;
        display: none;
    }

    .back-top .gotop {
        width: 100%;
        height: 100%;
        background: #000;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
    }

    .back-top svg {
        width: 20px;
        height: 20px;
        fill: white;
    }

    .form-section {
        flex: 1;
        margin-top: 10px;
        /* overflow-y: auto; */
    }

    .form-row {
        display: flex;
        align-items: flex-start;
        margin-bottom: 8px;
    }

    .form-row .thename {
        min-width: 90px;
        font-weight: 400;
        padding-top: 0px;
    }

    .form-row .setall {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .form-row .setall input,
    .form-row .setall select,
    .form-row .setall textarea {
        padding: 8px 12px;
        border: 1px solid #d9d9d9;
        border-radius: 4px;
        outline: none;
        transition: border-color 0.3s;
        font-size: 14px;
    }

    .form-row .setall input:focus,
    .form-row .setall select:focus,
    .form-row .setall textarea:focus {
        border-color: #1890ff;
    }

    .form-row .setall textarea {
        resize: vertical;
        min-height: 80px;
    }

    .dual-input {
        display: flex;
        gap: 8px;
        width: 100%;
    }

    .dual-input input {
        flex: 1;
    }

    .form-row-pair {
        display: flex;
        gap: 20px;
        margin-bottom: 12px;
    }

    .form-row-pair .form-col {
        flex: 1;
        display: flex;
        align-items: center;
    }

    .form-row-pair .form-col .thename {
        min-width: 80px;
        font-weight: 400;
    }

    .form-row-pair .form-col .setall {
        flex: 1;
    }

    .form-row-pair .form-col .setall input,
    .form-row-pair .form-col .setall select {
        width: 100%;
        max-width: 180px;
        padding: 8px 12px;
        border: 1px solid #d9d9d9;
        border-radius: 4px;
        outline: none;
        transition: border-color 0.3s;
        font-size: 14px;
    }

    .form-row-pair .form-col .setall input:focus,
    .form-row-pair .form-col .setall select:focus {
        border-color: #1890ff;
    }

    .form-row-full {
        display: flex;
        align-items: flex-start;
        margin-bottom: 12px;
    }

    .form-row-full .thename {
        min-width: 80px;
        font-weight: 400;
        padding-top: 8px;
    }

    .form-row-full .setall {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .form-row-full .setall input,
    .form-row-full .setall select,
    .form-row-full .setall textarea {
        padding: 8px 12px;
        border: 1px solid #d9d9d9;
        border-radius: 4px;
        outline: none;
        transition: border-color 0.3s;
        font-size: 14px;
    }

    .form-row-full .setall input:focus,
    .form-row-full .setall select:focus,
    .form-row-full .setall textarea:focus {
        border-color: #1890ff;
    }
</style>

<div class='right part'>
    <!-- 左侧表单卡片 -->
    <div class="card" style="flex: 1;">
        <div class="card-title">
            <h1>企业信息修改</h1>
        </div>

        <div class="form-section">
            <div class="ipcid">
                <div class="form-group">
                    <label>企业ID:</label>
                    <textarea class="companyId" id="companyId" placeholder="请输入企业ID，多个换行分隔" rows="3" style="flex:1; min-width: 300px;"></textarea>
                </div>
            </div>

            <div class="modtype">
                <!-- 第一行：企业名称 + 管理员姓名 -->
                <div class="form-row-pair">
                    <div class="form-col">
                        <div class="thename one" id='setct'>
                            <label>企业名称:</label>
                        </div>
                        <div class="setall thename" id='setet'>
                            <input class='ipt cname' type='text' id='cname' placeholder="请输入企业名称"/>
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="thename">
                            <label>管理员姓名:</label>
                        </div>
                        <div class="setall">
                            <input class='ipt admname' type='text' id='admname' placeholder="请输入管理员名称"/>
                        </div>
                    </div>
                </div>

                <!-- 第二行：企业类型 + 付款方式 -->
                <div class="form-row-pair">
                    <div class="form-col">
                        <div class="thename one">
                            <label>企业类型:</label>
                        </div>
                        <div class="setall ctype">
                            <select id="companyType">
                                <option value="" selected>请选择</option>
                                <option>7</option>
                                <option>0</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="thename two">
                            <label>付款方式:</label>
                        </div>
                        <div class="setall pment">
                            <select id="payment">
                                <option value="" selected>请选择</option>
                                <option value="3">预充值</option>
                                <option value="0">线下</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 第三行：有效期限 + 雷达总数 -->
                <div class="form-row-pair">
                    <div class="form-col">
                        <div class="thename three">
                            <label>有效期限:</label>
                        </div>
                        <div class="setall etime">
                            <input class='expireTime' type='date' id='expireTime'/>
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="thename six">
                            <label>雷达总数:</label>
                        </div>
                        <div class="setall rnum">
                            <input class='ipt radarnum' type='text' id='radarNum' placeholder="请输入雷达数"/>
                        </div>
                    </div>
                </div>

                <!-- 第四行：人资ID + 企业状态 -->
                <div class="form-row-pair">
                    <div class="form-col">
                        <div class="thename four">
                            <label>人资ID:</label>
                        </div>
                        <div class="setall tpid">
                            <select id="thirdpartyId" style="width: 180px;">
                                <option value="" selected>请选择</option>
                                <option>1</option>
                            </select>
                            <span class="hint">#id暂时只有'1'</span>
                        </div>
                    </div>
                    <div class="form-col">
                        <div class="thename five">
                            <label>企业状态:</label>
                        </div>
                        <div class="setall cstatus">
                            <input class='ipt compstatus' type='text' id='companyStatus' placeholder="状态:0禁用,1正常,2注销" style="width: 180px;"/>
                        </div>
                    </div>
                </div>

                <!-- 第五行：企业席位（两个输入框） -->
                <div class="form-row-full">
                    <div class="thename seven">
                        <label>企业席位:</label>
                    </div>
                    <div class="setall cseat">
                        <div class="dual-input" style="max-width: 400px;">
                            <input class='ipt totalseat' type='text' id='totalSeat' placeholder="企业/销售席位"/>
                            <input class='ipt partnerseat' type='text' id='partnerTotalSeat' placeholder="推荐官席位"/>
                        </div>
                    </div>
                </div>

                <!-- 第六行：员工雷达（textarea + select） -->
                <div class="form-row-full">
                    <div class="thename eight">
                        <label>员工雷达:</label>
                    </div>
                    <div class="setall ivs">
                        <div class="dual-input" style="max-width: 450px;">
                            <textarea id='cardId' placeholder="员工IDs" style="min-height: 50px; flex: 1;"></textarea>
                            <select id='rs' name="rs" style="width: 130px;">
                                <option value="" selected>请选择雷达状态</option>
                                <option value="0">关闭</option>
                                <option value="1">AI雷达</option>
                                <option value="3">AI和BOSS雷达</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="env-group">
                <label><input id='p0' name="env" type="radio" value="prod" checked/> 生产环境</label>
                <label><input id='t0' name="env" type="radio" value="test"/> 测试环境</label>
            </div>

            <div class="btn-group">
                <button id='modcompinfo' class="btn btn--primary">提交</button>
                <button type="button" class="btn btn--secondary" data-draft-reset>重置</button>
            </div>
            <div id="result"></div>
        </div>
    </div>

    <!-- 右侧结果卡片 -->
    <div class="card" style="flex: 1;">
        <div class="card-title">
            <h1>最近更新记录</h1>
        </div>

        <div id='jst' style="flex: 1;"></div>

    </div>
</div>

<!-- 返回顶部按钮 -->
<div id="btt" class="back-top" onclick="scrollToTop()">
    <div class="gotop">
        <svg class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg">
            <path d="M614.9 402.6V692c0 14.3-11.6 25.9-25.9 25.9H433.4c-14.3 0-25.9-11.6-25.9-25.9V402.6H262c-14.3 0-25.9-11.7-25.9-26 0-6.8 2.7-13.3 7.4-18.1L492.7 106c10.1-10.2 26.5-10.3 36.7-0.3l0.3 0.3 249.2 252.5c10 10.2 9.9 26.7-0.4 36.7-4.8 4.7-11.3 7.4-18.1 7.4H614.9zM123 823.1h778.1c14.3 0 25.9 11.6 25.9 25.9v53.2c0 14.3-11.6 25.9-25.9 25.9H123c-14.3 0-25.9-11.6-25.9-25.9V849c0-14.3 11.6-25.9 25.9-25.9z"></path>
        </svg>
    </div>
</div>

<script src="{% static 'js/querymsgbyds.js' %}"></script>
<script type="text/javascript">
    var ds = 4
    var qnum = 10
    window.onload = querymsgbyds([ds],qnum);
    // 修改企业类型
    const modcompinfo = document.getElementById('modcompinfo');
    modcompinfo.addEventListener('click',function() {
        this.disabled = true;
        var cid = document.getElementById('companyId').value;
        var cname = document.getElementById('cname').value;
        var admname = document.getElementById('admname').value;
        var ctype = document.getElementById('companyType').value;
        var payment = document.getElementById('payment').value;
        var etime = document.getElementById('expireTime').value;
        var tpid = document.getElementById('thirdpartyId').value;
        var cstatus = document.getElementById('companyStatus').value;
        var rnum = document.getElementById('radarNum').value;
        var tseat = document.getElementById('totalSeat').value;
        var ptseat = document.getElementById('partnerTotalSeat').value;
        var cardids = document.getElementById('cardId').value;
        var rs = document.getElementById('rs').value;
        var env = document.querySelector("input[name='env']:checked").value;
        var data = JSON.stringify({cid,cname,admname,ctype,payment,etime,tpid,cstatus,rnum,tseat,ptseat,cardids,rs,env})
        console.log('222',data);
        if (cname.length==0 && admname.length==0 && ctype.length==0 && payment.length==0 && etime.length==0 && tpid.length==0 && cstatus.length==0 && rnum.length==0 && tseat.length==0 && ptseat.length==0 && cardids.length==0){
            alert('修改类型不能全部为空！');
            modcompinfo.disabled = false;
            return;
        }
        document.getElementById('companyStatus').value;
        const result = document.getElementById('result');
        result.innerHTML = "<img src='../static/img/loading.gif' height='10'/>"; //在后台返回success之前显示loading图标
        axios.post(`/sv/updateCInfo`,data,{headers: header})
        .then(response => {
            var res = response.data;
            console.log(`修改企业类型suc: code=${res.code}, msg=${res.data}`);
            result.innerHTML = res.data;
            document.querySelectorAll('input[type="text"]').forEach(input => {
                input.value = '';
            }); // 清除text数据
            var selectIds = ["companyType", "payment", "thirdpartyId", "rs"];
            selectIds.forEach(id => { // 遍历所有select元素的id，并清除它们的选项
                document.getElementById(id).value = ""; // 清除选项的方法
            });
            querymsgbyds([ds],qnum);
            modcompinfo.disabled = false;
        })
        .catch(err => {console.log(`修改企业类型err: ${err}`)})
    })

    var jst = document.getElementById("jst");
    function scrollToTop() {
        // console.log("scrollToTop")
        jst.scrollTo({
            top: 0,
            left: 0,
            behavior: 'smooth' // 可选，平滑滚动效果
        });
    }
    var btt = document.getElementById("btt");
    // 监听滚动事件
    jst.onscroll = function() {
        // 当滚动的位置大于等于内容区域的顶部位置时显示按钮
        if (jst.scrollTop > 30) {
            btt.style.display = 'block';
        } else {
            btt.style.display = 'none';
        }
    };
    // 获取所有日期输入框
    getDateInput('.expireTime');
</script>

{% endblock %}
