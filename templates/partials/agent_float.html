<!-- 悬浮 Agent 入口：仅在拥有 agent 菜单权限时由 shell.html 引入 -->
<style>
    .agent-fbtn {
        position: fixed; right: 0; top: 50%; transform: translateY(-50%);
        z-index: 10000;
        width: 34px;
        border-radius: 12px 0 0 12px;
        background: linear-gradient(180deg, #4f6ef7, #3d5ce0);
        color: #fff; border: 0; cursor: pointer;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 6px; padding: 12px 0;
        box-shadow: -4px 4px 14px rgba(79,110,247,.35);
        transition: transform .18s, box-shadow .18s, opacity .18s, width .18s;
    }
    .agent-fbtn:hover { width: 40px; box-shadow: -6px 6px 18px rgba(79,110,247,.5); }
    .agent-fbtn.hidden { opacity: 0; pointer-events: none; transform: translateY(-50%) translateX(100%); }
    .agent-fbtn .afb-ico { font-size: 17px; line-height: 1; }
    .agent-fbtn .afb-txt { font-size: 12px; writing-mode: vertical-rl; letter-spacing: 3px; }

    .agent-fpanel {
        position: fixed; right: 24px; bottom: 24px; z-index: 10001;
        width: 400px; height: 560px; max-width: calc(100vw - 40px);
        max-height: calc(100vh - 40px);
        background: #fff; border-radius: 14px; overflow: hidden;
        box-shadow: 0 12px 40px rgba(0,0,0,.22);
        display: flex; flex-direction: column;
        transform: translateY(16px); opacity: 0; pointer-events: none;
        transition: transform .18s ease, opacity .18s ease;
    }
    .agent-fpanel.open { transform: translateY(0); opacity: 1; pointer-events: auto; }

    .agent-fhd {
        display: flex; align-items: center; gap: 8px;
        padding: 10px 14px; background: #fff; border-bottom: 1px solid #f0f0f0;
        cursor: move; user-select: none; flex-shrink: 0;
    }
    .agent-fhd .t { font-size: 14px; font-weight: 600; color: #333; }
    .agent-fhd .spacer { flex: 1; }
    .agent-fhd button { border: 0; background: none; cursor: pointer; color: #999;
                        font-size: 16px; padding: 4px 8px; border-radius: 6px; line-height: 1; }
    .agent-fhd button:hover { background: #f5f5f5; color: #333; }
    .agent-fhd .btn-close:hover { color: #ff4d4f; background: #fff0f0; }

    .agent-fframe { flex: 1; width: 100%; border: 0; background: #f5f6f8; }
</style>

<button class="agent-fbtn" id="agentFloatBtn" title="打开 Agent 助手">
    <span class="afb-ico">🤖</span>
    <span class="afb-txt">助手</span>
</button>

<div class="agent-fpanel" id="agentFloatPanel">
    <div class="agent-fhd" id="agentFloatHd">
        <span class="t">🤖 Agent</span>
        <span class="spacer"></span>
        <button class="btn-close" id="agentFloatClose" title="收起">—</button>
    </div>
    <iframe class="agent-fframe" id="agentFloatFrame" title="Agent"></iframe>
</div>

<script>
(function () {
    var btn = document.getElementById('agentFloatBtn');
    var panel = document.getElementById('agentFloatPanel');
    var frame = document.getElementById('agentFloatFrame');
    var hd = document.getElementById('agentFloatHd');
    var loaded = false;

    function openPanel() {
        if (!loaded) { frame.src = '/pv/agent/float'; loaded = true; }
        panel.classList.add('open');
        btn.classList.add('hidden');
    }
    function closePanel() {
        panel.classList.remove('open');
        btn.classList.remove('hidden');
    }

    btn.addEventListener('click', openPanel);
    document.getElementById('agentFloatClose').addEventListener('click', closePanel);

    // ── 拖拽（限定在视口内）──
    var dragging = false, offX = 0, offY = 0;
    hd.addEventListener('mousedown', function (e) {
        dragging = true; offX = e.clientX - panel.offsetLeft; offY = e.clientY - panel.offsetTop;
        e.preventDefault();
    });
    document.addEventListener('mousemove', function (e) {
        if (!dragging) return;
        var x = e.clientX - offX, y = e.clientY - offY;
        x = Math.max(0, Math.min(x, window.innerWidth - panel.offsetWidth));
        y = Math.max(0, Math.min(y, window.innerHeight - panel.offsetHeight));
        panel.style.left = x + 'px';
        panel.style.top = y + 'px';
        panel.style.right = 'auto';
        panel.style.bottom = 'auto';
    });
    document.addEventListener('mouseup', function () { dragging = false; });
})();
</script>
