{% extends 'base.html' %}
{% block content %}
{% load static %}
<script src="{% static 'js/marked.min.js' %}?v={{ config.STATIC_VERSION }}"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .right.part { width: 100%; height: 100vh; display: flex; gap: 16px;
                  padding: 12px; background: #f0f2f5; }

    /* ====== 左右两栏均凸起卡片 ====== */
    .col-chat, .col-side  { border-radius: 14px; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.08);
                            display: flex; flex-direction: column; overflow: hidden; }
    .col-chat  { flex: 1; }
    .col-side  { width: 280px; min-width: 280px; }

    /* ====== 右侧栏内部 ====== */
    .side-hd { padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 10px;
               border-bottom: 1px solid #f0f0f0; }
    .side-logo { font-size: 20px; font-weight: 700; color: #1a1a1a; }
    .btn-newchat { display: flex; align-items: center; justify-content: center; gap: 6px;
                   padding: 9px 0; border: 1px solid #d0d5dd; border-radius: 10px;
                   background: #fff; color: #333; cursor: pointer; font-size: 14px;
                   transition: all .15s; }
    .btn-newchat:hover { background: #f5f5f5; }
    .side-label { color: #999; font-size: 13px; margin-top: 4px; }
    .side-list { flex: 1; overflow-y: auto; padding: 6px 12px 12px; display: flex;
                 flex-direction: column; gap: 4px; }
    .side-list::-webkit-scrollbar { width: 4px; }
    .side-list::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

    .hht { display: flex; align-items: center; justify-content: space-between;
           padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px;
           color: #333; transition: background .12s; }
    .hht:hover { background: #f0f0f3; }
    .hht.active { background: #e8edf5; font-weight: 500; color: #2c5cc5; }
    .hht .tit { flex:1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width:0; }
    .hht .del-btn { display: none; margin-left: 6px; color: #bbb; font-size: 13px;
                    flex-shrink: 0; padding: 2px 6px; border-radius: 4px; }
    .hht:hover .del-btn { display: block; }
    .hht .del-btn:hover { color: #ff4d4f; background: #fff0f0; }

    /* ====== 左侧聊天区 ====== */
    .chat-hd { padding: 12px 20px; border-bottom: 1px solid #f0f0f0;
               font-size: 15px; font-weight: 600; color: #333; }
    .chat-area { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex;
                 flex-direction: column; align-items: center; gap: 24px; }
    .chat-area::-webkit-scrollbar { width: 5px; }
    .chat-area::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 5px; }

    /* ====== 每条 QA 对包在一个卡片内，间隔清晰 ====== */
    .qa-block { width: 800px; max-width: 100%; background: #fff;
                border-radius: 12px; padding: 16px 20px;
                box-shadow: 0 1px 4px rgba(0,0,0,.05); }

    .msg-row { display: flex; }
    .msg-row + .msg-row { margin-top: 14px; }
    .msg-row.user { justify-content: flex-end; }
    .msg-body { flex: 1; min-width: 0; line-height: 1.72;
                overflow-wrap: break-word; word-break: break-word; }
    .msg-body:not(.no-bubble) { padding: 10px 14px; border-radius: 10px; }
    .msg-row.user .msg-body:not(.no-bubble) { flex: 0 1 auto; text-align: left; display: flex; flex-direction: column;
                                              background: #1a1a1a; color: #fff; }
    .msg-row.assistant .msg-body:not(.no-bubble) { background: #f7f7f8; }
    .msg-body.streaming { padding: 10px 14px; border-radius: 10px; background: #f7f7f8; }

    .msg-body h1,.msg-body h2,.msg-body h3 { margin: .5em 0 .25em; }
    .msg-body h2 { font-size: 1.15em; border-bottom: 1px solid #e8e8e8; padding-bottom: 3px; }
    .msg-body h3 { font-size: 1.05em; }
    .msg-body p { margin: .35em 0; }
    .msg-body ul,.msg-body ol { padding-left: 1.4em; margin: .25em 0; }
    .msg-body pre { background: #2d2d2d; color: #e8e8e8; padding: 12px 14px; border-radius: 8px;
                    overflow-x: auto; font-size: 13px; line-height: 1.45; margin: 6px 0;
                    white-space: pre-wrap; word-break: break-all; }
    .msg-body code { background: rgba(0,0,0,.05); padding: 2px 5px; border-radius: 3px; font-size: .88em; }
    .msg-body pre code { background: none; padding: 0; }
    .msg-body blockquote { border-left: 3px solid #ccc; padding-left: 10px; color: #666; margin: 6px 0; }
    .msg-body table { border-collapse: collapse; margin: 6px 0; width: 100%; }
    .msg-body th,.msg-body td { border: 1px solid #ddd; padding: 5px 8px; text-align: left; }
    .msg-body a { color: #4f6ef7; }
    .msg-row.assistant .msg-body img { max-width: 100%; height: auto; }
    .msg-row.user .msg-body code { background: rgba(255,255,255,.15); color: #fff; }
    .msg-row.user .msg-body pre { background: #444; color: #ddd; }
    .msg-row.user .msg-body blockquote { border-color: rgba(255,255,255,.3); color: rgba(255,255,255,.7); }
    .msg-row.user .msg-body a { color: #aac4ff; }

    details.thinking { margin-bottom: 6px; border: 1px solid #e8e8e8; border-radius: 7px; overflow: hidden; }
    details.thinking summary { padding: 6px 10px; cursor: pointer; font-size: 12px; color: #999;
                               background: #fcfcfc; user-select: none; }
    details.thinking .thinking-content { padding: 8px 12px; font-size: 12px; color: #999;
                                         background: #fefefe; border-top:1px solid #f0f0f0;
                                         white-space: pre-wrap; word-break: break-word; }

    .welcome { flex: 1; display: flex; flex-direction: column; align-items: center;
               justify-content: center; color: #aaa; font-size: 22px;
               font-family: "KaiTi","STKaiti","楷体",serif; }

    .chat-foot { padding: 10px 20px 16px; display: flex; justify-content: center;
                 border-top: 1px solid #f0f0f0; flex: 0.15;}
    .input-wrap { width: 100%; max-width: 800px; display: flex; flex-direction: column;
                  border: 1px solid #e0e0e0; border-radius: 12px;
                  padding: 10px 12px 8px; background: #fafafa;
                  transition: border-color .2s; }
    .input-wrap:focus-within { border-color: #4f6ef7; box-shadow: 0 0 0 2px rgba(79,110,247,.1); }
    .input-editor { flex: 1; border: 0; outline: none; font-size: 14px;
                    line-height: 1.5; min-height: 44px; max-height: 140px;
                    overflow-y: auto; word-break: break-word; }
    .input-editor:empty::before { content: '输入问题… 支持粘贴截图'; color: #aaa; }
    .input-editor img { display: block; max-width: 130px; max-height: 90px;
                        border-radius: 8px; margin: 0 0 6px 0;
                        border: 1px solid #e0e0e0; cursor: pointer; }
    .input-editor img:hover { outline: 2px solid #ff4d4f; outline-offset: 1px; }
    /* 底部工具栏：图片在左，发送在右 */
    .input-toolbar { display: flex; align-items: center; justify-content: space-between;
                     margin-top: 6px; }
    .input-toolbar .left-btns { display: flex; align-items: center; gap: 2px; }
    .input-toolbar .right-btns { display: flex; align-items: center; gap: 4px; }
    .btn-upload { width: 32px; height: 32px; border-radius: 6px; border: 0;
                  background: transparent; color: #999; cursor: pointer; font-size: 18px;
                  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
                  transition: all .15s; }
    .btn-upload:hover { color: #4f6ef7; background: rgba(79,110,247,.08); }
    .btn-upload.has-img { color: #4f6ef7; }
    .btn-send { width: 32px; height: 32px; border-radius: 60px; border: 0; background: #1a1a1a;
                color: #fff; cursor: pointer; font-size: 14px; display: flex; align-items: center;
                justify-content: center; flex-shrink: 0; transition: background .15s; }
    .btn-send:hover { background: #333; }
    .btn-send:disabled { background: #bbb; cursor: not-allowed; }
    .btn-stop { width: 32px; height: 32px; border-radius: 60px; border: 1px solid #d9d9d9;
                background: #fff; color: #666; cursor: pointer; font-size: 12px; display: none;
                align-items: center; justify-content: center; flex-shrink: 0; }

    .loading-dot { display: inline-block; width: 7px; height: 7px; background: #bbb;
                   border-radius: 50%; animation: blink 1.4s infinite both; }
    .loading-dot:nth-child(2) { animation-delay: .2s; }
    .loading-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .stream-cursor { animation: pulse 1s infinite; color: #4f6ef7; }
    .status-banner { padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 8px;
                     background: #e8f0fe; color: #2c5cc5; display: flex; align-items: center; gap: 6px; }
    .status-banner.done { display: none; }
    #lastline { height: 1px; }

    /* 底部操作栏 — 默认隐藏，hover 卡片时展示 */
    .qa-actions { display: flex; gap: 6px; margin: 8px 0; padding: 0 2px; opacity: 0; transition: opacity .15s; }
    .qa-block:hover .qa-actions { opacity: 1; }
    .qa-actions.user-actions { justify-content: flex-end; margin-bottom: 16px; }
    .act-btn { display: flex; align-items: center; gap: 3px;
               padding: 2px 8px; border-radius: 4px; border: 0;
               background: transparent; color: #bbb; cursor: pointer;
               font-size: 12px; transition: all .15s; }
    .act-btn:hover { color: #666; background: rgba(0,0,0,.05); }
    .msg-row.user .act-btn { color: rgba(255,255,255,.5); }
    .msg-row.user .act-btn:hover { color: #fff; background: rgba(255,255,255,.15); }
    .act-btn.copied { color: #52c41a !important; }

    /* ── 图片光箱 ── */
    .img-lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
                    z-index: 9999; justify-content: center; align-items: center; cursor: zoom-out; }
    .img-lightbox.show { display: flex; }
    .img-lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain;
                         border-radius: 6px; box-shadow: 0 4px 32px rgba(0,0,0,.5); }
    .img-lightbox .close-btn { position: absolute; top: 16px; right: 20px; color: #fff;
                                font-size: 28px; cursor: pointer; width: 40px; height: 40px; display: flex;
                                align-items: center; justify-content: center; border-radius: 50%;
                                background: rgba(255,255,255,.1); border: 0; }
    .img-lightbox .close-btn:hover { background: rgba(255,255,255,.2); }

    /* ── 聊天区图片容器 ── */
    .chat-img-wrap { display: block; margin: 8px 0 0 0; }
    .chat-img-wrap img { display: block; max-width: 260px; max-height: 200px; border-radius: 8px;
                          cursor: zoom-in; border: 1px solid #e0e0e0; object-fit: cover;
                          transition: opacity .15s; }
    .chat-img-wrap img:hover { opacity: .85; }
    .chat-img-actions { display: flex; gap: 4px; margin-top: 4px; opacity: 0; transition: opacity .15s; }
    .chat-img-wrap:hover .chat-img-actions { opacity: 1; }
    .img-act-btn { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px;
                    border-radius: 4px; border: 1px solid #e0e0e0; background: #fff;
                    color: #666; cursor: pointer; font-size: 11px; transition: all .12s; }
    .img-act-btn:hover { background: #f5f5f5; color: #333; }
</style>

<div class='right part'>
    <!-- ===== 左侧：聊天区 ===== -->
    <div class="col-chat">
        <div class="chat-hd">AI 对话</div>
        <div class="chat-area" id="container">
            <div id="show-result"></div>
            <div id="lastline"></div>
        </div>
        <div class="chat-foot">
            <div class="input-wrap" id="inputWrap">
                <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileSelect(event)" />
                <div class="input-editor" id="askwords" contenteditable="true"
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();submitAsk();}"></div>
                <div class="input-toolbar">
                    <div class="left-btns">
                        <button class="btn-upload" id="btnUpload" onclick="document.getElementById('fileInput').click()" title="上传图片"><i class="fa-regular fa-image"></i></button>
                    </div>
                    <div class="right-btns">
                        <button class="btn-stop" id="btnStop" onclick="stopStream()" title="停止生成">■</button>
                        <button class="btn-send" id="submit" onclick="submitAsk()" title="发送 (Enter)">↑</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 右侧：历史记录 ===== -->
    <div class="col-side">
        <div class="side-hd">
            <div class="side-logo">七进七出</div>
            <button class="btn-newchat" onclick="newhh()">＋ 新对话</button>
            <div class="side-label">历史对话</div>
        </div>
        <div class="side-list" id="hishh"></div>
    </div>
</div>

<!-- 图片光箱 -->
<div class="img-lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="close-btn" onclick="closeLightbox()">✕</button>
    <img id="lightbox-img" src="" alt="预览" />
</div>

<script type="text/javascript" src="{% static 'js/setStyle.js' %}"></script>
<script>
    let chatId = "";
    let historyList = [];
    let showresult = document.getElementById('show-result');
    let container = document.getElementById('container');
    let isSubmitting = false;
    let abortCtrl = null;
    let loadHistoryLock = false;
    let $editor = document.getElementById('askwords');

    marked.setOptions({ breaks: true, gfm: true });
    function renderMd(text) {
        if (!text) return '';
        try { return typeof marked !== 'undefined' ? marked.parse(text) : escapeHTML(text).replace(/\n/g, '<br>'); }
        catch(e) { return escapeHTML(text).replace(/\n/g, '<br>'); }
    }

    function parseMaybeRepr(raw) {
        if (!raw) return null;
        if (typeof raw !== 'string') return raw;
        try { return JSON.parse(raw); } catch(e) {}
        try { return JSON.parse(raw.replace(/'/g, '"')); } catch(e) {}
        try { return JSON.parse(raw.replace(/([{,]\s*)'?(\w+)'?\s*:/g, '$1"$2":').replace(/'/g, '"')); } catch(e) {}
        return null;
    }

    // ── 复制 / 重问 ──
    function copyText(ev) {
        ev.stopPropagation();
        let btn = ev.currentTarget;
        if (!btn) return;
        let raw = btn.dataset.copy || '';
        raw = raw.replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
        let imgSrc = btn.dataset.imageCopy || '';
        imgSrc = imgSrc.replace(/&quot;/g, '"').replace(/&amp;/g, '&');

        let promise;
        if (imgSrc) {
            // 带图复制：text/plain + text/html（含图片），粘贴到富文本编辑器能看到图
            let html = raw.replace(/\n/g, '<br>') + '<br><img src="' + imgSrc + '" style="max-width:200px;" />';
            let item = new ClipboardItem({
                'text/plain': new Blob([raw], {type: 'text/plain'}),
                'text/html': new Blob([html], {type: 'text/html'}),
            });
            promise = navigator.clipboard.write([item]);
        } else {
            promise = navigator.clipboard.writeText(raw);
        }

        promise.then(() => {
            let icon = btn.querySelector('i');
            if (icon) icon.className = 'fa-solid fa-check';
            btn.classList.add('copied');
            setTimeout(() => {
                if (icon) icon.className = 'fa-solid fa-copy';
                btn.classList.remove('copied');
            }, 1500);
        });
    }

    function reAsk(ev) {
        let q = ev.currentTarget.dataset.copy || '';
        q = q.replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
        let imgSrc = ev.currentTarget.dataset.imageCopy || '';
        imgSrc = imgSrc.replace(/&quot;/g, '"').replace(/&amp;/g, '&');

        clearEditor();
        // 文字放编辑器
        $editor.textContent = q;
        // 图片插入编辑器
        if (imgSrc) {
            let img = document.createElement('img');
            img.src = imgSrc;
            img.title = '点击图片可删除';
            img.onclick = function(ev) {
                ev.stopPropagation();
                if (confirm('删除这张图片？')) { this.remove(); updateUploadBtnState(); }
            };
            $editor.appendChild(img);
            $editor.appendChild(document.createTextNode(' '));
            updateUploadBtnState();
        }

        submitAsk();
    }

    function actionBar(copyText, isUser, imageSrc) {
        let cls = isUser ? 'qa-actions user-actions' : 'qa-actions';
        let raw = copyText.replace(/"/g, '&quot;').replace(/&/g, '&amp;');
        let img = (imageSrc || '').replace(/"/g, '&quot;').replace(/&/g, '&amp;');
        let html = `<div class="${cls}">`;
        if (isUser) html += `<button class="act-btn" data-copy="${raw}" data-image-copy="${img}" onclick="reAsk(event)" title="重新提问（含图片）"><i class="fa-solid fa-arrow-rotate-right"></i></button>`;
        html += `<button class="act-btn" data-copy="${raw}" data-image-copy="${img}" onclick="copyText(event)" title="复制"><i class="fa-solid fa-copy"></i></button>`;
        html += `</div>`;
        return html;
    }

    // ── 渲染 ──
    function renderQA(ask, answer, thinking, image) {
        let rawAsk = ask.replace(/"/g, '&quot;').replace(/&/g, '&amp;');
        let rawAns = (answer||'').replace(/"/g, '&quot;').replace(/&/g, '&amp;');
        let imgPart = image ? imgBlock(image) : '';
        let h = `<div class="qa-block"><div class="msg-row user">
            <div class="msg-body">${escapeHTML(ask)}${imgPart}</div></div>${actionBar(rawAsk, true, image)}
            <div class="msg-row assistant"><div class="msg-body">`;
        if (thinking) h += `<details class="thinking"><summary>💭 思考过程</summary>
            <div class="thinking-content">${renderMd(thinking)}</div></details>`;
        h += renderMd(answer) + `</div></div>${actionBar(rawAns, false)}</div>`;
        return h;
    }

    // ── 图片渲染（可点击放大 + 复制 + 下载）──
    function imgBlock(src) {
        let esc = src.replace(/"/g, '&quot;');
        return `<div class="chat-img-wrap">
            <img src="${esc}" onclick="openLightbox(event,'${esc}')" title="点击放大" />
            <div class="chat-img-actions">
                <button class="img-act-btn" onclick="event.stopPropagation();copyImgUrl('${esc}')"><i class="fa-solid fa-copy"></i></button>
                <button class="img-act-btn" onclick="event.stopPropagation();downloadImg('${esc}')"><i class="fa-solid fa-download"></i></button>
            </div></div>`;
    }
    document.addEventListener('keydown', e => { if (e.key==='Escape') closeLightbox(); });
    // 聊天区中 markdown 渲染的图片也加点击放大
    showresult.addEventListener('click', e => {
        if (e.target.tagName === 'IMG' && e.target.closest('.msg-body')) {
            openLightbox(e, e.target.src);
        }
    });
    function openLightbox(ev, url) { ev.stopPropagation(); document.getElementById('lightbox-img').src=url; document.getElementById('lightbox').classList.add('show'); }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }
    let _imgCopied = {};
    function copyImgUrl(url) {
        navigator.clipboard.writeText(url);
        _imgCopied[url] = true;
        setTimeout(() => { _imgCopied[url] = false; }, 2000);
    }
    function downloadImg(url) {
        let a = document.createElement('a'); a.href = url; a.download = url.split('/').pop().split('?')[0] || 'image.png';
        document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 100);
    }

    function renderLoading(ask, imgHtml, imgSrc) {
        let rawAsk = ask.replace(/"/g, '&quot;').replace(/&/g, '&amp;');
        let imgPart = imgHtml || '';
        return `<div class="qa-block"><div class="msg-row user">
            <div class="msg-body">${escapeHTML(ask)}${imgPart}</div></div>${actionBar(rawAsk, true, imgSrc)}
            <div class="msg-row assistant">
            <div class="msg-body no-bubble" style="display:flex;align-items:center;gap:10px;">
            <span style="color:#2c5cc5;font-size:13px;"><i class="fa-solid fa-hourglass"></i> AI 正在处理，请稍候 </span>
            <span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div></div></div>`;
    }

    function renderStreamBlock(ask, imgHtml, imgSrc) {
        let rawAsk = ask.replace(/"/g, '&quot;').replace(/&/g, '&amp;');
        let imgPart = imgHtml || '';
        return `<div class="qa-block" id="stream-block"><div class="msg-row user">
            <div class="msg-body">${escapeHTML(ask)}${imgPart}</div></div>${actionBar(rawAsk, true, imgSrc)}
            <div class="msg-row assistant" id="stream-msg">
            <div class="msg-body" id="stream-body">
            <details class="thinking" id="stream-search-detail" style="display:none;">
              <summary>🔍 搜索结果</summary>
              <div class="thinking-content" id="stream-search"></div>
            </details>
            <div class="status-banner" id="stream-status"><i class="fa-solid fa-hourglass"></i> 正在准备…</div>
            <span id="stream-text"></span><span class="stream-cursor" id="stream-cursor"> ▌</span>
            </div></div><div class="qa-actions" id="stream-actions"><button class="act-btn" id="stream-copy-btn" data-copy="" onclick="copyText(event)" title="复制"><i class="fa-solid fa-copy"></i></button></div></div>`;
    }

    // ── 富文本输入：图片工具函数 ──
    function compressImage(fileOrBlob, maxW=1024, maxKB=500) {
        return new Promise((resolve, reject) => {
            let img = new Image();
            img.onload = () => {
                let w = img.width, h = img.height;
                if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
                let canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                let ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                let lo=0.3, hi=0.9, best=canvas.toDataURL('image/jpeg', 0.5);
                for (let k=0; k<4; k++) {
                    let mid = (lo+hi)/2;
                    let dataUrl = canvas.toDataURL('image/jpeg', mid);
                    if (dataUrl.length > maxKB*1024) hi=mid; else { best=dataUrl; lo=mid; }
                }
                resolve(best);
            };
            img.onerror = () => reject(new Error('图片加载失败'));
            img.src = URL.createObjectURL(fileOrBlob);
        });
    }

    async function insertImageIntoEditor(fileOrBlob) {
        try {
            let dataUrl = await compressImage(fileOrBlob);
            let img = document.createElement('img');
            img.src = dataUrl;
            img.title = '点击图片可删除';
            // 点击图片删除
            img.onclick = function(ev) {
                ev.stopPropagation();
                if (confirm('删除这张图片？')) this.remove();
                updateUploadBtnState();
            };
            $editor.appendChild(img);
            // 图片后加空格方便继续打字
            $editor.appendChild(document.createTextNode(' '));
            updateUploadBtnState();
            $editor.focus();
        } catch(e) { console.error('图片处理失败:', e); }
    }

    function updateUploadBtnState() {
        let has = $editor.querySelector('img') !== null;
        let btn = document.getElementById('btnUpload');
        if (has) btn.classList.add('has-img');
        else btn.classList.remove('has-img');
    }

    function handleFileSelect(ev) {
        let f = ev.target.files[0];
        if (f) insertImageIntoEditor(f);
        ev.target.value = '';
    }

    function clearEditor() {
        $editor.innerHTML = '';
        updateUploadBtnState();
    }

    // ── 粘贴 — 有图时插入编辑器，纯文字走默认 ──
    $editor.addEventListener('paste', (e) => {
        let items = e.clipboardData?.items || [];
        for (let item of items) {
            if (item.type.startsWith('image/')) {
                e.preventDefault();
                insertImageIntoEditor(item.getAsFile());
                return;
            }
        }
    });

    // ── 拖拽上传 ──
    let iw = document.getElementById('inputWrap');
    iw.addEventListener('dragover', e => { e.preventDefault(); iw.style.borderColor = '#4f6ef7'; });
    iw.addEventListener('dragleave', e => { e.preventDefault(); iw.style.borderColor = ''; });
    iw.addEventListener('drop', e => {
        e.preventDefault();
        iw.style.borderColor = '';
        let f = e.dataTransfer.files[0];
        if (f && f.type.startsWith('image/')) insertImageIntoEditor(f);
    });

    // 监听 input 事件更新按钮状态
    $editor.addEventListener('input', () => { updateUploadBtnState(); });

    // ── 初始加载 ──
    loadHistory();
    loadLatestChat();

    function loadLatestChat() {
        axios.post('/pv/aitools/gethishh', JSON.stringify({type:"gethishh"}), {headers:header})
            .then(res => {
                let data = res.data.data;
                if (data && Object.keys(data).length > 0) {
                    let keys = Object.keys(data);
                    let last = data[keys[0]];     // 后端按 -id 排序，keys[0] 是最新记录
                    chatId = last.id;
                    displayChat(last.id, last.content);
                } else { showWelcome(); }
            }).catch(() => showWelcome());
    }

    function showWelcome() {
        chatId = 0;
        showresult.innerHTML = '<div class="welcome">欢迎来到AI的世界</div>';
    }

    function displayChat(cid, content) {
        chatId = cid;
        let arr = parseMaybeRepr(content) || [];
        if (!Array.isArray(arr)) arr = [];
        showresult.innerHTML = arr.map(c => renderQA(c.ask, c.answer, c.thinking, c.image)).join('');
        scrollToBottom();
        loadHistory();  // 更新侧边栏高亮
    }

    // ── 流式提交 ──
    async function submitAsk() {
        if (isSubmitting) return;
        let editor = $editor;

        // 从富文本提取纯文字
        let aw = editor.innerText.trim();

        // 提取第一张图（base64 或 云端 URL）
        let imgEl = editor.querySelector('img');
        let imgData = null, imgHtml = '', imgSrc = '';
        if (imgEl) {
            imgSrc = imgEl.src;
            imgData = imgSrc.startsWith('data:') ? imgSrc.split(',')[1] : imgSrc;
            imgHtml = imgBlock(imgSrc);
        }

        if (!aw && !imgData) return;

        isSubmitting = true;
        document.getElementById('submit').style.display = 'none';
        document.getElementById('btnStop').style.display = 'flex';
        clearEditor();
        $editor.focus();

        // 构建请求体
        let reqBody = { prompt: aw, id: chatId || 0 };
        if (imgData) reqBody.image = imgData;

        cleanupStreamIds();
        showresult.innerHTML += renderLoading(aw, imgHtml, imgSrc);
        scrollToBottom();

        abortCtrl = new AbortController();
        let thinkingBuf = "", textBuf = "";
        let streamStarted = false;

        try {
            let resp = await fetch('/pv/aitools/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
                body: JSON.stringify(reqBody),
                signal: abortCtrl.signal,
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

            let reader = resp.body.getReader();
            let decoder = new TextDecoder();
            let buf = "";

            while (true) {
                let { done, value } = await reader.read();
                if (done) break;
                buf += decoder.decode(value, { stream: true });
                let parts = buf.split('\n\n');
                buf = parts.pop();
                for (let p of parts) {
                    if (p.startsWith(': ')) continue;  // 跳过 padding comment
                    if (!p.startsWith('data: ')) continue;
                    let ds = p.slice(6);
                    if (!ds || ds === '[DONE]') continue;
                    let ev;
                    try { ev = JSON.parse(ds); } catch(e) { continue; }

                    if (ev.type === 'start') {
                        streamStarted = true;
                        let idx = showresult.innerHTML.lastIndexOf('<div class="qa-block"');
                        if (idx !== -1)
                            showresult.innerHTML = showresult.innerHTML.substring(0, idx) + renderStreamBlock(aw, imgHtml, imgSrc);
                    } else if (ev.type === 'status') {
                        let el = document.getElementById('stream-status');
                        if (el) {
                            let msg;
                            if (ev.content === 'preparing')      msg = '<i class="fa-solid fa-hourglass"></i> 正在准备…';
                            else if (ev.content === 'searching') msg = '<i class="fa-solid fa-magnifying-glass"></i> 搜索中…';
                            else if (ev.content === 'thinking')  msg = '💭 分析中…';
                            else if (ev.content === 'extracting') msg = '<i class="fa-solid fa-eye"></i> 正在识别图片文字…';
                            else if (ev.content === 'analyzing') msg = '<i class="fa-solid fa-brain"></i> 正在理解并组织回答…';
                            else if (ev.content === 'generating') msg = '<i class="fa-solid fa-file-pen"></i> 正在生成回答…';
                            else if (ev.content === 'uploading') msg = '<i class="fa-solid fa-cloud-arrow-up"></i> 正在上传图片…';
                            else if (ev.content === 'cloud_ok')  msg = '✅ 图片已上传云端';
                            else msg = ev.content;
                            el.innerHTML = msg;
                        }
                    } else if (ev.type === 'search_result') {
                        updateStreamSearchResult(ev.content);
                    } else if (ev.type === 'thinking') {
                        thinkingBuf += ev.content;
                        updateStreamThinking(thinkingBuf);
                    } else if (ev.type === 'text') {
                        textBuf += ev.content;
                        updateStreamText(textBuf);
                    } else if (ev.type === 'done') {
                        if (ev.id) chatId = ev.id;
                        finalizeStream(textBuf);
                    } else if (ev.type === 'error') {
                        showresult.innerHTML += `<div class="qa-block"><div class="msg-row assistant"><div class="msg-avatar">🤖</div><div class="msg-body no-bubble" style="color:red;">${escapeHTML(ev.content)}</div></div></div>`;
                    }
                }
                scrollToBottom();
            }
        } catch (err) {
            if (err.name === 'AbortError') {
                // 用户手动停止 — 替换 loading 动画为提示
                let blocks = showresult.querySelectorAll('.qa-block');
                let lastBlock = blocks[blocks.length - 1];
                if (lastBlock) {
                    let dots = lastBlock.querySelector('.loading-dot');
                    if (dots) {
                        lastBlock.querySelector('.msg-row.assistant .msg-body').innerHTML =
                            '<span style="color:#999;">⏹ 已停止</span>';
                        lastBlock.querySelector('.msg-row.assistant .msg-body').classList.remove('no-bubble');
                    }
                }
                if (streamStarted) finalizeStream(textBuf);
            } else {
                console.error('stream err:', err);
                if (streamStarted) finalizeStream(textBuf);
            }
        } finally {
            isSubmitting = false;
            document.getElementById('submit').style.display = 'flex';
            document.getElementById('btnStop').style.display = 'none';
            abortCtrl = null;
        }
    }

    function updateStreamSearchResult(text) {
        let el = document.getElementById('stream-search');
        let detail = document.getElementById('stream-search-detail');
        if (el && detail) {
            el.textContent = text;
            detail.style.display = '';
        }
        let statusEl = document.getElementById('stream-status');
        if (statusEl) statusEl.innerHTML = '📝 正在生成回答…';
    }

    function updateStreamThinking(text) {
        let body = document.getElementById('stream-body');
        if (!body) return;
        let detail = document.getElementById('stream-thinking-detail');
        if (!detail) {
            body.insertAdjacentHTML('afterbegin',
                `<details class="thinking" id="stream-thinking-detail">
                    <summary>💭 思考过程</summary>
                    <div class="thinking-content" id="stream-thinking">${text}</div></details>`);
        } else {
            document.getElementById('stream-thinking').textContent = text;
        }
    }

    function updateStreamText(text) {
        let el = document.getElementById('stream-text');
        if (el) el.innerHTML = renderMd(text);
        // 有真正内容时隐藏状态栏
        let st = document.getElementById('stream-status');
        if (st) { st.classList.add('done'); st.innerHTML = ''; }
    }

    function finalizeStream(answerText) {
        let c = document.getElementById('stream-cursor');
        if (c) c.remove();
        let st = document.getElementById('stream-status');
        if (st) { st.classList.add('done'); st.innerHTML = ''; }
        let m = document.getElementById('stream-msg');
        if (m) m.removeAttribute('id');
        let copyBtn = document.getElementById('stream-copy-btn');
        if (copyBtn && answerText) {
            copyBtn.dataset.copy = answerText.replace(/"/g, '&quot;').replace(/&/g, '&amp;');
            copyBtn.removeAttribute('id');
        }
        let acts = document.getElementById('stream-actions');
        if (acts) acts.removeAttribute('id');
        cleanupStreamIds();
    }

    function cleanupStreamIds() {
        for (let id of ['stream-body','stream-text','stream-thinking','stream-thinking-detail','stream-block','stream-copy-btn','stream-actions','stream-search','stream-search-detail','stream-status']) {
            let el = document.getElementById(id);
            if (el) el.removeAttribute('id');
        }
        let m = document.getElementById('stream-msg');
        if (m) m.removeAttribute('id');
        let c = document.getElementById('stream-cursor');
        if (c) c.remove();
    }

    function stopStream() {
        if (abortCtrl) {
            // 流式中的光标标记为已停止
            let cursor = document.getElementById('stream-cursor');
            if (cursor) { cursor.textContent = ' ⏹'; cursor.style.color = '#999'; cursor.style.animation = 'none'; }
            abortCtrl.abort();
        }
    }

    // ── 历史（含删除）──
    function loadHistory() {
        if (loadHistoryLock) return;
        loadHistoryLock = true;
        axios.post('/pv/aitools/gethishh', JSON.stringify({type:"gethishh"}), {headers:header})
            .then(res => {
                let raw = res.data.data;
                historyList = Array.isArray(raw) ? raw : Object.values(raw || {});
                let str = "";
                for (let i = 0; i < historyList.length; i++) {
                    let h = historyList[i];
                    let cls = (h.id == chatId) ? ' active' : '';
                    str += `<div class="hht${cls}" data-id="${h.id}">
                        <span class="tit" onclick="switchChat(${h.id})">${escapeHTML(h.title)}</span>
                        <span class="del-btn" onclick="event.stopPropagation();delHistory(${h.id})">✕</span>
                    </div>`;
                }
                document.getElementById('hishh').innerHTML = str;
                // 自动滚动到当前激活的历史项
                requestAnimationFrame(() => {
                    let active = document.querySelector('.hht.active');
                    if (active) active.scrollIntoView({ block: 'nearest', behavior: 'auto' });
                });
            }).catch(err => console.log('loadHistory err:', err))
            .finally(() => { loadHistoryLock = false; });
    }

    function switchChat(did) {
        if (did == chatId) return;
        let item = historyList.find(h => h.id == did);
        if (!item) return;
        displayChat(did, item.content);
    }

    function delHistory(did) {
        if (!confirm('确定删除这条对话记录吗？')) return;
        axios.post('/pv/aitools/delhistory', JSON.stringify({type:"delhistory", id: did}), {headers:header})
            .then(res => {
                console.log('delHistory:', res.data.msg);
                if (did == chatId) { chatId = 0; showWelcome(); }
                loadHistory();
            }).catch(err => console.log('delHistory err:', err));
    }

    function newhh() { chatId = 0; clearEditor(); showWelcome(); loadHistory(); }
    function scrollToBottom() {
        // requestAnimationFrame 确保 DOM 已经完成重排后再滚动
        requestAnimationFrame(() => {
            container.scrollTop = container.scrollHeight;
        });
    }
</script>
{% endblock %}
