{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent</title>
    <link href="{% static 'font/css/fa-subset.css' %}" rel="stylesheet">
    <script src="{% static 'js/marked.min.js' %}?v={{ config.STATIC_VERSION }}"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
               background: #f5f6f8; color: #333; font-size: 14px; }

        .fp-panel { height: 100%; display: flex; flex-direction: column; }

        .fp-hd { display: flex; align-items: center; gap: 8px; padding: 10px 14px;
                 background: #fff; border-bottom: 1px solid #f0f0f0; font-weight: 600;
                 font-size: 14px; color: #333; flex-shrink: 0; }
        .fp-hd .tag { font-size: 11px; font-weight: 400; color: #999; background: #f5f5f5;
                      padding: 2px 8px; border-radius: 10px; }
        .fp-hd .spacer { flex: 1; }
        .fp-newchat { border: 0; background: none; cursor: pointer; color: #4f6ef7; font-size: 12px;
                      padding: 4px 8px; border-radius: 6px; }
        .fp-newchat:hover { background: #eef1fe; }

        .fp-body { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex;
                   flex-direction: column; gap: 12px; }
        .fp-body::-webkit-scrollbar { width: 5px; }
        .fp-body::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 5px; }

        .msg-row { display: flex; }
        .msg-row + .msg-row { margin-top: 8px; }
        .msg-row.user { justify-content: flex-end; }
        .msg-body { max-width: 82%; line-height: 1.6; overflow-wrap: break-word; word-break: break-word; }
        .msg-body:not(.no-bubble) { padding: 8px 12px; border-radius: 10px; }
        .msg-row.user .msg-body:not(.no-bubble) { background: #1a1a1a; color: #fff; text-align: left; }
        .msg-row.assistant .msg-body:not(.no-bubble) { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.06); }

        .msg-body p { margin: .3em 0; }
        .msg-body ul, .msg-body ol { padding-left: 1.4em; margin: .25em 0; }
        .msg-body pre { background: #2d2d2d; color: #e8e8e8; padding: 10px 12px; border-radius: 8px;
                        overflow-x: auto; font-size: 12px; line-height: 1.45; margin: 5px 0;
                        white-space: pre-wrap; word-break: break-all; }
        .msg-body code { background: rgba(0,0,0,.05); padding: 2px 5px; border-radius: 3px; font-size: .88em; }
        .msg-body pre code { background: none; padding: 0; }
        .msg-body a { color: #4f6ef7; }
        .msg-row.user .msg-body code { background: rgba(255,255,255,.15); color: #fff; }

        .status-banner { font-size: 12px; color: #2c5cc5; margin-bottom: 4px; display: flex;
                         align-items: center; gap: 6px; }
        .status-banner.done { display: none; }
        .stream-cursor { color: #4f6ef7; animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .loading-dot { display: inline-block; width: 5px; height: 5px; margin-left: 3px;
                       border-radius: 50%; background: #4f6ef7; vertical-align: middle;
                       animation: dot-bounce 1.2s infinite ease-in-out; }
        .loading-dot:nth-child(2) { animation-delay: .2s; }
        .loading-dot:nth-child(3) { animation-delay: .4s; }
        @keyframes dot-bounce { 0%, 80%, 100% { transform: scale(0); opacity: .3; }
                                40% { transform: scale(1); opacity: 1; } }

        .stream-logs { margin: 4px 0 8px; display: flex; flex-direction: column; gap: 4px; }
        .log-item { border: 1px solid #eee; border-radius: 6px; font-size: 11px; background: #fafafa; overflow: hidden; }
        .log-item summary { cursor: pointer; padding: 4px 8px; color: #555; user-select: none; list-style: none;
                            display: flex; align-items: center; gap: 6px; }
        .log-item summary::-webkit-details-marker { display: none; }
        .log-item summary::before { content: '▸'; color: #999; transition: transform .15s; flex-shrink: 0; }
        .log-item[open] summary::before { transform: rotate(90deg); }
        .log-item pre { margin: 0; padding: 6px 8px; border-top: 1px solid #eee; background: #fff;
                        overflow: auto; white-space: pre-wrap; word-break: break-all; font-size: 11px;
                        color: #666; max-height: 160px; }
        .log-item.log-result summary { color: #2e7d32; }

        .welcome { flex: 1; display: flex; flex-direction: column; align-items: center;
                   justify-content: center; color: #aaa; font-size: 15px; text-align: center;
                   line-height: 1.8; }
        .ctx-hint { font-size: 11px; color: #999; text-align: center; padding: 4px 0; }

        .fp-foot { padding: 8px 12px 10px; border-top: 1px solid #f0f0f0; background: #fff; flex-shrink: 0; }
        .input-wrap { display: flex; align-items: flex-end; gap: 8px; border: 1px solid #e0e0e0;
                      border-radius: 10px; padding: 8px 10px; background: #fafafa; transition: border-color .2s; }
        .input-wrap:focus-within { border-color: #4f6ef7; box-shadow: 0 0 0 2px rgba(79,110,247,.1); }
        .input-editor { flex: 1; border: 0; outline: none; font-size: 14px; line-height: 1.5; margin: 4px 0;
                        max-height: 110px; overflow-y: auto; word-break: break-word; }
        .input-editor:empty::before { content: '询问当前页面相关问题…'; color: #aaa; }
        .btn-send, .btn-stop { width: 30px; height: 30px; border-radius: 8px; border: 0; cursor: pointer;
                               font-size: 15px; display: flex; align-items: center; justify-content: center;
                               flex-shrink: 0; transition: all .15s; }
        .btn-send { background: #4f6ef7; color: #fff; }
        .btn-send:hover { background: #3d5ce0; }
        .btn-send:disabled { background: #c5cff5; cursor: not-allowed; }
        .btn-stop { background: #fff; color: #999; border: 1px solid #e0e0e0; display: none; }
        .btn-stop:hover { color: #ff4d4f; border-color: #ff4d4f; }
    </style>
</head>
<body>
<div class="fp-panel">
    <div class="fp-hd">
        <span class="tag">当前页面助手</span>
        <span class="spacer"></span>
        <button class="fp-newchat" onclick="newChat()">＋ 新会话</button>
    </div>
    <div class="fp-body" id="container">
        <div class="welcome">你好，我是 Agent 🤖<br>可以针对当前页面帮你查询、分析、操作</div>
        <div class="ctx-hint" id="ctxHint"></div>
        <div id="show-result"></div>
    </div>
    <div class="fp-foot">
        <div class="input-wrap" id="inputWrap">
            <div class="input-editor" id="askwords" contenteditable="true"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();submitAsk();}"></div>
            <button class="btn-stop" id="btnStop" onclick="stopStream()" title="停止生成">■</button>
            <button class="btn-send" id="submit" onclick="submitAsk()" title="发送 (Enter)">↑</button>
        </div>
    </div>
</div>

<script>
    // 独立文档，避免依赖外部 JS 的同名函数行为差异
    function escapeHTML(s) {
        if (s == null) return '';
        var d = document.createElement('div');
        d.textContent = String(s);
        return d.innerHTML;
    }

    var showresult = document.getElementById('show-result');
    var $editor = document.getElementById('askwords');
    var isSubmitting = false;
    var abortCtrl = null;
    var chatId = 0;                 // 0 = 新会话，done 事件返回 id 后延续多轮
    var pageCtx = null;             // 父页面注入的 {path, title}

    marked.setOptions({ breaks: true, gfm: true });
    function renderMd(text) {
        if (!text) return '';
        try { return marked.parse(text); }
        catch(e) { return escapeHTML(text).replace(/\n/g, '<br>'); }
    }

    function scrollToBottom() {
        var c = document.getElementById('container');
        c.scrollTop = c.scrollHeight;
    }

    // ── 接收父页面(shell)注入的页面上下文 ──
    window.addEventListener('message', function(e) {
        // 同源校验：仅接受父窗口发来的页面上下文
        if (e.source !== window.parent) return;
        var d = e.data;
        if (d && d.type === 'page-ctx') {
            pageCtx = d;
            renderCtxHint();
        }
    });
    // 面板加载完成后，主动向父页面请求一次当前上下文
    window.parent.postMessage({ type: 'request-ctx' }, '*');

    function renderCtxHint() {
        var el = document.getElementById('ctxHint');
        if (pageCtx && pageCtx.title) {
            el.textContent = '📍 当前页面：' + pageCtx.title + '（' + (pageCtx.path || '') + '）';
        } else {
            el.textContent = '';
        }
    }

    function renderLoading(ask) {
        return '<div class="msg-row user"><div class="msg-body">' + escapeHTML(ask) + '</div></div>'
             + '<div class="msg-row assistant"><div class="msg-body no-bubble" style="display:flex;align-items:center;gap:8px;color:#2c5cc5;font-size:12px;">'
             + '<i class="fa-solid fa-hourglass"></i> AI 正在处理，请稍候</div></div>';
    }

    function renderStreamBlock(ask) {
        return '<div id="stream-block"><div class="msg-row user"><div class="msg-body">' + escapeHTML(ask) + '</div></div>'
             + '<div class="msg-row assistant"><div class="msg-body">'
             + '<div class="status-banner" id="stream-status"><i class="fa-solid fa-hourglass"></i> 正在准备…</div>'
             + '<div class="stream-logs" id="stream-logs"></div>'
             + '<span id="stream-text"></span><span class="stream-cursor" id="stream-cursor"> ▌</span>'
             + '</div></div></div>';
    }

    function renderLogItem(d) {
        if (d.step === 'tool_call') {
            var args = '';
            try { args = JSON.stringify(d.args, null, 2); } catch(e) { args = String(d.args); }
            return '<details class="log-item"><summary>🔧 调用工具 ' + escapeHTML(d.tool) + '</summary><pre>' + escapeHTML(args) + '</pre></details>';
        } else if (d.step === 'tool_result') {
            return '<details class="log-item log-result"><summary>✅ 工具 ' + escapeHTML(d.tool) + ' 返回</summary><pre>' + escapeHTML(d.result) + '</pre></details>';
        }
        return '';
    }

    async function submitAsk() {
        if (isSubmitting) return;
        var aw = $editor.innerText.trim();
        if (!aw) return;

        isSubmitting = true;
        document.getElementById('submit').disabled = true;
        document.getElementById('btnStop').style.display = 'flex';
        $editor.innerHTML = '';
        $editor.focus();

        cleanupStreamIds();
        var wel = showresult.querySelector('.welcome');
        if (wel) wel.remove();
        showresult.innerHTML += renderLoading(aw);
        scrollToBottom();

        // 拼接当前页面上下文，后端零改动即可感知“用户在哪个页面提问”
        var finalInput = aw;
        if (pageCtx && pageCtx.title) {
            finalInput = '[当前页面：' + pageCtx.title + '（' + (pageCtx.path || '') + '）]\n' + aw;
        }

        abortCtrl = new AbortController();
        var textBuf = '';
        var streamStarted = false;

        try {
            var resp = await fetch('/pv/agent/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ input: finalInput, id: chatId || 0 }),
                signal: abortCtrl.signal,
            });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);

            var reader = resp.body.getReader();
            var decoder = new TextDecoder();
            var buf = '';

            while (true) {
                var r = await reader.read();
                if (r.done) break;
                buf += decoder.decode(r.value, { stream: true });
                var parts = buf.split('\n\n');
                buf = parts.pop();
                for (var i = 0; i < parts.length; i++) {
                    var p = parts[i];
                    if (p.indexOf('data: ') !== 0) continue;
                    var ds = p.slice(6);
                    if (!ds || ds === '[DONE]') continue;
                    var ev;
                    try { ev = JSON.parse(ds); } catch(e) { continue; }

                    if (ev.type === 'start') {
                        streamStarted = true;
                        var idx = showresult.innerHTML.lastIndexOf('<div class="msg-row user"');
                        if (idx !== -1) showresult.innerHTML = showresult.innerHTML.substring(0, idx) + renderStreamBlock(aw);
                    } else if (ev.type === 'status') {
                        var el = document.getElementById('stream-status');
                        if (el) {
                            var msg;
                            if (ev.content === 'thinking') msg = '💭 分析中<span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>';
                            else if (ev.content.indexOf('调用工具') === 0) msg = '🔧 ' + escapeHTML(ev.content) + '…';
                            else msg = escapeHTML(ev.content);
                            el.innerHTML = msg;
                        }
                    } else if (ev.type === 'log') {
                        var logEl = document.getElementById('stream-logs');
                        if (logEl) {
                            var d = null;
                            try { d = JSON.parse(ev.content); } catch(e) { d = null; }
                            if (d) logEl.innerHTML += renderLogItem(d);
                        }
                    } else if (ev.type === 'text') {
                        textBuf += ev.content;
                        var tEl = document.getElementById('stream-text');
                        if (tEl) tEl.innerHTML = renderMd(textBuf);
                        var st = document.getElementById('stream-status');
                        if (st) st.classList.add('done');
                    } else if (ev.type === 'done') {
                        if (ev.id) chatId = ev.id;
                        finalizeStream(textBuf);
                    } else if (ev.type === 'error') {
                        showresult.innerHTML += '<div class="msg-row assistant"><div class="msg-body no-bubble" style="color:red;">' + escapeHTML(ev.content) + '</div></div>';
                    }
                }
                scrollToBottom();
            }
        } catch (err) {
            if (err.name === 'AbortError') {
                var blocks = showresult.querySelectorAll('.msg-row.assistant');
                var lastBlock = blocks[blocks.length - 1];
                if (lastBlock) {
                    var body = lastBlock.querySelector('.msg-body');
                    if (body && body.classList.contains('no-bubble'))
                        body.innerHTML = '<span style="color:#999;">⏹ 已停止</span>';
                }
                if (streamStarted) finalizeStream(textBuf);
            } else {
                console.error('agent stream err:', err);
                if (streamStarted) finalizeStream(textBuf);
            }
        } finally {
            isSubmitting = false;
            document.getElementById('submit').disabled = false;
            document.getElementById('btnStop').style.display = 'none';
            abortCtrl = null;
        }
    }

    function finalizeStream() {
        var c = document.getElementById('stream-cursor');
        if (c) c.remove();
        var st = document.getElementById('stream-status');
        if (st) st.classList.add('done');
        cleanupStreamIds();
    }

    function cleanupStreamIds() {
        ['stream-block', 'stream-text', 'stream-status', 'stream-logs'].forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.removeAttribute('id');
        });
        var c = document.getElementById('stream-cursor');
        if (c) c.remove();
    }

    function stopStream() {
        if (abortCtrl) abortCtrl.abort();
    }

    function newChat() {
        chatId = 0;
        $editor.innerHTML = '';
        showresult.innerHTML = '<div class="welcome">你好，我是 Agent 🤖<br>可以针对当前页面帮你查询、分析、操作</div>';
        renderCtxHint();
    }
</script>
</body>
</html>
