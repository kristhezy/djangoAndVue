{% extends 'base.html' %}
{% block content %}
<style>
    .right.part {
        display: flex;
        flex-direction: row;
        gap: 12px;
        padding: 10px;
        height: 98%;
        overflow: hidden;
    }

    .column {
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
        min-width: 280px;
        overflow-y: auto;
        height: 100%;
        padding-top: 4px;
    }

    .column::-webkit-scrollbar { width: 5px; }
    .column::-webkit-scrollbar-track { background: transparent; }
    .column::-webkit-scrollbar-thumb { background: #c0c0c0; border-radius: 10px; }
    .column::-webkit-scrollbar-thumb:hover { background: #999; }

    .card {
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        overflow: hidden;
        flex-shrink: 0;
        border: 1px solid #e9e9e9;
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 20px;
        cursor: pointer;
        background: #f0f2f5;
        border-bottom: 1px solid #f0f0f0;
        transition: background 0.3s;
        user-select: none;
    }

    .card-header:hover {
        background: #fafafa;
    }

    .card-header h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: #1a1a1a;
    }

    .card-toggle {
        font-size: 12px;
        color: #666;
        transition: transform 0.3s;
    }

    .card.collapsed .card-toggle {
        transform: rotate(-90deg);
    }

    .card-body {
        padding: 16px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        max-height: 600px;
        transition: max-height 0.3s ease-out, padding 0.3s ease-out, opacity 0.3s;
        opacity: 1;
    }

    /* 表单区域：只包 label+input，负责两列对齐 + 居中，不受 radio/按钮等整行元素宽度影响 */
    .form-grid {
        display: grid;
        grid-template-columns: max-content 200px;
        column-gap: 8px;
        row-gap: 8px;
        align-items: center;
    }

    .card.collapsed .card-body {
        max-height: 0;
        padding: 0 16px;
        opacity: 0;
        overflow: hidden;
    }

    .form-group {
        display: contents;
    }

    .form-group label {
        text-align: right;
        font-size: 14px;
        white-space: nowrap;
    }

    .form-group input,
    .form-group select {
        width: 200px;
        padding: 6px 12px;
        border: 1px solid #d9d9d9;
        border-radius: 8px;
        outline: none;
        transition: border-color 0.3s;
        font-size: 14px;
    }

    .form-group input:focus,
    .form-group select:focus {
        border-color: #4f6ef7;
    }

    .form-group input::placeholder {
        color: #999;
        font-size: 12px;
    }

    .result {
        flex: 1;
        margin-top: 10px;
        padding: 10px;
        border: 0px solid #f0f0f0;
        border-radius: 8px;
        overflow-y: auto;
        overflow-x: hidden;
        font-size: 15px;
        text-align: center;
        width: 100%;
        min-height: 50px;
        word-wrap: break-word;
        word-break: break-all;
        white-space: pre-wrap;
    }

    .radio-group {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin: 10px 0;
        flex-wrap: wrap;
    }

    .radio-group label {
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 5px 16px;
        border-radius: 9999px;
        border: 1px solid #d1d5db;
        background: #fff;
        font-size: 14px;
        transition: all .15s;
        user-select: none;
    }
    .radio-group label:has(input:checked) {
        background: #6366f1;
        color: #fff;
        border-color: #6366f1;
    }
    .radio-group input[type="radio"] {
        display: none;
    }

    .checkbox-group {
        display: flex;
        align-items: center;
        gap: 2px;
        margin-top: 8px;
    }

    .checkbox-group label {
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
    }

    .right.part::-webkit-scrollbar {
        width: 5px;
    }

    .right.part::-webkit-scrollbar-thumb {
        background-color: rgba(0, 0, 0, 0.3);
        border-radius: 10px;
    }
</style>

<div class='right part'>
    <!-- 第一列 -->
    <div class="column">
        <!-- 卡片1: 综合查询 -->
        <div class="card">
            <div class="card-header">
                <h1>综合查询</h1>
                <span class="card-toggle">▼</span>
            </div>
            <div class="card-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label id="seoCidLabel">登录账号:</label>
                        <input id="companyId1" type="text" placeholder="请输入查询参数"/>
                    </div>
                    <div class="form-group">
                        <label>查询类型:</label>
                        <select id="selrlt" onchange="changeIP(this)">
                            <option value="qcompid">SAAS手机号查询企业ID</option>
                            <option value="oqcompid">基线版手机号查询企业ID</option>
                            <option value="qwwid">查询企业微信ID</option>
                            <option value="qocbind">查询公众号小程序绑定</option>
                            <option value="qwappbind">查询小程序/企微绑定</option>
                            <option value="qopencorpid">根据明文查询密文企微ID</option>
                        </select>
                    </div>
                </div>
                <div class="btn-group">
                    <button id='btn1' class="btn btn--primary">查询 >></button>
                    <button type="button" class="btn btn--secondary" data-draft-reset>重置</button>
                </div>
                <div id="rltdiv2" class="result"></div>
            </div>
        </div>
        <!-- 卡片3: 定制化小程序配置 -->
        <div class="card">
            <div class="card-header">
                <h1>定制化小程序配置</h1>
                <span class="card-toggle">▼</span>
            </div>
            <div class="card-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label>企业ID:</label>
                        <input id="companyId5" type="text" placeholder="请输入企业ID"/>
                    </div>
                    <div class="form-group">
                        <label>小程序ID:</label>
                        <input id="appletCorpId" type="text" placeholder="请输入小程序ID"/>
                    </div>
                    <div class="form-group">
                        <label>SECRET:</label>
                        <input id="appletSecretKey" type="text" placeholder="请输入Secret"/>
                    </div>
                </div>
                <div class="radio-group">
                    <label><input id="dz" name="applet" type="radio" value="dz"/> 转介绍3.0</label>
                    <label><input id="zs" name="applet" type="radio" value="zs" checked/> Saleskits</label>
                    <label><input id="org" name="applet" type="radio" value="org"/> 基线版</label>
                </div>
                <div style="display: flex; align-items: center; gap: 15px; margin-top: 10px;">
                    <div class="checkbox-group" style="margin: 0;">
                        <input id="istest" type="checkbox"/>
                        <label for="istest">测试环境</label>
                    </div>
                    <div class="btn-group">
                        <button id='btn5' class="btn btn--primary">提交 >></button>
                        <button type="button" class="btn btn--secondary" data-draft-reset style="margin-left:12px">重置</button>
                    </div>
                </div>
                <div id="rltdiv6" class="result"></div>
            </div>
        </div>

    </div>

    <!-- 第二列 -->
    <div class="column">
        <!-- 卡片2: 配置隐私保护 -->
        <div class="card">
            <div class="card-header">
                <h1>配置隐私保护</h1>
                <span class="card-toggle">▼</span>
            </div>
            <div class="card-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label>企业ID:</label>
                        <input id="companyId4" type="text" placeholder="请输入企业ID"/>
                    </div>
                </div>
                <div class="btn-group">
                    <button id='btn4' class="btn btn--primary">提交 >></button>
                    <button type="button" class="btn btn--secondary" data-draft-reset style="margin-left:12px">重置</button>
                </div>
                <div id="rltdiv5" class="result"></div>
            </div>
        </div>

        <!-- 卡片4: 绑定企业和企微加密corpid -->
        <div class="card">
            <div class="card-header">
                <h1>绑定企业和企微加密corpid</h1>
                <span class="card-toggle">▼</span>
            </div>
            <div class="card-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label>企业ID:</label>
                        <input id="companyId3" type="text" placeholder="请输入企业ID"/>
                    </div>
                    <div class="form-group">
                        <label>企微ID:</label>
                        <input id="corpId3" type="text" placeholder="请输入企微ID"/>
                    </div>
                </div>
                <div class="btn-group">
                    <button id='btn3' class="btn btn--primary">提交 >></button>
                    <button type="button" class="btn btn--secondary" data-draft-reset style="margin-left:12px">重置</button>
                </div>
                <div id="rltdiv3" class="result"></div>
            </div>
        </div>
    </div>

    <!-- 第三列 -->
    <div class="column">
        <!-- 卡片5: 激活注销手机号 -->
        <div class="card">
            <div class="card-header">
                <h1>激活注销手机号</h1>
                <span class="card-toggle">▼</span>
            </div>
            <div class="card-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label>手机号码:</label>
                        <input id="tel" type="text" placeholder="请输入手机号" maxlength="11"/>
                    </div>
                </div>
                <div class="btn-group">
                    <button id='btn7' class="btn btn--primary">激活 >></button>
                    <button type="button" class="btn btn--secondary" data-draft-reset style="margin-left:12px">重置</button>
                </div>
                <div id="rltdiv8" class="result"></div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">

    // 卡片折叠/展开功能
    document.addEventListener('DOMContentLoaded', function() {
        const cardHeaders = document.querySelectorAll('.card-header');
        cardHeaders.forEach(header => {
            header.addEventListener('click', function() {
                const card = this.parentElement;
                card.classList.toggle('collapsed');
            });
        });
    });

    // 查询企业微信ID、查询公众号小程序绑定、查询企微应用
    document.getElementById('btn1').addEventListener('click', function() {
        var cid = document.getElementById('companyId1').value;
        var sel = document.getElementById('selrlt').value;
        console.log('sel:', sel);
        var data = JSON.stringify({
            "companyId": cid,
            "env": "prod"
        });

        if (cid.length == 0) {
            alert('查询参数不能为空！');
            return;
        }
        if (!sel) {
            alert('查询类型不能为空！');
            return;
        }

        let rltdiv2 = document.getElementById('rltdiv2');
        if (sel == 'qcompid' || sel == 'oqcompid') {
            if (cid.length != 11) {
                alert('请输入正确的手机号！');
                return;
            }
            let sysvs = sel === 'qcompid' ? "saas" : "origin";
            rltdiv2.innerHTML = "<img src='../static/img/loading.gif' height='10'/>";
            axios.post(`/sv/querycompid/${sysvs}`, data, {headers: header})
                .then(response => {
                    var res = response.data;
                    const cid = res.data.cid;
                    const cn = res.data.cn;
                    console.log('查询企业ID succ:', res);
                    rltdiv2.innerHTML = `${cn} (${cid})`;
                })
                .catch(err => { console.log(`查询企业ID err: ${err}`); });
        }
        if (sel == 'qwwid') {
            rltdiv2.innerHTML = "<img src='../static/img/loading.gif' height='10'/>";
            axios.post(`/sv/queryci`, data, {headers: header})
                .then(response => {
                    var res = response.data;
                    rltdiv2.innerHTML = res.data;
                    console.log('查询企业微信ID succ:', res);
                })
                .catch(err => { console.log(`查询企业微信 err: ${err}`); });
        } else if (sel == 'qocbind') {
            rltdiv2.innerHTML = "<img src='../static/img/loading.gif' height='10'/>";
            axios.post(`/sv/queryca`, data, {headers: header})
                .then(response => {
                    var res = response.data;
                    console.log('查询公众号小程序绑定succ:', res);
                    rltdiv2.innerHTML = res.data;
                })
                .catch(err => { console.log(`查询公众号小程序绑定err: ${err}`); });
        } else if (sel == 'qwappbind') {
            rltdiv2.innerHTML = "<img src='../static/img/loading.gif' height='10'/>";
            axios.post(`/sv/queryaal`, data, {headers: header})
                .then(response => {
                    var res = response.data;
                    console.log('查询企微应用s:', res);
                    rltdiv2.innerHTML = res.data;
                });
        } else if (sel == 'qopencorpid') {
            rltdiv2.innerHTML = "<img src='../static/img/loading.gif' height='10'/>";
            axios.post(`/sv/querySCID`, data, {headers: header})
                .then(response => {
                    var res = response.data;
                    console.log('获取密文企微ID succ:', res);
                    rltdiv2.innerHTML = res.data;
                });
        }
    });

    // 绑定企业和企微加密corpid
    document.getElementById('btn3').addEventListener('click', function() {
        var cid = document.getElementById('companyId3').value;
        var corpid = document.getElementById('corpId3').value;
        var data = JSON.stringify({
            'companyId': cid,
            'corpId': corpid
        });

        if (cid.length == 0) {
            alert('企业id不能为空！');
            return;
        }
        if (corpid.length == 0) {
            alert('corpId不能为空！');
            return;
        }

        const rltdiv3 = document.getElementById('rltdiv3');
        rltdiv3.innerHTML = "<img src='../static/img/loading.gif' height='10'/>";
        axios.post(`/sv/selfcreatedCS`, data, {headers: header})
            .then(response => {
                var res = response.data;
                console.log('查询企业微信IDs:', res);
                rltdiv3.innerHTML = res.data;
            });
    });

    // 配置隐私保护
    document.getElementById('btn4').addEventListener('click', function() {
        var cid = document.getElementById('companyId4').value;
        var data = JSON.stringify({
            "companyId": cid
        });

        if (!cid.trim()) {
            alert('企业id不能为空！');
            return;
        }
        if (cid.length < 18) {
            alert('企业id不能少于18位！');
            return;
        }
        if (numberCheck(cid)) {
            alert('企业id只能是纯数字！');
            return;
        }

        const rltdiv5 = document.getElementById('rltdiv5');
        rltdiv5.innerHTML = "<img src='../static/img/loading.gif' height='10'/>";
        axios.post(`/sv/privset`, data, {headers: header})
            .then(response => {
                var res = response.data;
                rltdiv5.innerHTML = res.data;
            });
    });

    // 定制化小程序配置
    document.getElementById('btn5').addEventListener('click', function() {
        var cid = document.getElementById('companyId5').value;
        var corpid = document.getElementById('appletCorpId').value;
        var secretkey = document.getElementById('appletSecretKey').value;
        var applet = document.querySelector("input[name='applet']:checked").value;
        var istest = document.getElementById('istest');
        istest = istest.checked ? true : false;
        console.log("istest:", istest);

        var data = JSON.stringify({
            "companyId": cid,
            "corpId": corpid,
            "secretKey": secretkey,
            "applet": applet,
            "istest": istest
        });
        console.log('data:', data);

        if (cid.length == 0 || corpid.length == 0 || secretkey.length == 0) {
            if (cid.length == 0) {
                alert('企业id不能为空！');
                return;
            }
            if (corpid.length == 0) {
                alert('小程序id不能为空！');
                return;
            }
            if (secretkey.length == 0) {
                alert('secretKey不能为空！');
                return;
            }
        }
        if (applet === "zs" || applet === "dz") {
            if (cid.length < 18) {
                alert('企业id不能少于18位！');
                return;
            }
        }
        if (isNaN(cid)) {
            alert('企业id只能是纯数字！');
            return;
        }

        const rltdiv6 = document.getElementById('rltdiv6');
        rltdiv6.innerHTML = "<img src='../static/img/loading.gif' height='10'/>";
        axios.post(`/sv/dzapplet`, data, {headers: header})
            .then(response => {
                var res = response.data;
                rltdiv6.innerHTML = res.data;
            });
    });

    // 激活注销手机号
    document.getElementById('btn7').addEventListener('click', function() {
        var tel = document.getElementById('tel').value;
        var data = JSON.stringify({
            'phoneNumber': tel,
            'env': 'prod'
        });

        if (tel.length != 11) {
            alert('手机号只能是11位！');
            return;
        }
        if (isNaN(tel)) {
            alert('手机号只能是纯数字！');
            return;
        }

        const rltdiv8 = document.getElementById('rltdiv8');
        rltdiv8.innerHTML = "<img src='../static/img/loading.gif' height='10'/>";
        axios.post(`/sv/removeTagTel`, data, {headers: header})
            .then(response => {
                var res = response.data.data;
                console.log('激活注销手机号succ:', res);
                rltdiv8.innerHTML = res;
            });
    });

    function trimInput(input) {
        input.value = input.value.trim();
    }

    function changeIP(select) {
        var valSelect = select.value;
        console.log('valselect:', valSelect);
        if (valSelect == 'qopencorpid') {
            document.getElementById('seoCidLabel').textContent = '明文ID:';
        } else if (valSelect == 'qcompid') {
            defvalue();
        } else {
            document.getElementById('seoCidLabel').textContent = '企业ID:';
        }
    }

    function defvalue() {
        document.getElementById('seoCidLabel').textContent = '登录账号:';
    }

    window.onload = defvalue();
</script>
{%endblock%}
