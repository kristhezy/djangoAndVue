{% extends 'base.html' %}
{% block content %}
{% load static %}

<style>
    /* 操作变更记录：本页布局结构（控件 btn/input/select 仍走 components.css） */
    .page-cols {
        height: 100vh;
        display: flex;
        gap: 16px;
        padding: 16px;
        background: #f0f2f5;
        overflow: hidden;
    }
    .page-cols--vertical { flex-direction: column; }

    /* 筛选卡片 */
    .filter-card {
        background: #fff;
        border-radius: var(--radius-2xl);
        box-shadow: var(--shadow-md);
        flex-shrink: 0;
        overflow: hidden;
    }
    .filter-card__header {
        padding: 12px 20px;
        border-bottom: 1px solid var(--gray-100);
        font-size: 16px;
        font-weight: 600;
        color: var(--gray-800);
    }
    .filter-card__body {
        padding: 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
    }
    .filter-select,
    .filter-input {
        padding: 8px 12px;
        border-radius: var(--radius-lg);
        border: 1px solid var(--gray-300);
        font-size: 14px;
        background: #fff;
        outline: none;
    }
    .filter-select:focus,
    .filter-input:focus { border-color: var(--indigo-500); }
    .filter-input::placeholder { color: var(--gray-400); }

    /* 结果表格卡片 */
    .table-card {
        flex: 1;
        background: #fff;
        border-radius: var(--radius-2xl);
        box-shadow: var(--shadow-md);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
    }
    .table-card__scroll { flex: 1; overflow: auto; }
    .table-card__footer {
        padding: 16px;
        border-top: 1px solid var(--gray-100);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
    }

    /* 操作记录表 */
    .ops-table { width: 100%; table-layout: fixed; font-size: 14px; border-collapse: collapse; }
    .ops-table thead {
        position: sticky;
        top: 0;
        background: var(--gray-50);
        color: var(--gray-600);
        text-align: left;
        z-index: 1;
        font-size: 16px;
        font-weight: 800;
    }
    .ops-table th { padding: 12px 16px; font-weight: 500; text-align: left; }
    .ops-table tbody tr{height: 60px; border-bottom: var(--gray-100) solid 1px;}
    .ops-table td { padding: 10px 16px; }
    .ops-table .col-seq { width: 5%; }
    .ops-table .col-env { width: 8%; }
    .ops-table .col-cid { width: 12%; }
    .ops-table .col-cname { width: 15%; }
    .ops-table .col-user { width: 5%; }
    .ops-table .col-time { width: 8%; }
    .ops-row:hover { background: var(--gray-50); }
    .td-muted { color: var(--gray-500); }
    .td-dim { color: var(--gray-600); }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ops-msg { word-break: break-word; }
    .ops-del {
        opacity: 0;
        color: var(--red-500);
        border: 0;
        background: transparent;
        cursor: pointer;
        transition: opacity var(--transition-fast);
    }
    .ops-row:hover .ops-del { opacity: 1; }
    .ops-del:hover { color: var(--red-600); }
    .fstd { width: 4%; }

    /* 模态框 */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    .modal-box {
        background: #fff;
        border-radius: var(--radius-2xl);
        padding: 24px;
        max-width: 90vw;
        max-height: 85vh;
        overflow: auto;
        box-shadow: var(--shadow-xl);
    }
</style>

<div class="page-cols page-cols--vertical">

    <!-- 筛选卡片 -->
    <div class="filter-card">
        <div class="filter-card__header">操作变更记录</div>
        <div class="filter-card__body">
            <select id="env" class="filter-select">
                <option value="" selected>选择环境</option>
                <option value="prod">生产</option>
                <option value="test">测试</option>
            </select>
            <select id="vers" class="filter-select">
                <option value="" selected>选择版本</option>
                <option value="4">Soon</option>
                <option value="3">基线版</option>
                <option value="6">通威版</option>
                <option value="1">SAAS</option>
            </select>
            <input id="compid" type="text" class="filter-input" placeholder="输入企业ID" onkeydown="return banInputSapce(event);" onKeyup="return inputSapceTrim(event,this);" />
            <input id="compname" type="text" class="filter-input" placeholder="输入企业名称" onkeydown="return banInputSapce(event);" onKeyup="return inputSapceTrim(event,this);" />
            <input id="message" type="text" class="filter-input" placeholder="输入操作信息" onkeydown="return banInputSapce(event);" onKeyup="return inputSapceTrim(event,this);" />
            <select id="unmae" class="filter-select">
                <option value="" selected>选择操作人</option>
            </select>
            <button id="chaxun" class="btn btn--primary"><span>查询</span></button>
            <button id="reset" class="btn btn--secondary"><span>重置</span></button>
        </div>
    </div>

    <!-- 结果表格卡片 -->
    <div class="table-card">
        <div class="table-card__scroll scrollbar">
            <table class="ops-table">
                <thead>
                    <tr>
                        <th class="col-seq">序号</th>
                        <th class="col-env">环境</th>
                        <th class="col-cid">企业ID</th>
                        <th class="col-cname">企业名称</th>
                        <th>操作信息 <span style="color:var(--gray-400); font-size:12px">(悬停展示删除按钮)</span></th>
                        <th class="col-user">操作人</th>
                        <th class="col-time">操作时间</th>
                    </tr>
                </thead>
                <tbody id="shuju"></tbody>
            </table>
        </div>
        <div class="table-card__footer">
            <div id="tongji" style="font-size:14px; color:var(--gray-500)"></div>
            <div id="xinxi" style="font-size:14px"></div>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="modal-overlay" id="isdelete">
        <div class="modal-box" style="min-width:300px; text-align:center">
            <div style="font-weight:500; font-size:16px; margin-bottom:12px"><span>⚠️</span> 确定删除<span id="delcont"></span>吗？</div>
            <div id="sacbtn" style="display:flex; justify-content:center; gap:12px">
                <button id="suredel" class="btn btn--danger" style="padding:8px 24px">确定</button>
                <button id="canceldel" class="btn btn--secondary" style="padding:8px 24px">取消</button>
            </div>
        </div>
    </div>

</div>

<script src="{% static 'js/other.js' %}"></script>
{% endblock %}
