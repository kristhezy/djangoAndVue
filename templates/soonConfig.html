{% extends 'base.html' %}
{% block content %}
<style>
    .right.part {
        display: flex;
        flex-direction: row;
        gap: 12px;
        padding: 10px;
        height: 99%;
        overflow: hidden;
    }

    .column {
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex: 1;
        min-width: 280px;
        overflow-y: auto;
        height: 100%;
        padding-top: 4px;
    }

    .column::-webkit-scrollbar { width: 5px; }
    .column::-webkit-scrollbar-track { background: transparent; }
    .column::-webkit-scrollbar-thumb { background: #c0c0c0; border-radius: 10px; }
    .column::-webkit-scrollbar-thumb:hover { background: #999; }

    .card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
        overflow: hidden;
        flex-shrink: 0;
        border: 1px solid #e9e9e9;
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 20px;
        cursor: pointer;
        background: #f0f2f5;
        border-bottom: 1px solid #f0f0f0;
        transition: background 0.3s;
        user-select: none;
    }

    .card-header:hover {
        background: #fafafa;
    }

    .card-header h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: #1a1a1a;
    }

    .card-toggle {
        font-size: 12px;
        color: #666;
        transition: transform 0.3s;
    }

    .card.collapsed .card-toggle {
        transform: rotate(-90deg);
    }

    .card-body {
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-height: 600px;
        transition: max-height 0.3s ease-out, padding 0.3s ease-out, opacity 0.3s;
        opacity: 1;
    }

    .card.collapsed .card-body {
        max-height: 0;
        padding: 0 16px;
        opacity: 0;
        overflow: hidden;
    }

    /* 表单区域：只包 label+input，两列对齐(max-content自适应) + 居中，避免固定宽度魔法数字 */
    .form-grid {
        display: grid;
        grid-template-columns: max-content 180px;
        column-gap: 8px;
        row-gap: 8px;
        align-items: center;
    }

    .form-group {
        display: contents;
    }

    .form-group label {
        text-align: right;
        white-space: nowrap;
    }

    .form-group label .required {
        color: red;
    }

    .form-group input,
    .form-group select {
        width: 180px;
        padding: 6px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        outline: none;
        transition: border-color 0.3s;
        text-align: center;
    }

    #cryptoValue {
        width: 303px;
        padding: 6px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        outline: none;
        resize: vertical;
        font-family: monospace;
        font-size: 13px;
        transition: border-color 0.3s;
    }
    #cryptoValue:focus {
        border-color: #6366f1;
    }

    .form-group input:focus,
    .form-group select:focus {
        border-color: #6366f1;
    }

    .env-group {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 10px 0;
    }

    .env-group label {
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 5px 16px;
        border-radius: 9999px;
        border: 1px solid #d1d5db;
        background: #fff;
        font-size: 13px;
        transition: all .15s;
        user-select: none;
    }
    .env-group label:has(input:checked) {
        background: #6366f1;
        color: #fff;
        border-color: #6366f1;
    }
    .env-group input[type="radio"] {
        display: none;
    }

    .btn-group {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 15px;
    }

    .btn-reset {
        background: #fff;
        border: 1px solid #d1d5db;
        color: #000000;
    }

    .btn-submit {
        background: #111827;
        border: none;
        color: white;
        font-weight: bold;
    }

    .btn-submit:hover {
        background: #374151;
    }

    .result {
        flex: 1;
        margin-top: 0px;
        padding: 10px;
        border: 0px solid #f0f0f0;
        border-radius: 8px;
        overflow-y: auto;
        overflow-x: hidden;
        font-size: 15px;
        text-align: center;
        width: 100%;
        word-wrap: break-word;
        word-break: break-all;
        white-space: pre-wrap;
    }

    .tab-group {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-bottom: 15px;
        padding: 4px;
        background: #f0f2f5;
        border-radius: 10px;
    }

    .tab-group .tab-item {
        padding: 7px 20px;
        cursor: pointer;
        background: transparent;
        color: #555;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.25s ease;
    }

    .tab-group .tab-item:hover {
        background: rgba(99, 102, 241, 0.08);
        color: #6366f1;
    }

    .tab-group label:has(input:checked) .tab-item {
        background: #fff;
        color: #6366f1;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        font-weight: 600;
    }

    .tab-group input[type="radio"] {
        display: none;
    }

    .tab-group label {
        cursor: pointer;
        margin: 0;
        display: flex;
    }

    .note {
        color: gray;
        font-size: 12px;
        margin-bottom: 10px;
    }

    .sub-result {
        margin-bottom: 10px;
        min-height: 20px;
        text-align: center;
        display: none;
    }

    .date-wrapper {
        display: flex;
        align-items: center;
    }

    .date-wrapper input[type="date"] {
        width: 160px;
    }

    .date-wrapper input[type="checkbox"] {
        width: 15px;
        margin-left: 8px;
    }

    .disabled-label {
        color: #aaa;
        cursor: not-allowed;
    }
</style>

<script type="text/javascript">
    // ====== 卡片折叠/展开功能 ======
    document.addEventListener('DOMContentLoaded', function() {
        const cardHeaders = document.querySelectorAll('.card-header');
        cardHeaders.forEach(hdr => {
            hdr.addEventListener('click', function() {
                const card = this.parentElement;
                card.classList.toggle('collapsed');
            });
        });

        // 初始执行一次（设置默认状态）
        handleRadioChange();

        // 给所有单选框绑定change事件
        const radioList = document.querySelectorAll('input[type="radio"]');
        radioList.forEach(radio => {
            radio.addEventListener('change', handleRadioChange);
        });

        // 初始化各模块默认状态
        initRpv();
        initGfl();
        initDad();
        bindset();

        // 邮箱查询用户ID：失焦和回车事件
        const emorpInput = document.getElementById('emorp');
        emorpInput.addEventListener('blur', function() {
            if (emorpInput.value !== "") {
                getUidByEmail();
            }
        });

    // ====== 统一处理所有radio切换 ======
    function handleRadioChange() {
        const iptradio = document.querySelectorAll('input[type="radio"]:checked');
        iptradio.forEach(radio => {
            const radioId = radio.id;
            const pv = document.getElementById('pversion');
            const cardidtr = document.getElementById('cardidtr');
            const ccname = document.getElementById('ccname');
            const ccid = document.getElementById('ccid');

            // 修改SOON版会员 - 个人版/企业版切换
            switch (radioId) {
                case 'pers':
                    if (pv) {
                        pv.value = "";
                        pv.options[1].style.display = "";
                        pv.options[2].style.display = "none";
                    }
                    if (cardidtr) cardidtr.style.display = "";
                    document.getElementById("compId2").value = 0;
                    break;
                case 'comp':
                    if (pv) {
                        pv.value = "";
                        pv.options[1].style.display = "none";
                        pv.options[2].style.display = "";
                    }
                    if (cardidtr) cardidtr.style.display = "none";
                    document.getElementById("compId2").value = "";
                    document.getElementById("compId2").placeholder = "输入企业ID";
                    break;
                case 'persFour':
                    ccname.innerHTML = "员&nbsp;工&nbsp;I&nbsp;D:";
                    ccid.placeholder = "输入员工ID";
                    break;
                case 'compFour':
                    ccname.innerHTML = "企&nbsp;业&nbsp;I&nbsp;D:";
                    ccid.placeholder = "输入企业ID";
                    break;
                case 'snfc':
                    document.getElementById("cardidtr4").style.display = "";
                    break;
                case 'rmv':
                    document.getElementById("cardidtr4").style.display = "none";
                    break;
            }

            // 物料类型切换
            const mtlist = [{"rid":"dcard","lid":"dcl"},{"rid":"file","lid":"fnl"},{"rid":"video","lid":"vnl"},{"rid":"product","lid":"pnl"},{"rid":"case","lid":"cnl"}];
            const ridl = ["dcard","file","video","product","case"];
            if (ridl.includes(radioId)) {
                for (var mi = 0; mi < mtlist.length; mi++) {
                    var mt = mtlist[mi];
                    if (radioId == mt.rid) {
                        if (mt.rid == "dcard") {
                            document.getElementById("fileId").value = 0;
                        } else {
                            document.getElementById("fileId").value = "";
                            document.getElementById("fileId").placeholder = "输入materialId";
                        }
                    }
                }
            }
        });
    }
