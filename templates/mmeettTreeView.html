{% extends 'base.html' %}
{% block content %}
{% load static %}
<link rel="stylesheet" href="{% static 'orgchart/css/jquery.orgchart.min.css' %}">
<style>
    .page-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 20px 0;
    }
    .page-header .back-btn {
        padding: 6px 16px;
        background: #f0f2f5;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        color: #555;
    }
    .page-header .back-btn:hover { background: #e4e6e9; }
    .page-header .title {
        font-size: 16px;
        font-weight: 600;
        color: #333;
    }
    .page-header .user-info {
        margin-left: auto;
        font-size: 13px;
        color: #888;
    }

    #chart-container {
        width: 100%;
        height: calc(100vh - 180px);
        overflow: auto;
        position: relative;
        background: #f5f7fa;
        margin-top: 12px;
        text-align: center;
        cursor: grab;
    }
    #chart-container:active {
        cursor: grabbing;
    }

    .orgchart {
        display: block !important;
        margin: 0 auto;
        width: fit-content;
        min-width: 100%;
        background-image: none !important;
        padding: 30px;
    }
    .orgchart .nodes {
        justify-content: center;
    }

    .orgchart .hierarchy::before {
        border-top-color: #ccc !important;
        border-top-width: 2px !important;
    }
    .orgchart .hierarchy:not(.hidden):not(.spouse):only-child::before {
        width: 2px !important;
        left: calc(50% - 1px) !important;
    }
    .orgchart .hierarchy:first-child::before {
        left: calc(50% - 1px) !important;
        width: calc(50% + 1px) !important;
    }
    .orgchart .hierarchy:last-child::before {
        width: calc(50% + 1px) !important;
    }
    .orgchart>.nodes>.hierarchy::before {
        content: none !important;
    }
    .orgchart .hierarchy>.node::after,
    .orgchart .hierarchy>.node::before {
        background-color: #ccc !important;
    }

    .orgchart .node {
        width: 120px !important;
        margin: 0 4px 20px !important;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .orgchart .node .title {
        width: 100% !important;
        height: 26px !important;
        background: #6366f1;
        border-radius: 8px 8px 0 0;
        font-size: 11px;
        line-height: 26px !important;
    }
    .orgchart .node.root-node .title {
        background: #722ed1;
    }
    .orgchart .node .content {
        width: 100% !important;
        height: auto !important;
        min-height: 56px;
        background: #fff;
        border-radius: 0 0 8px 8px;
        border: 1px solid #e0e0e0 !important;
        border-top: none !important;
        font-size: 10px;
        padding: 4px 2px;
    }
    .orgchart .node .badge-row {
        display: flex;
        gap: 3px;
        justify-content: center;
        margin-bottom: 2px;
    }
    .orgchart .node .badge {
        padding: 1px 4px;
        border-radius: 6px;
        font-size: 9px;
        font-weight: 500;
    }
    .orgchart .node .stats-row {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        font-size: 9px;
        color: #888;
        line-height: 1.3;
    }
    .orgchart .node .stat-l { color: #52c41a; }
    .orgchart .node .stat-r { color: #6366f1; }

    /* 隐藏 orgchart 自带的展开/收起按钮 */
    .orgchart .node .topEdge,
    .orgchart .node .bottomEdge,
    .orgchart .node .leftEdge,
    .orgchart .node .rightEdge,
    .orgchart .node .toggleBtn {
        display: none !important;
    }

    /* 自定义展开/收起按钮 */
    .orgchart .node .toggle-btn {
        display: inline-block;
        margin-top: 4px;
        padding: 2px 10px;
        background: #6366f1;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 10px;
        cursor: pointer;
        line-height: 1.4;
    }
    .orgchart .node .toggle-btn:hover {
        background: #4f46e5;
    }

    .loading-overlay {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 200px;
        color: #999;
    }

    /* 用户信息弹窗 */
    .user-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.4);
        z-index: 9999;
        justify-content: center;
        align-items: center;
    }
    .user-modal.show {
        display: flex;
    }
    .user-modal-content {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        min-width: 360px;
        max-width: 420px;
        padding: 0;
        overflow: hidden;
    }
    .user-modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        background: #f8f9fa;
        border-bottom: 1px solid #eee;
    }
    .user-modal-header h3 {
        margin: 0;
        font-size: 15px;
        color: #333;
    }
    .user-modal-close {
        border: none;
        background: none;
        font-size: 20px;
        color: #999;
        cursor: pointer;
        padding: 0 4px;
    }
    .user-modal-close:hover { color: #333; }
    .user-modal-body {
        padding: 16px;
    }
    .user-modal-body .info-row {
        display: flex;
        padding: 6px 0;
        border-bottom: 1px solid #f0f0f0;
    }
    .user-modal-body .info-row:last-child { border-bottom: none; }
    .user-modal-body .info-label {
        width: 110px;
        color: #888;
        font-size: 13px;
        flex-shrink: 0;
    }
    .user-modal-body .info-value {
        flex: 1;
        color: #333;
        font-size: 13px;
        word-break: break-all;
    }

    /* 工具栏 - 隐藏 */
    .tree-toolbar { display: none; }

    /* 安置弹窗 */
    .placement-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.45); z-index: 9999; justify-content: center; align-items: center; }
    .placement-modal.show { display: flex; }
    .placement-modal-content { background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.25); width: 720px; max-height: 80vh; display: flex; flex-direction: column; }
    .placement-modal-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid #eee; background: #f8f9fa; border-radius: 12px 12px 0 0; }
    .placement-modal-header h3 { margin: 0; font-size: 15px; color: #333; }
    .placement-modal-close { border: none; background: none; font-size: 20px; color: #999; cursor: pointer; }
    .placement-modal-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .placement-modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 20px; border-top: 1px solid #eee; }
    .placement-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .placement-table th { background: #f5f5f5; padding: 8px 6px; text-align: center; border-bottom: 2px solid #e0e0e0; font-weight: 600; color: #555; white-space: nowrap; }
    .placement-table td { padding: 8px 6px; text-align: center; border-bottom: 1px solid #f0f0f0; }
    .placement-table tbody tr:hover { background: #eef2ff; cursor: pointer; }
    .placement-table tbody tr.selected { background: #c7d2fe; }
    .placement-table .radio-col { width: 40px; }
    .placement-table input[type="radio"] { accent-color: #6366f1; }
    .btn-pm { padding: 6px 20px; border-radius: 6px; cursor: pointer; font-size: 13px; border: 1px solid #d9d9d9; }
    .btn-pm-primary { background: #6366f1; color: #fff; border-color: #6366f1; }
    .btn-pm-primary:hover { background: #4f46e5; }
    .btn-pm-primary:disabled { background: #a5b4fc; border-color: #a5b4fc; cursor: not-allowed; }
    .btn-pm-default { background: #fff; color: #333; }
    .btn-pm-default:hover { color: #6366f1; border-color: #6366f1; }
    .pending-badge { display: inline-block; padding: 2px 10px; border-radius: 10px; background: #ff4d4f; color: #fff; font-size: 11px; font-weight: 600; margin-left: 6px; vertical-align: middle; cursor: pointer; }
    .pending-badge:hover { background: #cf1322; }
    .pending-badge.zero { background: #52c41a; }
    .step-indicator { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; }
    .step-dot { width: 10px; height: 10px; border-radius: 50%; background: #d9d9d9; }
    .step-dot.active { background: #6366f1; }
    .step-dot.done { background: #52c41a; }
</style>

<div class="page-header">
    <span class="title">树形结构</span>
    <span class="user-info" id="headerInfo"></span>
    <button class="pending-badge zero" id="pendingBadge" style="display:none;" onclick="openPlacementModal()">待安置: <span id="pendingCount">0</span></button>
</div>

<div id="chart-container">
    <div id="loadingMsg" class="loading-overlay">
        <img src="{% static 'img/loading.gif' %}" height="16" style="margin-right:8px;"/> 加载中...
    </div>
</div>

<!-- 用户信息弹窗 -->
<div class="user-modal" id="userModal">
    <div class="user-modal-content">
        <div class="user-modal-header">
            <h3>用户信息</h3>
            <button class="user-modal-close" id="userModalClose">&times;</button>
        </div>
        <div class="user-modal-body" id="userModalBody"></div>
        <div class="user-modal-footer" id="userModalFooter" style="display:flex;justify-content:center;gap:10px;padding:12px 16px;border-top:1px solid #eee;"></div>
    </div>
</div>

<script src="{% static 'js/jquery.min.js' %}"></script>
<script src="{% static 'orgchart/js/jquery.orgchart.min.js' %}"></script>
<script type="text/javascript">
    var LEVEL_MAP = {'0': '非会员', '-1': '尊享', '1': '金级', '2': '白金', '3': '银级', '4': '钻石'};
    var STATE_MAP = {0: '待生效', 1: '生效', '-1': '过期'};
    var LEVEL_COLOR = {'-1': '#722ed1', '0': '#888', '1': '#fa8c16', '2': '#fadb14', '3': '#52c41a', '4': '#6366f1'};
    var STATE_COLOR = {0: '#d48806', 1: '#389e0d', '-1': '#cf1322'};

    var chartInstance = null;
    var env = 'test';
    var version = 7;

    function getCsrfToken() {
        var cookies = document.cookie.split('; ');
        for (var i = 0; i < cookies.length; i++) {
            if (cookies[i].indexOf('csrftoken=') === 0) {
                return cookies[i].substring('csrftoken='.length);
            }
        }
        return '';
    }

    function getParams() {
        var params = new URLSearchParams(window.location.search);
        return {
            uname: params.get('uname') || '',
            env: params.get('env') || 'test',
            emailSuffix: params.get('emailSuffix') || '@jt.com',
            version: parseInt(params.get('version')) || 7
        };
    }

    // 将嵌套树数据转为 OrgChart 嵌套 JSON 格式（深拷贝，避免引用污染）
    function buildTree(node) {
        if (!node) return null;
        var result = {
            id: String(node.userId),
            name: node.userName || node.email || '未知用户',
            vipLevel: node.level,
            state: node.state,
            leftCnt: node.leftNodeCnt || 0,
            leftPv: node.leftNodePv || 0,
            rightCnt: node.rightNodeCnt || 0,
            rightPv: node.rightNodePv || 0,
            // 保存用户信息用于弹窗
            userName: node.userName,
            email: node.email,
            level: node.level,
            star: node.star,
            state: node.state,
            referralCode: node.referralCode,
            memberNo: node.memberNo,
            createTime: node.createTime,
            parentReferralCode: node.parentReferralCode,
            parentMemberNo: node.parentMemberNo
        };
        var children = [];
        var hasMore = false;
        if (node.leftNodeInfoVO) {
            var left = buildTree(node.leftNodeInfoVO);
            if (left) children.push(left);
        } else if (node.leftNodeCnt > 0) {
            hasMore = true;
        }
        if (node.rightNodeInfoVO) {
            var right = buildTree(node.rightNodeInfoVO);
            if (right) children.push(right);
        } else if (node.rightNodeCnt > 0) {
            hasMore = true;
        }
        if (children.length > 0) {
            result.children = children;
        }
        if (hasMore) {
            result.hasMore = true;
        }
        return result;
    }

    // OrgChart 会修改传入的 datasource，所以初始化和 createNode 都要用深拷贝
    function cloneData(data) {
        return JSON.parse(JSON.stringify(data));
    }

    // 生成节点内容 HTML
    function nodeContent(data) {
        var d = JSON.parse(JSON.stringify(data));
        var lvl = d.vipLevel;
        var levelText = LEVEL_MAP[String(lvl)] || LEVEL_MAP[lvl] || '未知';
        var stateText = STATE_MAP[String(d.state)] || STATE_MAP[d.state] || '未知(' + d.state + ')';
        var levelColor = LEVEL_COLOR[String(lvl)] || LEVEL_COLOR[lvl] || '#888';
        var stateColor = STATE_COLOR[String(d.state)] || STATE_COLOR[d.state] || '#888';

        var html = '<div class="badge-row">' +
            '<span class="badge" style="color:' + levelColor + ';border:1px solid ' + levelColor + ';background:' + levelColor + '15;">' + levelText + '</span>' +
            '<span class="badge" style="color:' + stateColor + ';border:1px solid ' + stateColor + ';background:' + stateColor + '15;">' + stateText + '</span>' +
            '</div>' +
            '<div class="stats-row">' +
            '<span class="stat-l">L:' + d.leftCnt + ' | pv:' + d.leftPv + '</span>' +
            '<span class="stat-r">R:' + d.rightCnt + ' | pv:' + d.rightPv + '</span>' +
            '</div>';

        // 有子节点则显示收起按钮
        if (d.children && d.children.length > 0) {
            html += '<button class="toggle-btn" data-action="collapse" data-id="' + d.id + '">收起▲</button>';
        }
        // 需要懒加载则显示展开按钮
        if (d.hasMore) {
            html += '<button class="toggle-btn" data-action="expand" data-uid="' + d.id + '">展开▼</button>';
        }
        return html;
    }

    function initChart(datasource) {
        $('#loadingMsg').remove();
        if (chartInstance) {
            chartInstance.$chart.remove();
            chartInstance = null;
        }
        // 清空容器中所有残余 DOM，确保干净重新渲染
        $('#chart-container').find('.orgchart').remove();

        // 深拷贝，防止 orgchart 修改原始数据
        var ds = cloneData(datasource);

        $('#chart-container').orgchart({
            'data': ds,
            'pan': true,
            'zoom': true,
            'zoominLimit': 5,
            'zoomoutLimit': 0.05,
            'nodeTitle': 'name',
            'nodeContent': 'content',
            'nodeId': 'id',
            'visibleLevel': 99,
            'createNode': function($node, data) {
                $node.find('.content').html(nodeContent(data));
                // 存储用户信息用于弹窗
                $node.data('user-info', {
                    userId: data.id,
                    userName: data.userName,
                    email: data.email,
                    vipLevel: data.vipLevel,
                    star: data.star,
                    state: data.state,
                    leftCnt: data.leftCnt || 0,
                    rightCnt: data.rightCnt || 0,
                    hasMore: data.hasMore || false,
                    referralCode: data.referralCode,
                    memberNo: data.memberNo,
                    createTime: data.createTime,
                    parentReferralCode: data.parentReferralCode,
                    parentMemberNo: data.parentMemberNo
                });
            }
        });
        chartInstance = $('#chart-container').data('orgchart');
    }

    // 收集当前树中所有已展开的节点 ID
    function collectExpandedIds() {
        var ids = [];
        $('.toggle-btn').each(function() {
            if ($(this).data('action') === 'collapse') {
                var id = $(this).data('id') || $(this).data('uid');
                if (id) ids.push(String(id));
            }
        });
        return ids;
    }

    // 重新加载树后，逐步恢复之前展开的节点（串行回调，等上一个完成才处理下一个）
    function restoreExpandedNodes(ids) {
        if (!ids || ids.length === 0) return;
        var queue = ids.slice();
        (function next() {
            if (queue.length === 0) return;
            var id = queue.shift();
            var $btn = $('.toggle-btn[data-action="expand"][data-uid="' + id + '"], .toggle-btn[data-action="expand"][data-id="' + id + '"]').first();
            if ($btn.length > 0) {
                loadChildren(id, $btn, next);
            } else {
                next();
            }
        })();
    }

    function loadTree(callback, deep) {
        var p = getParams();
        p.deep = deep || '';
        if (!p.uname) {
            $('#loadingMsg').html('未提供用户账号');
            return;
        }
        env = p.env;
        version = p.version;

        $.ajax({
            url: '/ov/pmmeettTreeData',
            type: 'POST',
            contentType: 'application/json',
            headers: {'X-CSRFToken': getCsrfToken()},
            data: JSON.stringify(p)
        })
        .done(function(res) {
            if (res.code === 0 && res.data) {
                var treeData = res.data;
                document.getElementById('headerInfo').textContent = (treeData.userName || '') + ' | ' + (treeData.email || '');
                // 更新页面标题，影响 tab bar 和浏览器标签页
                var titleText = 'Tree(' + (treeData.userName || p.uname) + ')';
                var pageTitle = document.querySelector('.page-header .title');
                if (pageTitle) {
                    pageTitle.textContent = titleText;
                }
                document.title = titleText;
                // 更新 tab bar 标题
                try {
                    var savedTabs = JSON.parse(sessionStorage.getItem('_tabs') || '[]');
                    var currentUrl = window.location.pathname + window.location.search;
                    for (var i = 0; i < savedTabs.length; i++) {
                        if (savedTabs[i].url === currentUrl) {
                            savedTabs[i].title = titleText;
                            break;
                        }
                    }
                    sessionStorage.setItem('_tabs', JSON.stringify(savedTabs));
                    // 更新 DOM
                    document.querySelectorAll('#tabBar .tab-item').forEach(function(tab) {
                        if (tab.classList.contains('active')) {
                            tab.querySelector('.tab-title').textContent = titleText;
                            tab.title = titleText;
                        }
                    });
                } catch(e) {}
                // 存储 rootUserId，后续 getNeedSetInfo 复用，避免重复 userlogin 导致 token 互相覆盖
                if (treeData && treeData.userId) {
                    placementState.rootUserId = String(treeData.userId);
                }
                var datasource = buildTree(treeData);
                initChart(datasource);
                if (typeof callback === 'function') {
                    callback();
                }
            } else {
                $('#loadingMsg').html('<span style="color:red;">加载失败: ' + (res.msg || '未知错误') + '</span>');
            }
        })
        .fail(function(err) {
            $('#loadingMsg').html('<span style="color:red;">请求失败: ' + err.statusText + '</span>');
        });
    }

    // 懒加载子节点，完成后调用 callback
    function loadChildren(userId, $btn, callback) {
        $btn.addClass('loading').text('加载中...');
        var $node = $btn.closest('.node');
        var $hierarchy = $node.closest('.hierarchy');
        var $nodesList = $hierarchy.children('.nodes');

        // 如果已有子节点（只是隐藏了），直接显示
        if ($nodesList.length > 0 && $nodesList.children().length > 0) {
            $nodesList.show();
            $btn.data('action', 'collapse').text('收起▲').removeClass('loading');
            if (typeof callback === 'function') callback();
            return;
        }

        // 没有子节点，从后端加载
        $.ajax({
            url: '/ov/pmmeettTreeChildren',
            type: 'POST',
            contentType: 'application/json',
            headers: {'X-CSRFToken': getCsrfToken()},
            data: JSON.stringify({env: env, version: version, userId: userId})
        })
        .done(function(res) {
            if (res.code === 0 && res.data) {
                var childData = buildTree(res.data);
                if (childData && childData.children && childData.children.length > 0) {
                    if ($nodesList.length === 0) {
                        $nodesList = $('<ul class="nodes"></ul>');
                        $hierarchy.append($nodesList);
                    }

                    // 添加子节点（递归包含所有层级）
                    childData.children.forEach(function(child) {
                        var $li = $('<li class="hierarchy"></li>');
                        var $elements = buildNodeElement(child);
                        $li.append($elements);
                        $nodesList.append($li);
                    });

                    $nodesList.show();

                    // 展开按钮变为收起按钮
                    $btn.data('action', 'collapse').text('收起▲').removeClass('loading');
                } else {
                    $btn.text('无数据').css('background', '#999');
                    setTimeout(function() { $btn.remove(); }, 1500);
                }
            } else {
                $btn.removeClass('loading').text('加载失败');
            }
            if (typeof callback === 'function') callback();
        })
        .fail(function() {
            $btn.removeClass('loading').text('请求失败');
            if (typeof callback === 'function') callback();
        });
    }

    // 构建单个节点 DOM 元素（递归）
    function buildNodeElement(data) {
        var $node = $('<div class="node" data-node="' + data.id + '"></div>');
        var $title = $('<div class="title">' + escapeHTML(data.name || '未知用户') + '</div>');
        var $content = $('<div class="content"></div>').html(nodeContent(data));
        $node.append($title).append($content);
        // 存储用户信息用于弹窗
        $node.data('user-info', {
            userId: data.id,
            userName: data.userName,
            email: data.email,
            vipLevel: data.vipLevel,
            star: data.star,
            state: data.state,
            leftCnt: data.leftCnt || 0,
            rightCnt: data.rightCnt || 0,
            hasMore: data.hasMore || false,
            referralCode: data.referralCode,
            memberNo: data.memberNo,
            createTime: data.createTime,
            parentReferralCode: data.parentReferralCode,
            parentMemberNo: data.parentMemberNo
        });

        // 递归构建子节点
        if (data.children && data.children.length > 0) {
            var $ul = $('<ul class="nodes"></ul>');
            data.children.forEach(function(child) {
                var $li = $('<li class="hierarchy"></li>');
                buildNodeElement(child).appendTo($li);
                $ul.append($li);
            });
            // 构建完成后追加到节点后面
            return $node.add($ul);
        }
        return $node;
    }

    // 查找节点数据
    function findNodeById(treeNode, id) {
        if (!treeNode) return null;
        if (String(treeNode.id) === String(id)) return treeNode;
        if (treeNode.children) {
            for (var i = 0; i < treeNode.children.length; i++) {
                var found = findNodeById(treeNode.children[i], id);
                if (found) return found;
            }
        }
        return null;
    }

    // 展开/收起按钮点击事件
    $(document).on('click', '.toggle-btn', function() {
        var $btn = $(this);
        var action = $btn.data('action');
        if (action === 'expand') {
            var uid = $btn.data('uid');
            loadChildren(uid, $btn);
        } else if (action === 'collapse') {
            // 收起：隐藏子节点，不删除
            var $node = $btn.closest('.node');
            var $hierarchy = $node.closest('.hierarchy');
            var $nodesList = $hierarchy.children('.nodes');
            if ($nodesList.length > 0) {
                $nodesList.hide();
            }
            // 收起按钮变展开按钮
            $btn.data('action', 'expand').text('展开▼');
        }
    });

    // 点击节点显示用户信息
    $(document).on('click', '.node', function(e) {
        if ($(e.target).closest('.toggle-btn').length) return;
        var $node = $(this);
        var userData = $node.data('user-info');
        if (userData) {
            showUserInfo(userData);
        }
    });

    // 关闭弹窗
    $('#userModalClose').on('click', function() {
        $('#userModal').removeClass('show');
    });
    $('#userModal').on('click', function(e) {
        if ($(e.target).is('#userModal')) {
            $(this).removeClass('show');
        }
    });

    var _modalUserId = '';
    var _modalLeftCnt = 0;
    var _modalRightCnt = 0;
    var _modalHasMore = false;

    function showUserInfo(data) {
        var stateMap = {0: '待生效', 1: '生效', '-1': '过期'};
        var levelMap = {0: '非会员', '-1': '尊享', 1: '金级', 2: '白金', 3: '银级', 4: '钻石'};
        _modalUserId = data.userId || '';
        _modalLeftCnt = data.leftCnt || 0;
        _modalRightCnt = data.rightCnt || 0;
        _modalHasMore = data.hasMore || false;
        var rows = [
            ['用户名', escapeHTML(data.userName || '-')],
            ['邮箱', escapeHTML(data.email || '-')],
            ['会员类型', escapeHTML(levelMap[String(data.vipLevel)] || levelMap[data.vipLevel] || '未知')],
            ['星级', data.star || 0],
            ['会员状态', stateMap[String(data.state)] || '未知(' + data.state + ')'],
            ['原会员编号', escapeHTML(data.referralCode || '-')],
            ['会员编号', escapeHTML(data.memberNo || '-')],
            ['创建时间', escapeHTML(data.createTime || '-')],
            ['直属上级原会员编号', escapeHTML(data.parentReferralCode || '-')],
            ['直属上级会员编号', escapeHTML(data.parentMemberNo || '-')]
        ];
        var html = '';
        rows.forEach(function(r) {
            html += '<div class="info-row"><span class="info-label">' + r[0] + '</span><span class="info-value">' + r[1] + '</span></div>';
        });
        $('#userModalBody').html(html);
        var footerHtml = '';
        if (_modalUserId) {
            footerHtml =
                '<button class="btn-pm btn-pm-default" onclick="cancelSettle(\'up\')">移除上级安置关系</button>';
            if (_modalLeftCnt + _modalRightCnt > 0 || _modalHasMore) {
                footerHtml +=
                    '<button class="btn-pm btn-pm-default" onclick="cancelSettle(\'down\')">移除下级安置关系</button>';
            }
        }
        $('#userModalFooter').html(footerHtml);
        $('#userModal').addClass('show');
    }

    function cancelSettle(dir) {
        if (!_modalUserId) return;
        var label = dir === 'up' ? '移除上级安置关系' : '移除下级安置关系';
        if (!confirm('确定要' + label + '吗？')) return;
        var action = dir === 'up' ? 'cancelUpperSettle' : 'cancelLowerSettle';
        $.ajax({
            url: '/ov/pmmeett/' + action,
            type: 'POST',
            contentType: 'application/json',
            headers: {'X-CSRFToken': getCsrfToken()},
            data: JSON.stringify({
                env: env,
                version: version,
                uname: '',
                emailSuffix: getParams().emailSuffix || '@jt.com',
                userId: _modalUserId
            })
        })
        .done(function(res) {
            if (res && res.code == 0) {
                alert(label + '成功！');
                $('#userModal').removeClass('show');
                fetchNeedSetInfo();
                var expandedIds = collectExpandedIds();
                loadTree(function() {
                    restoreExpandedNodes(expandedIds);
                });
            } else {
                alert('操作失败: ' + ((res && res.msg) || '未知错误'));
            }
        })
        .fail(function() {
            alert('网络请求失败');
        });
    }

    $(document).ready(function() {
        loadTree(function() {
            // loadTree 完成后才调 fetchNeedSetInfo，此时 rootUserId 已缓存，
            // fetchNeedSetInfo 直接复用 rootUserId，不再调用 userlogin
            fetchNeedSetInfo();
        });
        initDragToPan();
    });

    // 空白区域拖拽平移
    function initDragToPan() {
        var $container = $('#chart-container');
        var isDragging = false;
        var startX, startY, scrollLeft, scrollTop;

        $container.on('mousedown', function(e) {
            // 只在非节点区域（空白区域）启用拖拽
            if ($(e.target).closest('.node, .toolbar, .page-header, button, select, input').length) return;
            isDragging = true;
            startX = e.pageX;
            startY = e.pageY;
            scrollLeft = $container.scrollLeft();
            scrollTop = $container.scrollTop();
        });

        $(document).on('mousemove', function(e) {
            if (!isDragging) return;
            e.preventDefault();
            var dx = e.pageX - startX;
            var dy = e.pageY - startY;
            $container.scrollLeft(scrollLeft - dx);
            $container.scrollTop(scrollTop - dy);
        });

        $(document).on('mouseup', function() {
            isDragging = false;
        });
    }
</script>

<!-- 安置弹窗 -->
<div class="placement-modal" id="placementModal">
    <div class="placement-modal-content">
        <div class="placement-modal-header">
            <h3 id="placementModalTitle">用户安置</h3>
            <button class="placement-modal-close" id="placementModalClose">&times;</button>
        </div>
        <div class="placement-modal-body" id="placementModalBody"></div>
        <div class="placement-modal-footer" id="placementModalFooter"></div>
    </div>
</div>

<script>
// ====== 安置流程 ======
var placementState = {
    step: 1,
    pendingList: [],
    locationList: [],
    selectedPendingUser: null,
    selectedLocationUser: null,
    env: 'test',
    version: 7
};

function fetchNeedSetInfo() {
    var p = getParams();
    placementState.env = p.env;
    placementState.version = p.version;
    $.ajax({
        url: '/ov/pmmeett/getNeedSetInfo',
        type: 'POST',
        contentType: 'application/json',
        headers: {'X-CSRFToken': getCsrfToken()},
        data: JSON.stringify({
            env: p.env,
            version: p.version,
            uname: p.uname,
            emailSuffix: p.emailSuffix,
            userId: placementState.rootUserId || ''
        })
    })
    .done(function(res) {
        console.log('getNeedSetInfo response:', res);
        var badge = document.getElementById('pendingBadge');
        if (res && res.code == 0 && res.data) {
            var cnt = res.data.needSetCnt || 0;
            var list = res.data.needSetUserList || [];
            placementState.rootUserId = res.data.rootUserId || '';
            placementState.pendingList = list;
            document.getElementById('pendingCount').textContent = cnt;
            if (cnt > 0) {
                badge.className = 'pending-badge';
            } else {
                badge.className = 'pending-badge zero';
            }
            console.log('pendingCount updated to:', cnt, 'list length:', list.length);
        } else {
            document.getElementById('pendingCount').textContent = '?';
            badge.className = 'pending-badge';
            console.log('getNeedSetInfo got unexpected response format');
        }
        badge.style.display = 'inline-block';
    })
    .fail(function(jqXHR, textStatus, errorThrown) {
        console.log('getNeedSetInfo fail:', textStatus, errorThrown);
        var badge = document.getElementById('pendingBadge');
        document.getElementById('pendingCount').textContent = '!';
        badge.className = 'pending-badge';
        badge.style.display = 'inline-block';
    });
}

function openPlacementModal() {
    placementState.step = 1;
    placementState.selectedPendingUser = null;
    placementState.selectedLocationUser = null;
    renderStep1();
    document.getElementById('placementModal').classList.add('show');
}

function closePlacementModal() {
    document.getElementById('placementModal').classList.remove('show');
}

document.getElementById('placementModalClose').addEventListener('click', closePlacementModal);

var LEVEL_MAP_P = {'0': '非会员', '-1': '尊享', '1': '金级', '2': '白金', '3': '银级', '4': '钻石'};

function renderStep1() {
    document.getElementById('placementModalTitle').textContent = '选择待安置用户';
    var list = placementState.pendingList;
    var html = '<div class="step-indicator"><span class="step-dot active"></span><span class="step-dot"></span></div>';
    if (!list || list.length === 0) {
        html += '<p style="text-align:center;color:#999;">暂无待安置用户</p>';
    } else {
        html += '<table class="placement-table"><thead><tr>' +
            '<th class="radio-col">选择</th><th>用户名</th><th>邮箱</th><th>星级</th><th>推荐码</th><th>会员编码</th>' +
            '</tr></thead><tbody>';
        list.forEach(function(u, idx) {
            html += '<tr data-idx="' + idx + '" onclick="selectPendingRow(this, ' + idx + ')">' +
                '<td class="radio-col"><input type="radio" name="pendingUser" value="' + idx + '"></td>' +
                '<td>' + escapeHTML(u.userName || '-') + '</td>' +
                '<td>' + escapeHTML(u.email || '-') + '</td>' +
                '<td>' + (LEVEL_MAP_P[String(u.level)] || u.level || '-') + '</td>' +
                '<td>' + escapeHTML(u.referralCode || '-') + '</td>' +
                '<td>' + escapeHTML(u.memberNo || '-') + '</td>' +
                '</tr>';
        });
        html += '</tbody></table>';
    }
    document.getElementById('placementModalBody').innerHTML = html;
    document.getElementById('placementModalFooter').innerHTML =
        '<button class="btn-pm btn-pm-default" onclick="closePlacementModal()">取消</button>' +
        '<button class="btn-pm btn-pm-primary" id="step1Next" disabled onclick="goStep2()">下一步</button>';
}

function selectPendingRow(tr, idx) {
    document.querySelectorAll('#placementModalBody tbody tr').forEach(function(r) { r.classList.remove('selected'); });
    tr.classList.add('selected');
    tr.querySelector('input[type="radio"]').checked = true;
    placementState.selectedPendingUser = idx;
    document.getElementById('step1Next').disabled = false;
}

function goStep2() {
    var idx = placementState.selectedPendingUser;
    if (idx === null) return;
    var user = placementState.pendingList[idx];
    placementState.step = 2;
    placementState.selectedLocationUser = null;
    document.getElementById('placementModalTitle').textContent = '选择安置位置';
    document.getElementById('placementModalBody').innerHTML =
        '<div style="text-align:center;padding:40px;color:#999;"><img src="/static/img/loading.gif" height="16"/> 查询可安置位置...</div>';
    document.getElementById('placementModalFooter').innerHTML =
        '<button class="btn-pm btn-pm-default" onclick="goStep1()">上一步</button>' +
        '<button class="btn-pm btn-pm-primary" id="step2Confirm" disabled onclick="doPlace()">确定安置</button>';

    $.ajax({
        url: '/ov/pmmeett/getNeedSetLocationInfo',
        type: 'POST',
        contentType: 'application/json',
        headers: {'X-CSRFToken': getCsrfToken()},
        data: JSON.stringify({
            env: placementState.env,
            version: placementState.version,
            uname: '',
            emailSuffix: getParams().emailSuffix || '@jt.com',
            userId: placementState.rootUserId
        })
    })
    .done(function(res) {
        if (res.code == 0 && res.data) {
            placementState.locationList = Array.isArray(res.data) ? res.data : (res.data.list || []);
            renderStep2Table();
        } else {
            document.getElementById('placementModalBody').innerHTML =
                '<p style="text-align:center;color:#ff4d4f;">查询失败: ' + (res.msg || '未知错误') + '</p>';
        }
    })
    .fail(function() {
        document.getElementById('placementModalBody').innerHTML =
            '<p style="text-align:center;color:#ff4d4f;">网络请求失败</p>';
    });
}

function renderStep2Table() {
    var list = placementState.locationList;
    var html = '<div class="step-indicator"><span class="step-dot done"></span><span class="step-dot active"></span></div>';
    if (!list || list.length === 0) {
        html += '<p style="text-align:center;color:#999;">暂无可安置位置</p>';
    } else {
        html += '<table class="placement-table"><thead><tr>' +
            '<th class="radio-col">选择</th><th>用户名</th><th>邮箱</th><th>星级</th><th>位置</th><th>推荐码</th><th>会员编码</th>' +
            '</tr></thead><tbody>';
        list.forEach(function(u, idx) {
            var sideText = u.side == 1 ? '右' : '左';
            html += '<tr data-idx="' + idx + '" onclick="selectLocationRow(this, ' + idx + ')">' +
                '<td class="radio-col"><input type="radio" name="locationUser" value="' + idx + '"></td>' +
                '<td>' + escapeHTML(u.userName || '-') + '</td>' +
                '<td>' + escapeHTML(u.email || '-') + '</td>' +
                '<td>' + (LEVEL_MAP_P[String(u.level)] || u.level || '-') + '</td>' +
                '<td>' + sideText + '</td>' +
                '<td>' + escapeHTML(u.referralCode || '-') + '</td>' +
                '<td>' + escapeHTML(u.memberNo || '-') + '</td>' +
                '</tr>';
        });
        html += '</tbody></table>';
    }
    document.getElementById('placementModalBody').innerHTML = html;
}

function selectLocationRow(tr, idx) {
    document.querySelectorAll('#placementModalBody tbody tr').forEach(function(r) { r.classList.remove('selected'); });
    tr.classList.add('selected');
    tr.querySelector('input[type="radio"]').checked = true;
    placementState.selectedLocationUser = idx;
    document.getElementById('step2Confirm').disabled = false;
}

function goStep1() {
    placementState.step = 1;
    placementState.selectedLocationUser = null;
    renderStep1();
    if (placementState.selectedPendingUser !== null) {
        var row = document.querySelector('#placementModalBody tbody tr[data-idx="' + placementState.selectedPendingUser + '"]');
        if (row) { row.classList.add('selected'); row.querySelector('input[type="radio"]').checked = true; }
        document.getElementById('step1Next').disabled = false;
    }
}

function doPlace() {
    var pendingIdx = placementState.selectedPendingUser;
    var locationIdx = placementState.selectedLocationUser;
    if (pendingIdx === null || locationIdx === null) return;
    var lowerUser = placementState.pendingList[pendingIdx];
    var upperUser = placementState.locationList[locationIdx];
    var lowerUserId = lowerUser.userId || lowerUser.id;
    var upperUserId = upperUser.userId || upperUser.id;
    var side = upperUser.side;
    console.log(`locationIdx: ${locationIdx}, side: ${side}`);

    document.getElementById('step2Confirm').disabled = true;
    document.getElementById('step2Confirm').textContent = '安置中...';

    $.ajax({
        url: '/ov/pmmeett/setHierarchy',
        type: 'POST',
        contentType: 'application/json',
        headers: {'X-CSRFToken': getCsrfToken()},
        data: JSON.stringify({
            env: placementState.env,
            version: placementState.version,
            uname: '',
            emailSuffix: getParams().emailSuffix || '@jt.com',
            upperUserId: upperUserId,
            lowerUserId: lowerUserId,
            side: side,
            rootUserId: placementState.rootUserId
        })
    })
    .done(function(res) {
        console.log('setHierarchy res:', res);
        if (res.code == 0) {
            alert('安置成功！');
            closePlacementModal();
            fetchNeedSetInfo();
            var expandedIds = collectExpandedIds();
            console.log('expandedIds before refresh:', expandedIds);
            loadTree(function() {
                console.log('loadTree callback fired, restoring:', expandedIds);
                restoreExpandedNodes(expandedIds);
            }, '');  // '' = 初始深度（5层），与首次加载一致
        } else {
            alert('安置失败: ' + (res.msg || '未知错误'));
            document.getElementById('step2Confirm').disabled = false;
            document.getElementById('step2Confirm').textContent = '确定安置';
        }
    })
    .fail(function() {
        alert('网络请求失败');
        document.getElementById('step2Confirm').disabled = false;
        document.getElementById('step2Confirm').textContent = '确定安置';
    });
}

</script>
