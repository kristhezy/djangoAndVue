    const KNOWN_HOSTS = [
        'https://soon-api.aijiatui.com',

        'https://api.mmeett.com',
        'https://vcard-api.aijiatui.com',

    // 从历史数据中切割 host 和 interface
    function splitHostAndUri(host, uri) {
        var cleanHost = (host || '').replace(/\/+$/, '');
        // 如果 host 匹配预设环境，直接使用
        if (KNOWN_HOSTS.includes(cleanHost)) {
            return { env: cleanHost, uri: uri || '/' };
        }
        // 如果 host 存在但不匹配预设，把完整地址放进 uri
        if (cleanHost) {
            return { env: '', uri: cleanHost + (uri || '') };
        }
        // host 不存在，uri 可能是完整地址
        return { env: '', uri: uri || '' };
    }

    // 将 Python 风格字面量（单引号字符串、None/True/False）转为合法 JSON 字符串
    function pythonToJSON(text) {
        var kw = { 'None': 'null', 'True': 'true', 'False': 'false' };
        var out = '';
        var inSingle = false, inDouble = false;
        var i = 0;
        while (i < text.length) {
            var c = text[i];
            if (inSingle) {
                // 单引号字符串内：处理转义
                if (c === '\\') {
                    var n = text[i + 1];
                    if (n === "'") { out += "'"; }          // \' -> '
                    else if (n === '"') { out += '\\"'; }    // \" 保留
                    else { out += c + (n || ''); }
                    i += 2;
                    continue;
                }
                if (c === "'") { out += '"'; inSingle = false; }   // 结束单引号串 -> 双引号
                else if (c === '"') { out += '\\"'; }              // 串内双引号需转义
                else { out += c; }
                i++;
                continue;
            }
            if (inDouble) {
                if (c === '\\') { out += c + (text[i + 1] || ''); i += 2; continue; }
                if (c === '"') { out += c; inDouble = false; }
                else { out += c; }
                i++;
                continue;
            }
            // 字符串外
            if (c === "'") { out += '"'; inSingle = true; i++; continue; }
            if (c === '"') { out += c; inDouble = true; i++; continue; }
            // None/True/False 关键字替换（仅字符串外，按整词匹配）
            var matched = false;
            for (var k in kw) {
                if (text.startsWith(k, i) &&
                    (i === 0 || !/[a-zA-Z0-9_]/.test(text[i - 1])) &&
                    !/[a-zA-Z0-9_]/.test(text[i + k.length] || '')) {
                    out += kw[k];
                    i += k.length;
                    matched = true;
                    break;
                }
            }
            if (matched) continue;
            out += c;
            i++;
        }
        return out;
    }

    // 将文本解析为 JSON 对象（支持 JSON、Python 字面量、key:value 逐行、URL 编码格式）
    function parseTextToJSON(text) {
        if (!text || !text.trim()) return {};
        // 尝试 JSON 解析
        try {
            var parsed = JSON.parse(text);
            if (typeof parsed === 'object' && parsed !== null) return parsed;
        } catch(e) {}
        // 尝试 Python 风格字面量（单引号、None/True/False）
        if (text.indexOf("'") !== -1) {
            try {
                var pyParsed = JSON.parse(pythonToJSON(text));
                if (typeof pyParsed === 'object' && pyParsed !== null) return pyParsed;
            } catch(e) {}
        }
        // 尝试 key:value 逐行格式（header 格式）
        var lines = text.split('\n');
        var result = {};
        var hasKV = false;
        for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (!line) continue;
            // 结构化数据（[ / { / ( 开头）不走 KV 兜底，避免误切
            if (/^[\[{\(]/.test(line)) continue;
            var colonIdx = line.indexOf(':');
            if (colonIdx > 0) {
                result[line.substring(0, colonIdx).trim()] = line.substring(colonIdx + 1).trim();
                hasKV = true;
            }
        }
        if (hasKV) return result;
        // 尝试 URL 编码格式 (key=value&key2=value2)
        if (text.includes('=') && text.indexOf('\n') === -1) {
            try {
                var params = new URLSearchParams(text);
                var urlResult = {};
                params.forEach(function(value, key) { urlResult[key] = value; });
                if (Object.keys(urlResult).length > 0) return urlResult;
            } catch(e) {}
        }
        return text;
    }

    function parseCurlCommand() {
        const curlStr = document.getElementById('curlInput').value.trim();
        if (!curlStr) {
            showToast('请粘贴curl命令！');
            return;
        }

        // 去除换行符和多余空格
        let cmd = curlStr.replace(/\\\n/g, ' ').replace(/\s+/g, ' ').trim();

        // 提取 URL
        let url = '';
        const urlMatch = cmd.match(/(?:curl\s+)(?:-[a-zA-Z]+\s+[^\s]+\s+)*?(['"]?)(https?:\/\/[^\s'"]+)\1/);
        if (urlMatch) {
            url = urlMatch[2];
        } else {
            const simpleMatch = cmd.match(/(https?:\/\/[^\s'"]+)/);
            if (simpleMatch) url = simpleMatch[1];
        }
        if (!url) {
            showToast('未能识别URL，请检查curl命令格式！');
            return;
        }

        // 提取方法
        let method = 'GET';
        const methodMatch = cmd.match(/(?:-X|--request)\s+['"]?(\w+)['"]?/i);
        if (methodMatch) {
            method = methodMatch[1].toUpperCase();
        } else if (/(?:-d|--data|--data-raw|--data-binary)\s+/.test(cmd)) {
            method = 'POST';
        }

        // 提取 headers
        let headers = [];
        const headerRegex = /(?:-H|--header)\s+['"]([^'"]+)['"]/g;
        let hMatch;
        while ((hMatch = headerRegex.exec(cmd)) !== null) {
            headers.push(hMatch[1]);
        }

        // 提取 body
        let body = '';
        const bodyMatch = cmd.match(/(?:-d|--data|--data-raw|--data-binary)\s+['"]([^'"]+)['"]/);
        if (bodyMatch) {
            body = bodyMatch[1];
        }

        // 分割 URL 为 host + uri
        let host = '';
        let uri = '/';
        try {
            const urlObj = new URL(url);
            host = urlObj.origin;
            uri = urlObj.pathname + urlObj.search;
        } catch(e) {
            host = url;
        }

        // 填充表单
        document.getElementById('setreqtype').value = method.toLowerCase();
        if (KNOWN_HOSTS.includes(host)) {
            document.getElementById('setenv').value = host;
            document.getElementById('uri').value = uri;
        } else {
            document.getElementById('setenv').value = '';
            document.getElementById('uri').value = host + uri;
        }
        document.getElementById('headerkv').value = headers.join('\n');
        document.getElementById('paramkv').value = body;

        closeCurlArea();
        showToast('curl解析成功，已填充表单！');
    }

                        <div class="api-field"><span class="api-field__label">响应头部:</span><span class="api-field__value">${escapeHTML(rheader)}</span></div>
                        <div class="api-field api-field--top">
                            <span class="api-field__label">响应内容:</span>
                            <div class="api-field__body">
                                <button class="api-copy" data-id="${id}"><i class="fa-solid fa-copy"></i>复制</button>
                                <span class="api-field__value api-field__value--mono">${escapeHTML(rbody)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="api-card__footer">第${num}条</div>
                </div>`
                str = str + rlt
                // console.log('接口批量调用suc:', str);
            }
            result.innerHTML = str;
            document.getElementById("hislist").style.display = 'none';
            getval.disabled = false;
        })
        .catch(err => {
            console.log(`easyIC getvalue err: ${err}`);
            var errMsg = err.response && err.response.data ? JSON.stringify(err.response.data) : (err.message || err);
            result.innerHTML = `<div class="api-error">请求失败: ${errMsg}</div>`;
            getval.disabled = false;
        })
    }
    document.addEventListener('DOMContentLoaded',function() {
        const elist = document.getElementById('result');
        console.log(`testtest: ${elist.value}`);
        elist.removeEventListener('click', copybody); //移除操作事件监听器
        elist.addEventListener('click', copybody);  //添加操作事件监听器
        const copyinp = document.getElementById("shuju");
        copyinp.removeEventListener('click', copyinput); //移除操作事件监听器
        copyinp.addEventListener('click', copyinput);  //添加操作事件监听器
    });

    // 获取文本框和复制按钮元素
    function copybody(event){
        const target = event.target;
        const clickedButton = target.closest('button');
        id = clickedButton.getAttribute('data-id');
        // 创建一个临时的输入框元素
        const tempInput = document.createElement('input');
        // 将变量中的内容赋值给输入框的值
        if(resrlt){
            tempInput.value = JSON.stringify(resrlt[id].response_body);
            // 将输入框添加到文档中
            document.body.appendChild(tempInput);
            // 选中输入框中的内容
            tempInput.select();
            // 执行复制命令
            document.execCommand('copy');
            // 从文档中移除临时输入框
            document.body.removeChild(tempInput);
            console.log('已复制文本框内容');
            // alert('已复制响应内容！');
            showToast("复制成功！")
        }
    };
    let sjrlt = ""
    function gethis(){
        var type = "gethistory";
        var str = ""
        var data = JSON.stringify({
            "type": type
        })
        const shuju = document.getElementById('shuju');
        shuju.innerHTML = "<tr><td style='padding:16px; text-align:center'><img src='../static/img/loading.gif' height='10'/></td></tr>"; //在后台返回success之前显示loading图标
        axios.post(`/pv/easyIC`,data,{headers: header})
        .then(response => {
            var res = response.data.data;
            sjrlt = res;
            console.log('接口批量调用succ:', sjrlt);
            for(var i in res){
                var id = res[i]["id"]
                var method = res[i]["method"]
                var host = res[i]["host"]
                var uri = res[i]["uri"]
                str = str + `<tr><td style="padding:0">
                    <div class="his-row">
                        <span class="his-text" id="copyinput" data-id="${id}" title="点击填充表单">【${escapeHTML(method)}】${escapeHTML(host)}${escapeHTML(uri)}</span>
                        <button class="his-replay" data-id="${id}" title="一键重放请求"><i class="fa-solid fa-rotate-right"></i></button>
                        <button class="his-delete" data-id="${id}" title="删除记录"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </td></tr>`
            }
            shuju.innerHTML = str;
        })
        .catch(err => {
            console.log(`easyIC gethistory err: ${err}`);
            document.getElementById('shuju').innerHTML = '<tr><td style="color:var(--red-500); padding:8px">获取历史失败，请重试</td></tr>';
        })
    }
    function copyinput(event){
        const target = event.target;
        console.log(`target: ${target.id}, class: ${target.className}`)
        // 处理重放按钮点击
        if (target.closest('.his-replay')) {
            const btn = target.closest('.his-replay');
            const id = btn.getAttribute('data-id');
            replayRequest(id);
            return;
        }
        // 处理删除按钮点击
        if (target.closest('.his-delete')) {
            const btn = target.closest('.his-delete');
            const id = btn.getAttribute('data-id');
            deleteHistory(id, btn);
            return;
        }
        // 处理历史文本点击 - 填充表单
        if(target.classList.contains('his-text') || target.id === 'copyinput' || target.closest('.his-text')){
            const el = target.classList.contains('his-text') ? target : (target.closest('.his-text') || target);
            id = el.getAttribute('data-id');
            for(var i in sjrlt){
                if(id == sjrlt[i].id){
                    var method = sjrlt[i].method;
                    var host = sjrlt[i].host;
                    var uri = sjrlt[i].uri;
                    var header = sjrlt[i].header;
                    var param = sjrlt[i].param;
                }
            }
            var parts = splitHostAndUri(host, uri);
            document.getElementById("setenv").value = parts.env;
            document.getElementById("uri").value = parts.uri;
            document.getElementById("setreqtype").value = method;
            document.getElementById("headerkv").value = header;
            document.getElementById("paramkv").value = param;
            document.getElementById("hislist").style.display = 'none';
        }
    }

    function replayRequest(id){
        // 先从sjrlt中查找并填充表单
        for(var i in sjrlt){
            if(id == sjrlt[i].id){
                var parts = splitHostAndUri(sjrlt[i].host, sjrlt[i].uri);
                document.getElementById("setenv").value = parts.env;
                document.getElementById("uri").value = parts.uri;
                document.getElementById("setreqtype").value = sjrlt[i].method;
                document.getElementById("headerkv").value = sjrlt[i].header;
                document.getElementById("paramkv").value = sjrlt[i].param;
            }
        }
        document.getElementById("hislist").style.display = 'none';
        // 直接执行请求
        getvalue();
    }

    function deleteHistory(id, btnElement){
        if (!confirm('确定要删除这条历史记录吗？')) return;
        var data = JSON.stringify({
            "type": "deletehistory",
            "id": id
        });
        axios.post(`/pv/easyIC`, data, {headers: header})
        .then(response => {
            if (response.data.success || response.data.data) {
                // 从 DOM 中移除该行
                var row = btnElement.closest('tr');
                if (row) row.remove();
                // 从 sjrlt 中移除对应数据
                sjrlt = sjrlt.filter(function(item) { return item.id != id; });
                showToast('删除成功！');
            } else {
                showToast('删除失败！');
            }
        })
        .catch(err => {
            console.log(`easyIC deletehistory err: ${err}`);
            showToast('删除失败，请重试');
        });
    }
    document.getElementById("close").addEventListener('click', function() {
        console.log("close")
        document.getElementById("hislist").style.display = 'none';
    });
    document.getElementById("result").addEventListener('click', function() {
        console.log("close")
        document.getElementById("hislist").style.display = 'none';
    });
    document.getElementById("ghbtn").addEventListener('click', function() {
        console.log("hislist")
        document.getElementById("hislist").style.display = "block";
        gethis();
    });
</script>

{% endblock %}
