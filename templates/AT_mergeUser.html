{% extends 'base.html' %}
{% block content %}

<style>
    /* 合并用户：本页布局结构（控件 btn/input/textarea/pill/result 仍走 components.css） */
    .merge-cols {
        height: 100vh;
        display: flex;
        justify-content: center;
        gap: 16px;
        padding: 16px;
        background: #f0f2f5;
        overflow: hidden;
    }
    .merge-panel {
        width: 680px;
        max-width: 100%;
        background: #fff;
        border: 1px solid var(--gray-100);
        border-radius: var(--radius-2xl);
        box-shadow: var(--shadow-md);
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-y: auto;
    }
    .merge-title {
        width: 100%;
        font-size: 20px;
        font-weight: 600;
        color: var(--gray-900);
        padding-bottom: 8px;
        margin-bottom: 16px;
        border-bottom: 2px solid var(--gray-100);
        text-align: center;
    }
    .merge-row {
        align-self: stretch;
        display: flex;
        justify-content: flex-start;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
    }
    .merge-row--top { align-items: flex-start; }
    .merge-label {
        text-align: right;
        min-width: 80px;
        font-size: 14px;
        flex-shrink: 0;
    }
    .merge-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin: 12px 0;
    }
    .merge-actions--boxed {
        background: var(--gray-50);
        border-radius: var(--radius-lg);
        padding: 10px;
    }
</style>

<div class="merge-cols">
    <div class="merge-panel">

        <h1 class="merge-title">合并用户</h1>

        <div class="merge-row">
            <label class="merge-label"><span class="required">* </span>企业ID:</label>
            <input id='companyId' type='text' name='companyId' class="input input--wide"/>
        </div>

        <div class="merge-row merge-row--top">
            <label class="merge-label"><span class="required">* </span>openID:</label>
            <textarea id='openId' spellcheck="false" class="textarea textarea--wide" style="height:150px"></textarea>
        </div>

        <div class="merge-actions merge-actions--boxed">
            <label class="pill"><input id='p' name="env" type="radio" value="prod" checked/> 生产环境</label>
            <label class="pill"><input id='t' name="env" type="radio" value="test"/> 测试环境</label>
        </div>

        <div class="merge-actions">
            <button id="mu" name="mu" type="button" class="btn btn--primary btn--lg">合并用户</button>
            <button type="button" class="btn btn--secondary btn--lg" data-draft-reset style="margin-left:12px">重置</button>
        </div>

        <div id='result' class="result"></div>
    </div>
</div>

<script type="text/javascript">
    document.getElementById('mu').addEventListener('click',function(){
        var cid = document.getElementById('companyId').value;
        var opids = document.getElementById('openId').value;
        var env = document.querySelector("input[name='env']:checked").value;
        var data = JSON.stringify({
            "companyId": cid,
            "opids": opids,
            "env": env
        })
        if (cid.length == 0){
            alert('企业ID不能为空！');
            return;
        }
        if (opids.length==0){
            alert('openID不能为空！');
            return;
        }
        console.log('777777:',data)
        const result = document.getElementById('result');
        result.innerHTML = "<img src='../static/img/loading.gif' height='10'/>";
        axios.post(`/sv/mergeUser`,data,{headers: header})
        .then(response => {
            var res = response.data;
            console.log('手工合并企业succ:',res.data);
            result.innerHTML = res.data;
        })
        .catch(err => {console.log(`手工合并企业err: ${err}`)})
    });
</script>

{% endblock %}
