{% extends 'base.html' %}
{% block content %}
{% load static %}

<style>
    /* 加推 Saleskits 配置：本页布局结构（控件 btn/input/select/textarea/pill/result 仍走 components.css） */
    .sk-cols {
        height: 100vh;
        display: flex;
        gap: 16px;
        padding: 16px;
        background: #f0f2f5;
        overflow: hidden;
    }
    .sk-panel {
        flex: 1;
        min-width: 0;
        background: #fff;
        border: 1px solid var(--gray-100);
        border-radius: var(--radius-2xl);
        box-shadow: var(--shadow-md);
        padding: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .sk-panel__header {
        flex-shrink: 0;
        padding: 12px 20px;
        border-bottom: 1px solid var(--gray-100);
        font-size: 16px;
        font-weight: 600;
        color: var(--gray-800);
    }
    .sk-panel__body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 16px 20px;
    }
    .sk-label {
        display: block;
        font-size: 15px;
        font-weight: 600;
        color: var(--gray-800);
        margin-bottom: 6px;
    }
    .sk-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 16px;
    }
    .sk-check {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        cursor: pointer;
    }
    /* 模态框（本页保留的对话框结构） */
    .sk-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    .sk-modal__box {
        background: #fff;
        border-radius: var(--radius-2xl);
        padding: 24px;
        max-width: 90vw;
        max-height: 85vh;
        overflow: auto;
        box-shadow: var(--shadow-xl);
    }
</style>

<div class="sk-cols">

    <!-- 左栏：配置 -->
    <div class="sk-panel" style="flex:1.2">
        <div class="sk-panel__header">加推 Saleskits 配置</div>
        <div class="sk-panel__body">

            <label class="sk-label">企业 ID / 席位</label>
            <div class="sk-row">
                <textarea id="companyIds" class="textarea textarea--muted" style="flex:1; min-width:140px; height:80px" placeholder="企业 ID/IDs" onkeydown="return banInputSapce(event);" onKeyup="return inputSapceTrim(event,this);"></textarea>
                <textarea id="sseats" class="textarea textarea--muted" style="flex:1; min-width:90px; max-width:120px; height:80px" placeholder="销售席位" onkeydown="return banInputSapce(event);" onKeyup="return inputSapceTrim(event,this);"></textarea>
                <textarea id="pseats" class="textarea textarea--muted" style="flex:1; min-width:90px; max-width:120px; height:80px" placeholder="推荐官席位" onkeydown="return banInputSapce(event);" onKeyup="return inputSapceTrim(event,this);"></textarea>
            </div>

            <div id="cmk">
                <label class="sk-label">企业模块</label>
                <div class="sk-row">
                    <label class="sk-check"><input id="mk107" type="checkbox" value="M107" name="mk"/>M107（推广表单）</label>
                    <label class="sk-check"><input id="mk138" type="checkbox" value="M138" name="mk"/>M138（任务中心）</label>
                    <label class="sk-check"><input id="mk139" type="checkbox" value="M139" name="mk"/>M139（产品库）</label>
                    <label class="sk-check"><input id="mk142" type="checkbox" value="M142" name="mk"/>M142（toB版）</label>
                    <label class="sk-check"><input id="mk143" type="checkbox" value="M143" name="mk"/>M143（AI名片）</label>
                </div>
            </div>

            <div id="jzc" style="display:none;">
                <label class="sk-label">家装类型</label>
                <div class="sk-row">
                    <label class="pill"><input name="jz" type="radio" value="hmy_company"/>红蚂蚁</label>
                    <label class="pill"><input name="jz" type="radio" value="ds_company"/>点石</label>
                </div>
            </div>

            <label class="sk-label">版本</label>
            <div class="sk-row">
                <label class="pill"><input id="zs" name="type" type="radio" value="zs" checked/>招商版</label>
                <label class="pill"><input id="jz" name="type" type="radio" value="jz"/>家装版</label>
            </div>

            <label class="sk-label">环境</label>
            <div class="sk-row">
                <label class="pill"><input name="env" type="radio" value="prod" checked/>生产</label>
                <label id="tenv" class="pill"><input name="env" type="radio" value="test"/>测试</label>
            </div>

            <button id="skInit" type="button" class="btn btn--primary">提交</button>
            <button type="button" class="btn btn--secondary" data-draft-reset style="margin-left:12px">重置</button>

            <div style="height:20px"></div>
            <div id="result1" style="font-size:14px; line-height:1.625; color:var(--gray-600); word-break:break-word"></div>
        </div>
    </div>

    <!-- 右栏：结果 -->
    <div class="sk-panel">
        <div class="sk-panel__header">执行结果</div>
        <div class="sk-panel__body">
            <div id="jst"></div>
        </div>
    </div>

</div>

<div class="sk-modal" id="dialog">
    <div class="sk-modal__box"></div>
</div>

<script src="{% static 'js/querymsgbyds.js' %}"></script>
<script src="{% static 'js/jtsaleskits.js' %}"></script>
{% endblock %}
