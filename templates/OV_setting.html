{% extends 'base.html' %}
{% block title %}基线版配置{% endblock %}
{% block li21 %}
<li class="first-menu single" style="background-color: rgb(202, 227, 250);border-right: rgb(0, 132, 255) solid 3px;">
    <a href="{{config.SITE_SETTING}}" class="originSetting" id="originSetting" style="color: rgb(0, 132, 255);font-weight: 600;font-size: 16px;">
        <i class="fa-solid solid"></i> {{config.SITE_SETTING_NAME}}</a></li>{%endblock%}
{% block content %}
<style>
    .right.part {
        display: flex;
        gap: 16px;
        padding: 10px 16px;
        height: 99%;
    }
    
    .card {
        flex: 1;
        background: #fff;
        border: 1px solid #f3f4f6;
        border-radius: 16px;
        padding: 10px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
    }
    
    .card-title {
        text-align: center;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid #f0f0f0;
    }
    
    .card-title h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        color: #333;
    }
    
    /* 表单区域：只包 label+input，两列对齐(max-content自适应) + 居中 */
    .form-grid {
        display: grid;
        grid-template-columns: max-content 180px;
        column-gap: 8px;
        row-gap: 8px;
        align-items: center;
    }

    .form-group {
        display: contents;
    }

    .form-group label {
        text-align: right;
        white-space: nowrap;
    }

    .form-group label .required {
        color: red;
    }

    .form-group input,
    .form-group select {
        width: 180px;
        padding: 8px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        outline: none;
        transition: border-color 0.3s;
        text-align: center;
    }

    .form-group input:focus,
    .form-group select:focus {
        border-color: #6366f1;
    }

    .form-group.region-select {
        margin-top: 0px;
    }

    .region-select select {
        max-width: 180px;
    }
    
    .env-group {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 15px 0;
    }
    
    .env-group label {
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 5px 16px;
        border-radius: 9999px;
        border: 1px solid #d1d5db;
        background: #fff;
        font-size: 13px;
        transition: all .15s;
        user-select: none;
    }
    .env-group label:has(input:checked) {
        background: #6366f1;
        color: #fff;
        border-color: #6366f1;
    }
    .env-group input[type="radio"] {
        display: none;
    }
    
    .btn-group {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 15px;
    }
    
    .btn-reset {
        background: #fff;
        border: 1px solid #d1d5db;
        color: #666;
    }
    
    .btn-submit {
        background: #111827;
        border: none;
        color: white;
        font-weight: bold;
    }

    .btn-submit:hover {
        background: #374151;
    }
    
    .result {
        flex: 1;
        margin-top: 10px;
        padding: 10px;
        border: 0px solid #f0f0f0;
        border-radius: 8px;
        overflow-y: auto;
        overflow-x: hidden;
        font-size: 15px;
        text-align: center;
        width: 100%;
        word-wrap: break-word;
        word-break: break-all;
        white-space: pre-wrap;
    }
</style>

<div class='right part'>
    <!-- 卡片1: 基线版企业开户 -->
    <div class="card">
        <div class="card-title">
            <h1>基线版企业开户</h1>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label><span class="required" style="visibility:hidden;">* </span>私有域名:</label>
                <select id="privaddr1" onfocus="getprivaddr(event)" disabled>
                    <option value="">请选择</option>
                </select>
            </div>
            <div class="form-group">
                <label><span class="required">* </span>企业名称:</label>
                <input id="compName" type="text" placeholder="输入企业全称"/>
            </div>
            <div class="form-group">
                <label><span class="required">* </span>登录账号:</label>
                <input id="loginName" type="text" placeholder="输入手机号"/>
            </div>
            <div class="form-group">
                <label><span class="required" style="visibility:hidden;">* </span>销售席位:</label>
                <input id="maxTotAcc" type="number" placeholder="输入销售席位数"/>
            </div>
            <div class="form-group">
                <label><span class="required">* </span>语言类型:</label>
                <select id="langType">
                    <option value="zh-CN" selected>中文（简体）</option>
                    <option value="en">English</option>
                </select>
            </div>
            <div class="form-group">
                <label><span class="required" style="visibility:hidden;">* </span>有效日期:</label>
                <input id="expireTime" class="card expireTime" type="date"/>
            </div>
        </div>
        <div class="env-group">
            <label><input id='t' name="env1" type="radio" value="test" checked/> 测试环境</label>
            <label><input id='p' name="env1" type="radio" value="prod"/> 生产环境</label>
        </div>
        <div class="btn-group">
            <button id='oaReset' class="btn btn-reset"> 重置 </button>
            <button id='oaSubmit' class="btn btn-submit"> 提交 </button>
        </div>
        <div id="oaResult" class="result"></div>
    </div>

    <!-- 卡片2: 基线版企业信息配置 -->
    <div class="card">
        <div class="card-title">
            <h1>基线版企业信息配置</h1>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label><span class="required" style="visibility:hidden;">* </span>私有域名:</label>
                <select id="privaddr3" onfocus="getprivaddr(event)" disabled>
                    <option value="">请选择</option>
                </select>
            </div>
            <div class="form-group">
                <label><span class="required">* </span>企业ID:</label>
                <input id="compId3" type="text" placeholder="输入后回车可查有效日期"/>
            </div>
            <div class="form-group">
                <label><span class="required" style="visibility:hidden;">* </span>销售席位:</label>
                <input id="maxTotAcc3" type="number" placeholder="0为无限席位"/>
            </div>
            <div class="form-group">
                <label><span class="required" style="visibility:hidden;">* </span>有效日期:</label>
                <div style="display: flex; align-items: center;">
                    <input id="expireTime3" class="card3 expireTime3" type="date" style="width: 155px;" disabled/>
                    <input type="checkbox" id="islong" style="width: 16px; margin-left: 8px;"/>
                </div>
            </div>
            <div class="form-group">
                <label><span class="required" style="visibility:hidden;">* </span>企业状态:</label>
                <select id="compStatus">
                    <option value="" selected>请选择</option>
                    <option value="1">正常</option>
                    <option value="0">禁用</option>
                    <option value="2">注销</option>
                </select>
            </div>
            <div class="form-group">
                <label><span class="required" style="visibility:hidden;">* </span>AI名片:</label>
                <select id="aiCardSwitch">
                    <option value="" selected>请选择</option>
                    <option value="1">开启</option>
                    <option value="0">关闭</option>
                </select>
            </div>
        </div>
        <div class="env-group">
            <label><input id='t3' name="env3" type="radio" value="test" checked/> 测试环境</label>
            <label><input id='p3' name="env3" type="radio" value="prod"/> 生产环境</label>
        </div>
        <div class="btn-group">
            <button id='uciReset' class="btn btn-reset"> 重置 </button>
            <button id='uciSubmit' class="btn btn-submit"> 提交 </button>
        </div>
        <div id="uciResult" class="result"></div>
    </div>

    <!-- 卡片3: 基线版企业绑定小程序 -->
    <div class="card">
        <div class="card-title">
            <h1>基线版企业绑定小程序</h1>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label><span class="required" style="visibility:hidden;">* </span>私有域名:</label>
                <select id="privaddr2" onfocus="getprivaddr(event)" disabled>
                    <option value="">请选择</option>
                </select>
            </div>
            <div class="form-group">
                <label><span class="required">* </span>企业ID:</label>
                <input id="compId" type="text"/>
            </div>
            <div class="form-group">
                <label><span class="required">* </span>APP ID:</label>
                <input id="appId" type="text"/>
            </div>
            <div class="form-group">
                <label><span class="required">* </span>Secret:</label>
                <input id="appSecret" type="text" data-no-draft/>
            </div>
        </div>
        <div class="env-group">
            <label><input id='t2' name="env2" type="radio" value="test" checked/> 测试环境</label>
            <label><input id='p2' name="env2" type="radio" value="prod"/> 生产环境</label>
        </div>
        <div class="btn-group">
            <button id='wxaiReset' class="btn btn-reset"> 重置 </button>
            <button id='wxaiSubmit' class="btn btn-submit"> 提交 </button>
        </div>
        <div id="wxaiResult" class="result"></div>
    </div>

    <!-- 卡片4: 修改企管角色密码 -->
    <div class="card">
        <div class="card-title">
            <h1>修改企管角色密码</h1>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label><span class="required">* </span>用户ID:</label>
                <input id="userid" type="text"/>
            </div>
            <div class="form-group">
                <label><span class="required">* </span>密码:</label>
                <input id="passwd" type="text" data-no-draft/>
            </div>
        </div>
        <div class="env-group">
            <label><input id='t4' name="env4" type="radio" value="test" checked/> 测试环境</label>
            <label><input id='p4' name="env4" type="radio" value="prod"/> 生产环境</label>
        </div>
        <div class="btn-group">
            <button id='ipwdReset' class="btn btn-reset"> 重置 </button>
            <button id='ipwdSubmit' class="btn btn-submit"> 提交 </button>
        </div>
        <div id="ipwdResult" class="result"></div>
    </div>
</div>
<script type="text/javascript">
    var color1 = "green"
    var color2 = "white"
    const loading = "<img src='../static/img/loading.gif' height='10'/>";

    function getprivaddr(event){
        const opts = {"中交四航院":"https://47.92.151.128:443"};
        getselectvalue(event,opts)
    }

    document.addEventListener('DOMContentLoaded', function() {
        // 初始执行一次（设置默认状态）
        handleRadioChange();
        // 给所有单选框绑定change事件（按name分组，也可全局监听）
        const radioList = document.querySelectorAll('input[type="radio"]');
        radioList.forEach(radio => {
            radio.addEventListener('change', handleRadioChange);
        });
    });

    function handleRadioChange(e) {
    // 若通过change事件触发，e.target即为当前切换的单选框
        const radio = e?.target || document.querySelector('input[type="radio"]:checked');
        if (!radio) return;

        const radioId = radio.id;
        const groupName = radio.name;

        // 根据分组匹配输入框（示例：group1→privaddr1，group2→privaddr2）
        const privaddr = document.getElementById(`privaddr${groupName.slice(-1)}`);
        
        if (radioId.startsWith('t')) {
            privaddr.disabled = true;
            privaddr.value = '';
        } else if (radioId.startsWith('p')) {
            privaddr.disabled = false;
        }
    }

    //开户配置提交
    const oaSubmit = document.getElementById('oaSubmit');
    oaSubmit.addEventListener('click',function(){
        const oan = "基线版企业开户";
        const privaddr = document.getElementById("privaddr1").value;
        const cname = document.getElementById('compName').value;
        const csname = "";
        const mta = document.getElementById('maxTotAcc').value;
        const phone = ";"
        const lname = document.getElementById('loginName').value;
        const pwd = "Aa@123456";
        const langType = document.getElementById("langType").value;
        const etime = document.getElementById("expireTime").value;
        const env = document.querySelector("input[name='env1']:checked").value;
        const version = 3;
        const data = JSON.stringify({
            privaddr,cname,csname,mta,phone,lname,pwd,langType,etime,env,version,"type": "openaccount"})
        // 输入为空校验
        // console.log('mk的长度为：',mk.length)
        if (privaddr && env == "test"){
            alert("私有化域名不可以调测试环境！");
            return;
        }
        if (cname.length == 0 || lname.length == 0){
            alert('必填项不能为空！');
            return;
        }
        if (langType == ""){
            alert('选择语言种类！');
            return;
        }
        console.log('开户配置提交入参:',data)
        const oaResult = document.getElementById('oaResult');
        oaResult.innerHTML = loading;
        axios.post(`/ov/setting/openaccount`,data,{headers: header})
        .then(response => {
            const res = response.data.data;
            oaResult.innerHTML = res;
            console.log(`${oan} succ: ${res}`);
        })
        .catch(err => {
            console.log(`${oan} err: ${err}`)
        })
    });
    // 基线版开户--重置
    const oaReset = document.getElementById('oaReset');
    oaReset.addEventListener('click',function(){
        document.getElementById("compName").value = "";
        document.getElementById("loginName").value = "";
        document.getElementById("maxTotAcc").value = "";
        document.getElementById("langType").value = "zh-CN";
        document.querySelector("input[name=env1]").checked = true;
        getdate(".expireTime");
    })
    
    const checkbox = document.getElementById('islong');
    let islong = false;
    checkbox.addEventListener('change', function () {
        if (this.checked) {
            console.log("复选框已勾选");
            islong = true
            document.getElementById("expireTime3").removeAttribute('disabled');
        } else {
            console.log("复选框已取消勾选");
            islong = false
            document.getElementById("expireTime3").setAttribute('disabled',"");
        }
    });
    //修改基线版企业信息
    const uciSubmit = document.getElementById('uciSubmit');
    uciSubmit.addEventListener('click',function(){
        const ucin = "基线版修改企业信息";
        const privaddr = document.getElementById("privaddr3").value;
        const compid = document.getElementById('compId3').value;
        const mta = document.getElementById('maxTotAcc3').value;
        const cs = document.getElementById("compStatus").value;
        const isl = islong;
        const aics = document.getElementById("aiCardSwitch").value;
        const expt = document.getElementById("expireTime3").value;
        const env = document.querySelector("input[name='env3']:checked").value;
        const version = 3;
        let expireTime = "";
        if(islong){
            expireTime = expt;
        }
        const data = JSON.stringify({
            privaddr,compid, mta,cs,aics,isl,expireTime,env,version,"type": "updcompinfo"})
        // console.log('mk的长度为：',mk.length)
        if (compid.length == 0){
            alert('“企业ID”不能为空！');
            return;
        }
        if (mta.length==0 && cs.length==0 && aics.length==0 && isl==false){
            alert("输入需要修改的内容！");
            return;
        }
        console.log('777777:',data);
        const uciResult = document.getElementById('uciResult');
        uciResult.innerHTML = loading;
        axios.post(`/ov/setting/updcompinfo`,data,{headers: header})
        .then(response => {
            const res = response.data.data;
            uciResult.innerHTML = res;
            console.log(`${ucin} succ: ${res}`);
        })
        .catch(err => {
            console.log(`${ucin} err: ${err}`)
        })
    });
    //修改基线版企业信息--重置
    const uciReset = document.getElementById('uciReset');
    uciReset.addEventListener('click',function(){
        document.querySelector("input[name=env3]").checked = true;
        document.getElementById("compId3").value = "";
        document.getElementById("maxTotAcc3").value = "";
        document.getElementById("compStatus").value = "";
        document.getElementById("privaddr3").value = "";
        document.getElementById("aiCardSwitch").value = "";
        getdate(".expireTime3");
        document.getElementById("expireTime3").setAttribute('disabled',"");
        document.querySelector("input[type='checkbox'][id='islong']").checked = false;
    })

    //基线版企业绑定小程序--重置
    const wxaiReset = document.getElementById('wxaiReset');
    wxaiReset.addEventListener('click',function(){
        document.getElementById("compId").value = "";
        document.getElementById("appId").value = "";
        document.getElementById("appSecret").value = "";
    })
    //企业绑定小程序
    const wxaiSubmit = document.getElementById('wxaiSubmit');
    wxaiSubmit.addEventListener('click',function(){
        const wxain = "基线版企业绑定小程序";
        const privaddr = document.getElementById("privaddr2").value;
        const cid = document.getElementById('compId').value;
        const appid = document.getElementById('appId').value;
        const secret = document.getElementById('appSecret').value;
        const env = document.querySelector("input[name='env2']:checked").value;
        const data = JSON.stringify({
            privaddr,cid,appid,secret,env,"type": "savewxappinfo"})
        if (cid.length == 0 || appid.length == 0 || secret.length == 0){
            alert('必填项不能为空！');
            return;
        }
        console.log('777777:',data)
        const wxaiResult = document.getElementById('wxaiResult');
        wxaiResult.innerHTML = loading;
        axios.post(`/ov/setting/savewxappinfo`,data,{headers: header})
        .then(response => {
            const res = response.data.data;
            wxaiResult.innerHTML = res;
            console.log(`${wxain} succ: ${res}`);
        })
        .catch(err => {
            console.log(`${wxain} err: ${err}`)
        })
    })

    //初始化密码
    const ipwdSubmit = document.getElementById('ipwdSubmit');
    ipwdSubmit.addEventListener('click',function(){
        const ipwdn = "基线版初始化密码"
        const userid = document.getElementById('userid').value;
        const passwd = document.getElementById('passwd').value;
        const env = document.querySelector("input[name='env4']:checked").value;
        const data = JSON.stringify({
            userid,passwd,env,"type": "initpwd"})
        // 输入为空校验
        // console.log('mk的长度为：',mk.length)
        if (userid.length == 0 || passwd.length == 0){
            alert('必填项不能为空！');
            return;
        }
        console.log('777777:',data);
        const ipwdResult = document.getElementById('ipwdResult');
        axios.post(`/ov/setting/initpwd`,data,{headers: header})
        .then(response => {
            const res = response.data.data;
            ipwdResult.innerHTML = res;
            console.log(`${ipwdn} succ: ${res}`);
        })
        .catch(err => {
            console.log(`${ipwdn} err: ${err}`)
        })
    });
    //初始化密码--重置
    const ipwdReset = document.getElementById('ipwdReset');
    ipwdReset.addEventListener('click',function(){
        document.getElementById("userid").value = "";
        document.getElementById("passwd").value = "";
    })
    
    function getExpireDateByCompId(compId){
        const geted="根据企业id查有效期";
        const env = document.querySelector("input[name='env3']:checked").value;
        const data = JSON.stringify({
            compId, env, "type": "getEDByCID"
        });
        axios.post(`/ov/setting/getEDByCID`,data,{headers: header})
        .then(response => {
            const res = response.data.data;
            console.log(`${geted} succ: ${res}`);
            document.getElementById('expireTime3').value = res;
        })
        .catch(err => {
            console.log(`${geted} err: ${err}`);
        })
    }
    document.addEventListener('DOMContentLoaded', function() {
        // 获取输入框元素
        const input = document.getElementById('compId3');
        // 为输入框添加点击回车的事件监听器
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' || event.keyCode === 13) {
                if(input.value === ""){
                    alert("输入“邮箱/手机”查询!")
                    return
                }
                // 调用你想要执行的函数
                getExpireDateByCompId(input.value);
            }
        });
    });
    function getdate(et){
        const today = new Date();
        const nextYear = new Date(today.getFullYear() + 1, today.getMonth(), today.getDate()+1);
        document.querySelector(et).min = today.toISOString().split('T')[0];
        document.querySelector(et).value = nextYear.toISOString().split('T')[0];
    }
    window.addEventListener('load', function() {
        getdate(".expireTime");
        getdate(".expireTime3");
    });

    // 获取输入框元素
    const numInputElement = document.querySelectorAll('input[type="number"]');
    //用forEach方法为每个元素添加事件
    numInputElement.forEach(function (input) {
        // 给输入框添加失去焦点事件监听器
        input.addEventListener('blur', function () {
            const value = parseFloat(this.value);
            if (!isNaN(value)) {
                this.value = Math.round(value);
            }
        })
    })
    // 获取所有日期输入框
    getDateInput('.expireTime');
    getDateInput('.expireTime3');
</script>

{% endblock %}
