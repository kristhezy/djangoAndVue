{% extends 'base.html' %}
{% block content %}
{% load static %}

<style>
    /* 转介绍 3.0 配置：本页布局结构（控件 btn/input/textarea/pill/result 仍走 components.css） */
    .ur3-cols {
        height: 100vh;
        display: flex;
        gap: 16px;
        padding: 16px;
        background: #f0f2f5;
        overflow: hidden;
    }
    .ur3-panel {
        flex: 1;
        min-width: 0;
        background: #fff;
        border: 1px solid var(--gray-100);
        border-radius: var(--radius-2xl);
        box-shadow: var(--shadow-md);
        padding: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .ur3-panel__header {
        flex-shrink: 0;
        padding: 12px 20px;
        border-bottom: 1px solid var(--gray-100);
        font-size: 16px;
        font-weight: 600;
        color: var(--gray-800);
    }
    .ur3-panel__body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 16px 20px;
    }
    .ur3-label {
        display: block;
        font-size: 15px;
        font-weight: 600;
        color: var(--gray-800);
        margin-bottom: 6px;
    }
    .ur3-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 16px;
    }
</style>

<div class="ur3-cols">

    <!-- 左栏 -->
    <div class="ur3-panel" style="flex:1.2">
        <div class="ur3-panel__header">转介绍 3.0 配置</div>
        <div class="ur3-panel__body">
            <div>
                <label class="ur3-label">企业 ID / 席位</label>
                <div class="ur3-row">
                    <textarea id="companyIds" class="textarea" style="flex:1; min-width:140px; height:80px" placeholder="企业 IDs" onkeydown="return banInputSapce(event);" onKeyup="return inputSapceTrim(event,this);"></textarea>
                    <textarea id="seats" class="textarea" style="flex:1; min-width:140px; max-width:160px; height:80px" placeholder="席位数" onkeydown="return banInputSapce(event);" onKeyup="return inputSapceTrim(event,this);"></textarea>
                </div>
            </div>

            <div>
                <label class="ur3-label">环境</label>
                <div class="ur3-row">
                    <label class="pill"><input id="p" name="env" type="radio" value="prod" checked/>生产</label>
                    <label class="pill"><input id="t" name="env" type="radio" value="test"/>测试</label>
                </div>
            </div>

            <button id="sysUpgrade" class="btn btn--primary">提交</button>
            <button type="button" class="btn btn--secondary" data-draft-reset style="margin-left:12px">重置</button>

            <div style="height:20px"></div>
            <div class="result" id="result1"></div>
            <div id="tips"></div>
            <div id="rsql" style="font-size:12px; color:var(--gray-300); margin-top:8px; user-select:none"></div>
            <div id="copybtn"></div>
        </div>
    </div>

    <!-- 右栏 -->
    <div class="ur3-panel">
        <div class="ur3-panel__header">执行结果</div>
        <div class="ur3-panel__body">
            <div id="jst" style="font-size:14px; line-height:1.625; color:var(--gray-600); word-break:break-word"></div>
        </div>
    </div>

</div>

<script src="{% static 'js/querymsgbyds.js' %}"></script>
<script src="{% static 'js/upgradeR3.js' %}"></script>
{% endblock %}
