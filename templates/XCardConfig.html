{% extends 'base.html' %}
{% block content %}
<style>
    .right.part {
        display: flex;
        gap: 16px;
        padding: 10px 16px;
        height: 99%;
    }
    
    .card {
        flex: 1;
        background: #fff;
        border: 1px solid #f3f4f6;
        border-radius: 16px;
        padding: 10px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
    }
    
    .card-title {
        text-align: center;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid #f0f0f0;
    }
    
    .card-title h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        color: #333;
    }
    
    /* 表单区域：只包 label+input，两列对齐(max-content自适应) + 居中 */
    .form-grid {
        display: grid;
        grid-template-columns: max-content 180px;
        column-gap: 8px;
        row-gap: 8px;
        align-items: center;
    }

    .form-group {
        display: contents;
    }

    .form-group label {
        text-align: right;
        white-space: nowrap;
    }

    .form-group label .required {
        color: red;
    }

    .form-group input,
    .form-group select {
        width: 180px;
        padding: 8px 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        outline: none;
        transition: border-color 0.3s;
        text-align: center;
    }

    .form-group input:focus,
    .form-group select:focus {
        border-color: #6366f1;
    }

    .form-group.region-select {
        margin-top: 0px;
    }

    .region-select select {
        max-width: 180px;
    }
    
    /* 通用下拉框样式 */
    .desc {
        display: block;
        margin: 0 auto 15px;
        padding: 6px 16px;
        background: #6366f1;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        text-align: center;
    }
    
    .desc option {
        background: #fff;
        color: #333;
    }
    
    .env-group {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 15px 0;
    }
    
    .env-group label {
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 5px 16px;
        border-radius: 9999px;
        border: 1px solid #d1d5db;
        background: #fff;
        font-size: 13px;
        transition: all .15s;
        user-select: none;
    }
    .env-group label:has(input:checked) {
        background: #6366f1;
        color: #fff;
        border-color: #6366f1;
    }
    .env-group input[type="radio"] {
        display: none;
    }
    
    .btn-group {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 15px;
    }
    
    .btn {
        padding: 6px 50px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
    }
    
    .btn-reset {
        background: #fff;
        border: 1px solid #d1d5db;
        color: #666;
    }
    
    .btn-submit {
        background: #111827;
        border: none;
        color: white;
        font-weight: bold;
    }

    .btn-submit:hover {
        background: #374151;
    }
    
    .result {
        flex: 1;
        margin-top: 10px;
        padding: 10px;
        border: 0px solid #f0f0f0;
        border-radius: 8px;
        overflow-y: auto;
        overflow-x: hidden;
        font-size: 15px;
        text-align: center;
        width: 100%;
        word-wrap: break-word;
        word-break: break-all;
        white-space: pre-wrap;
    }
    #cardType{
        display: none;
    }
</style>

<div class='right part'>

        <div class="btn-group">

    <!-- 卡片3: 生成邀请链路 -->

        <div class="card-title">
            <h1>生成邀请链路</h1>
        </div>
        <select id="desc3" class="desc" data-target="country">

            <option value="indo"> 印尼(Indonesia) </option>

        </select>

            <div class="form-group">

                <input id="uname3" type="text"/>

            <div class="form-group">
                <label><span class="required">* </span>邮箱后缀:</label>
                <input id="emailSuffix3" type="text" value="@jt.cn"/>
            </div>
            <div class="form-group">

                <input id="referralCode3" type="text"/>

                <label><span class="required">* </span>国家/地区:</label>
                <select id="country3" onfocus="getCountry('country3','desc3','env3','emailSuffix3')">

            <div class="form-group">
                <label><span class="required">* </span>卡片类型:</label>
                <select id="cardType3">

        </div>
        <div class="env-group">
            <label><input id='t3' name="env3" type="radio" value="test" checked/> 测试环境</label>
            <label><input id='p3' name="env3" type="radio" value="prod"/> 生产环境</label>
        </div>
        <div class="btn-group">
            <!-- <button id='refReset' class="btn btn-reset"> 重置 </button> -->
            <button id='refSubmit' class="btn btn-submit"> 提交 </button>
        </div>
        <div id="refResult" class="result"></div>
    </div>
</div>
<script type="text/javascript">
    var color1 = "green"
    var color2 = "white"
    // 设置 AJAX 请求头

    let version = 8;
    //xcard用户注册
    var oaSubmit = document.getElementById('oaSubmit');
    oaSubmit.addEventListener('click',function(){
        var oan = "XCard用户注册";
        const desc = document.getElementById('desc').value;
        var uname = document.getElementById('runame').value;
        const emailSuffix = document.getElementById('emailSuffix').value;
        var rcode = document.getElementById('referralCode').value;
        var country = document.getElementById('country').value;
        const bnum = document.getElementById('rnum').value;
        var env = document.querySelector("input[name='env']:checked").value;
        const type = "xcardRegist";
        var data = JSON.stringify({
            desc, uname, emailSuffix, rcode, country, bnum, env, version
        })
        // 输入为空校验
        if (uname.length == 0 || rcode.length == 0 || bnum.length == 0){
            alert('必填项不能为空！');
            return;
        }
        if (bnum < 1){
            alert("'账号数量'必须是正整数! ");
            return;
        }
        console.log('开户配置提交入参:',data)
        var oaResult = document.getElementById('oaResult');
        oaResult.innerHTML = "<img src='../static/img/loading.gif' height='10'/>";
        axios.post(`/ov/xcard/${type}`,data,{headers: header})
        .then(response => {
            var res = response.data.data;
            oaResult.innerHTML = res;
            console.log(`${oan} succ: ${res}`);
        })
        .catch(err => {
            console.log(`${oan} err: ${err}`)
        })
    });

    function getCountry(selectId,descv,envv,emailSuffixv){
        let grcn = "获取国家/地区信息";
        let desc = document.getElementById(`${descv}`).value;
        let version = 7;
        let env = document.querySelector(`input[name="${envv}"]:checked`).value;
        var uname = document.getElementById('puname').value;
        let emailSuffix = document.getElementById(`${emailSuffixv}`).value;
        const bnum = document.getElementById('pnum').value;
        let type = "getCountry";
        let data = JSON.stringify({
            uname,emailSuffix,bnum,env,version,desc
        })
        console.log(`getCountry data: ${data}`)
        axios.post(`/ov/xcard/${type}`,data,{headers: header})
        .then(response => {
            let res = response.data.data;
            // console.log(`getCountry: ${JSON.stringify(res)}`)
            if (res.length !== 0){
                const selectElement = document.getElementById(selectId);
                selectElement.innerHTML = ''; 
                // 3. 动态生成 Option 并追加到 Select
                res.forEach(item => {
                    // 创建 option 元素
                    const option = document.createElement('option');
                    // 设置 value (对应 id)
                    option.value = item.id;
                    // 设置显示文本 (对应 name)
                    option.textContent = item.name;
                    // 将 option 添加到 select 中
                    selectElement.appendChild(option);
                });
                // 控制台输出验证
                console.log("已加载的选项数量:", res.length);
                console.log(`${grcn} succ: ${JSON.stringify(res)}`);
            }else{
                alert('无国家/地区数据！');
                return;
            }
        })
        .catch(err => {
            console.log(`${grcn} err: ${err}`)
        })
    }
    // document.addEventListener()
    //xcard余额购买会员
    var wxaiSubmit = document.getElementById('wxaiSubmit');
    wxaiSubmit.addEventListener('click',function(){
        var wxain = "xcard支付购卡";
        const desc = document.getElementById('desc2').value;
        var uname = document.getElementById('puname').value;
        const emailSuffix = document.getElementById('emailSuffix2').value;
        const country = document.getElementById('country2').value;
        const cardType = document.getElementById('cardType').value;
        const productId = document.getElementById('productId').value;
        var paypwd = document.getElementById("paypwd").value;
        const bnum = document.getElementById('pnum').value;
        var env = document.querySelector("input[name='env2']:checked").value;
        const type = "userBuyCard";
        var data = JSON.stringify({
            desc, uname, emailSuffix,country, cardType,productId, paypwd, bnum, env, version
        })
        if (uname.length == 0 || paypwd.length == 0 || bnum.length == 0){
            alert('必填项不能为空！');
            return;
        }
        if (bnum < 1){
            alert("'账号数量'必须是正整数! ");
            return;
        }
        console.log('777777:',data)
        var wxaiResult = document.getElementById('wxaiResult');
        wxaiResult.innerHTML = "<img src='../static/img/loading.gif' height='10'/>"; 
        axios.post(`/ov/xcard/${type}`,data,{headers: header})
        .then(response => {
            var res = response.data.data;
            wxaiResult.innerHTML = res;
            console.log(`${wxain} succ: ${res}`);
        })
        .catch(err => {
            console.log(`${wxain} err: ${err}`)
        })
    })

    //xcard生成邀请链路
    var refSubmit = document.getElementById('refSubmit');
    refSubmit.addEventListener('click',function(){
        var refn = "xcard生成邀请链路";
        const desc = document.getElementById('desc3').value;
        var uname = document.getElementById('uname3').value;
        const emailSuffix = document.getElementById('emailSuffix3').value;
        const rcode = document.getElementById('referralCode3').value;
        const country = document.getElementById('country3').value;
        const cardType = document.getElementById('cardType3').value;
        const bnum = document.getElementById('num3').value;
        var env = document.querySelector("input[name='env3']:checked").value;
        const type = "addReferralLinks";
        var data = JSON.stringify({
            desc, uname, emailSuffix, rcode, country, cardType, paypwd, bnum, env, version
        })
        if (uname.length == 0 || paypwd.length == 0 || bnum.length == 0){
            alert('必填项不能为空！');
            return;
        }
        if (bnum < 1){
            alert("'账号数量'必须是正整数! ");
            return;
        }
        console.log('777777:',data)
        var refResult = document.getElementById('refResult');
        refResult.innerHTML = "<img src='../static/img/loading.gif' height='10'/>"; 
        axios.post(`/ov/xcard/${type}`,data,{headers: header})
        .then(response => {
            var res = response.data.data;
            refResult.innerHTML = res;
            console.log(`${refn} succ: ${res}`);
        })
        .catch(err => {
            console.log(`${refn} err: ${err}`)
        })
    });

    const mappings = {
        'taiwan': '3630979328926013',  // 台湾
        'indo': '3630979328925988',
        'thai': '3630979328926003',
    };

    document.querySelectorAll('select[data-target="country"]').forEach(mainSelect => {
        const subSelect = document.getElementById(mainSelect.dataset.target);
        
        mainSelect.addEventListener('change', function() {
            subSelect.value = mappings[this.value] || '';
        });
    });

    // 监听国家选择变化
    document.getElementById('country2').addEventListener('change', function () {
        const country = this.value;
        const cardTypeSelect = document.getElementById('cardType');
        const productIdSelect = document.getElementById('productId');

        // 根据国家决定显示哪个
        // 例如：台湾（TW）显示 productId，其他显示 cardType
        if (country === '3630979328925976' || country === '3630979328925782') {
            cardTypeSelect.style.display = 'none';
            productIdSelect.style.display = 'block'; 
        }
        if (country === '3630979328926013') {
            cardTypeSelect.style.display = 'block';
            productIdSelect.style.display = 'none';
        }
    });

    
</script>
