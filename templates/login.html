<!DOCTYPE html>
<html>
{% load static %}
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录</title>
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('../static/img/bg.webp') no-repeat center center fixed;
            background-size: cover;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .login-container {
            display: flex;
            width: 780px;
            height: 440px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        /* 左侧装饰面板 */
        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, #2D7EE8 0%, #1a5bbf 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            font-family: "KaiTi", "STKaiti", "楷体", "Noto Serif SC", serif;
        }

        .left-panel .poetry {
            color: rgba(255, 255, 255, 0.9);
            font-size: 22px;
            line-height: 2;
            letter-spacing: 4px;
            text-align: center;
        }

        .left-panel .poetry .line2 {
            margin-top: 16px;
        }

        /* 右侧表单面板 */
        .right-panel {
            flex: 1;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 48px;
        }

        .right-panel h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 32px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            padding: 0 12px;
            transition: border-color 0.3s;
        }

        .input-group:focus-within {
            border-color: #2D7EE8;
            box-shadow: 0 0 0 2px rgba(45, 126, 232, 0.15);
        }

        .input-group .icon {
            display: flex;
            align-items: center;
            color: #999;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .input-group input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            padding: 11px 0;
            background: transparent;
            color: #333;
        }

        .input-group input::placeholder {
            color: #bfbfbf;
        }

        .login-btn {
            width: 100%;
            margin-top: 8px;
            padding: 11px 0;
            font-size: 16px;
            color: #fff;
            background-color: #2D7EE8;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .login-btn:hover {
            background-color: #1a5bbf;
        }

        .login-btn:active {
            background-color: #1548a0;
        }

        /* Toast */
        .m-toast-pop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .m-toast-inner {
            position: absolute;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .m-toast-inner-text {
            display: inline-block;
            padding: 16px 24px;
            font-size: 15px;
            color: #fff;
            letter-spacing: 0;
            line-height: 1.5;
            background: rgba(0, 0, 0, 0.72);
            border-radius: 8px;
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 8px 0 0;
        }
        .remember-row input[type="checkbox"] {
            width: 14px; height: 14px;
            accent-color: #6366f1;
        }
        .remember-row label {
            font-size: 13px;
            color: rgba(0, 0, 0, 0.7);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <!-- 左侧装饰面板 -->
        <div class="left-panel">
            <div class="poetry">
                <div>两岸猿声啼不住</div>
                <div class="line2">轻舟已过万重山</div>
            </div>
        </div>

        <!-- 右侧登录表单 -->
        <div class="right-panel">
            <h1>测试平台登录</h1>
            <form name="l1" method="POST" class="login" style="width: 100%;">
                <div class="input-group">
                    <span class="icon">
                        <svg fill="currentColor" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" width="18" height="18">
                            <path d="M512 512c-105.6 0-192-86.4-192-192s86.4-192 192-192 192 86.4 192 192-86.4 192-192 192zm0 64c384 0 384 128 384 320H128c0-192 0-320 384-320z"/>
                        </svg>
                    </span>
                    <input type="text" id="loginName" name="loginName" required placeholder="请输入用户名"/>
                </div>

                <div class="input-group">
                    <span class="icon">
                        <svg fill="currentColor" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" width="18" height="18">
                            <path d="M320 448V320c0-105.6 86.4-192 192-192s192 86.4 192 192v128h64c35.2 0 64 28.8 64 64v320c0 35.2-28.8 64-64 64H256c-35.2 0-64-28.8-64-64V512c0-35.2 28.8-64 64-64h64zm64 0h256V320c0-70.4-57.6-128-128-128s-128 57.6-128 128v128zm128 128h-9.6c-28.8 4.8-49.6 33.6-44.8 62.4l16 97.6c3.2 17.6 19.2 32 36.8 32s33.6-12.8 36.8-32l16-97.6v-9.6C566.4 600 542.4 576 512 576z"/>
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" required placeholder="请输入密码"/>
                </div>

                <div class="remember-row">
                    <input type="checkbox" id="rememberMe" checked/>
                    <label for="rememberMe">记住密码</label>
                </div>
                <button id="loginbtn" type="button" class="login-btn">登录</button>

                <div id="m-toast-pop" class="m-toast-pop">
                    <div class="m-toast-inner"><div class="m-toast-inner-text" id="m-toast-inner-text"></div></div>
                </div>
            </form>
        </div>
    </div>

    <script type="text/javascript" src="{% static 'js/mypub.js' %}?v={{ config.STATIC_VERSION }}"></script>
    <script type="text/javascript" src="{% static 'js/axios.min.js' %}?v={{ config.STATIC_VERSION }}"></script>
    <script>
        var csrftoken = getCookie('csrftoken');
        var header = {'X-CSRFToken': csrftoken};
        var username = document.getElementById('loginName');
        var password = document.getElementById('password');
        window.onload = function getlp(){
            username.value = localStorage.getItem('username') || '';
            password.value = localStorage.getItem('password') || '';
            if (username.value) {
                document.getElementById('rememberMe').checked = true;
            }
        }

        const loginBtn = document.getElementById('loginbtn');
        document.addEventListener('keypress', function(e) {
            var eCode = e.keyCode ? e.keyCode : (e.which ? e.which : e.charCode);
            console.log(eCode);
            if (eCode === 13) {
                if (loginBtn) {
                    loginBtn.click();
                }
            }
        });


        // 读取 URL 中的 next 参数（来自 login_required 重定向或 session 过期）
        function getNextParam() {
            var params = new URLSearchParams(window.location.search);
            return params.get('next') || '';
        }

        loginBtn.addEventListener('click',function(){
            var ln = document.getElementById('loginName').value;
            var pw = document.getElementById('password').value;
            var next = getNextParam();
            var data = JSON.stringify({
                ln: ln,
                pw: pw,
                next: next
            })
            if (ln.length == 0){
                showToast('请输入账号！', 2000);
                return;
            }
            if (pw.length == 0){
                showToast('请输入密码！', 2000);
                return;
            }

            const hideToast = showToast(
                "<div><img src='../static/img/loading.gif' width='110'/></div>",
                0,
                true
            );
            axios.post(`/login`,data,{headers: header})
            .then(response => {
                var res = response.data;
                console.log("login res:",res);
                if (res.success){
                    hideToast();
                    showToast('登录成功！', 2000);
                    if (document.getElementById('rememberMe').checked) {
                        localStorage.setItem('username', ln);
                        localStorage.setItem('password', pw);
                    } else {
                        localStorage.removeItem('username');
                        localStorage.removeItem('password');
                    }
                    localStorage.setItem('isLoggedIn', 'true');
                    top.location.href = res.redirect_url || '../home';
                }
                else{
                    rlt = res.error;
                    hideToast();
                    showToast(rlt, 5000);
                }
            })
            .catch(err => {
                console.log(`登录失败，原因: ${err}`)
                showToast('登录失败！', 3000);
            })
        });
    </script>
</body>
</html>
