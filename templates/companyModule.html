{% extends 'base.html' %}
{% block content %}
{% load static %}

<style>
    /* 企业模块配置：本页布局结构（控件 btn/input/pill/checkbox/result 仍走 components.css） */
    .cm-scroll {
        height: 100vh;
        overflow-y: auto;
        padding: 16px;
        background: #f0f2f5;
    }
    .cm-panel {
        background: #fff;
        border: 1px solid var(--gray-100);
        border-radius: var(--radius-2xl);
        box-shadow: var(--shadow-md);
        padding: 24px;
        margin-bottom: 16px;
    }
    .cm-label {
        display: block;
        font-size: 15px;
        font-weight: 600;
        color: var(--gray-800);
        margin-bottom: 6px;
    }
    /* 分组标题（品牌色下划线组头） */
    .cm-group {
        display: inline-block;
        font-size: 15px;
        font-weight: 500;
        border-bottom: 2px solid var(--indigo-500);
        padding-bottom: 4px;
        margin-bottom: 4px;
    }
    .cm-group--muted {
        color: var(--gray-500);
        border-bottom: none;
    }
    /* 复选框网格（5 列） */
    .cm-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        row-gap: 8px;
        column-gap: 12px;
        margin-bottom: 8px;
    }
    .cm-check {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        cursor: pointer;
    }
    .cm-check--muted {
        color: var(--gray-400);
    }
</style>

<div class="cm-scroll">

    <div class="cm-panel" style="max-width:920px; margin:0 auto 8px">

        <!-- 企业IDs -->
        <div style="margin-bottom:16px">
            <label class="cm-label" style="font-size:17px; font-weight:500">企 业 IDs: </label>
            <input id='companyId' type='text' name='companyId' onkeydown="return banInputSapce(event);" onKeyup="return inputSapceTrim(event,this);" placeholder="示例:'727972691243679744,593467466257072128,583716956373278720'" class="input input--wide input--muted" style="width:700px"/>
        </div>

        <!-- 企业模块 -->
        <div style="margin-bottom:8px">
            <label class="cm-label" style="font-size:17px; font-weight:500">企业模块:</label>
        </div>

        <!-- 分组1: 共用模块 -->
        <div style="margin-bottom:8px">
            <div class="cm-group">• 共用模块</div>
            <div class="cm-grid">
                <label class="cm-check"><input id='mk100' type='checkbox' value="M100" name="mk" class="checkbox"/>M100(官网)</label>
                <label class="cm-check"><input id='mk105' type='checkbox' value="M105" name="mk" class="checkbox"/>M105(动态)</label>
                <label class="cm-check"><input id='mk107' class="mutex-checkbox checkbox" type='checkbox' value="M107" name="mk"/>M107(表单)</label>
                <label class="cm-check"><input id='mk108' type='checkbox' value="M108" name="mk" class="checkbox"/>M108(视频)</label>
                <label class="cm-check"><input id='mk109' type='checkbox' value="M109" name="mk" class="checkbox"/>M109(宣传册)</label>
                <label class="cm-check"><input id='mk110' type='checkbox' value="M110" name="mk" class="checkbox"/>M110(案例库)</label>
                <label class="cm-check"><input id='mk111' type='checkbox' value="M111" name="mk" class="checkbox"/>M111(海报)</label>
                <label class="cm-check"><input id='mk112' type='checkbox' value="M112" name="mk" class="checkbox"/>M112(文章)</label>
                <label class="cm-check"><input id='mk113' type='checkbox' value="M113" name="mk" class="checkbox"/>M113(文件)</label>
            </div>
        </div>

        <!-- 分组2: 转介绍/工具版专属 -->
        <div style="margin-bottom:8px">
            <div class="cm-group">• 转介绍/工具版专属</div>
            <div class="cm-grid">
                <label class="cm-check"><input id='mk103' type='checkbox' value="M103" name="mk" class="checkbox"/>M103(推力系统)</label>
                <label class="cm-check"><input id='mk104' type='checkbox' value="M104" name="mk" class="checkbox"/>M104(小程序)</label>
                <label class="cm-check"><input id='mk114' type='checkbox' value="M114" name="mk" class="checkbox"/>M114(普通版商城)</label>
                <label class="cm-check"><input id='mk119' type='checkbox' value="M119" name="mk" class="checkbox"/>M119(活动分发)</label>
                <label class="cm-check"><input id='mk120' type='checkbox' value="M120" name="mk" class="checkbox"/>M120(优惠券)</label>
            </div>
        </div>

        <!-- 分组3: Saleskits专属 -->
        <div style="margin-bottom:8px">
            <div class="cm-group">• Saleskits专属 <img src="{% static 'img/new.gif' %}" style="display:inline"/></div>
            <div class="cm-grid">
                <label class="cm-check"><input id='mk140' type='checkbox' value="M140" name="mk" class="checkbox"/>M140(PLG「企管」)</label>
                <label class="cm-check"><input id='sk107' class="mutex-checkbox checkbox" type='checkbox' value="M107" name="mk"/>M107(推广表单)</label>
                <label class="cm-check"><input id='mk138' type='checkbox' value="M138" name="mk" class="checkbox"/>M138(任务中心)</label>
                <label class="cm-check"><input id='mk139' type='checkbox' value="M139" name="mk" class="checkbox"/>M139(产品库)</label>
                <label class="cm-check"><input id='mk142' type='checkbox' value="M142" name="mk" class="checkbox"/>M142(toB版)</label>
                <label class="cm-check"><input id='mk143' type='checkbox' value="M143" name="mk" class="checkbox"/>M143(AI名片)</label>
            </div>
        </div>

        <!-- 分组4: 版本 -->
        <div style="margin-bottom:8px">
            <div class="cm-group">• 版本</div>
            <div class="cm-grid">
                <label class="cm-check"><input id='mk127' type='checkbox' value="M127" name="mk" class="checkbox"/>M127(加推云盘版)</label>
                <label class="cm-check"><input id='mk128' type='checkbox' value="M128" name="mk" class="checkbox"/>M128(转介绍3.0)</label>
                <label class="cm-check"><input id='mk136' type='checkbox' value="M136" name="mk" class="checkbox"/>M136(招商版)</label>
                <label class="cm-check"><input id='mk137' type='checkbox' value="M137" name="mk" class="checkbox"/>M137(Saleskits版)</label>
                <label class="cm-check"><input id='mk146' type='checkbox' value="M146" name="mk" class="checkbox"/>M146(家装版)</label>
                <label class="cm-check"><input id='mk144' type='checkbox' value="M144" name="mk" class="checkbox"/>M144(三一重工[定制])</label>
            </div>
        </div>

        <!-- 分组5: 不常用 -->
        <div style="margin-bottom:8px">
            <div class="cm-group">• 不常用</div>
            <div class="cm-grid">
                <label class="cm-check"><input id='mk115' type='checkbox' value="M115" name="mk" class="checkbox"/>M115(直播)</label>
                <label class="cm-check"><input id='mk116' type='checkbox' value="M116" name="mk" class="checkbox"/>M116(图谱)</label>
                <label class="cm-check"><input id='mk124' type='checkbox' value="M124" name="mk" class="checkbox"/>M124(企微助手)</label>
                <label class="cm-check"><input id='mk121' type='checkbox' value="M121" name="mk" class="checkbox"/>M121(活码)</label>
                <label class="cm-check"><input id='mk122' type='checkbox' value="M122" name="mk" class="checkbox"/>M122(奥田定制)</label>
                <label class="cm-check"><input id='mk123' type='checkbox' value="M123" name="mk" class="checkbox"/>M123(课程培训)</label>
                <label class="cm-check"><input id='mk129' type='checkbox' value="M129" name="mk" class="checkbox"/>M129(自动化营销)</label>
                <label class="cm-check"><input id='mk131' type='checkbox' value="M131" name="mk" class="checkbox"/>M131(智能渠道码)</label>
                <label class="cm-check"><input id='mk132' type='checkbox' value="M132" name="mk" class="checkbox"/>M132(客户群运营)</label>
                <label class="cm-check"><input id='mk025' type='checkbox' value="M025" name="mk" class="checkbox"/><b>M025(商城分销)</b></label>
            </div>
        </div>

        <!-- 分组6: 已停用 -->
        <div style="margin-bottom:8px">
            <div class="cm-group--muted">• 已停用模块:</div>
            <div class="cm-grid">
                <label class="cm-check cm-check--muted"><input id='mk102' type='checkbox' value="M102" name="mk" class="checkbox"/>M102(销售管理组件)</label>
                <label class="cm-check cm-check--muted"><input id='mk117' type='checkbox' value="M117" name="mk" class="checkbox"/>M117(转介绍2.0)</label>
                <label class="cm-check cm-check--muted"><input id='mk106' type='checkbox' value="M106" name="mk" class="checkbox"/>M106(推任务)</label>
                <label class="cm-check cm-check--muted"><input id='mk126' type='checkbox' value="M126" name="mk" class="checkbox"/>M126(聊天侧边栏)</label>
            </div>
        </div>

        <!-- 环境 + 操作 -->
        <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px; margin:16px 0; padding-bottom:12px; border-bottom:1px solid var(--gray-200)">
            <label class="pill"><input id='p' name="env" type="radio" value="prod" checked/>生产环境</label>
            <label class="pill"><input id='t' name="env" type="radio" value="test"/>测试环境</label>
            <span style="color:var(--gray-300); margin:0 8px">||</span>
            <label class="pill"><input id='am' name="cm" type="radio" value="addm" checked/>增加模块</label>
            <label class="pill"><input id='dm' name="cm" type="radio" value="delm"/>删除模块</label>
        </div>

        <!-- 提交 -->
        <div class="text-center">
            <button id="umk" name="umk" type="button" class="btn btn--primary">提交</button>
            <button type="button" class="btn btn--secondary" data-draft-reset style="margin-left:12px">重置</button>
        </div>
    </div>

    <!-- 结果 -->
    <div class="cm-panel" style="max-width:920px; margin:0 auto; min-height:120px; display:flex; align-items:center; justify-content:center">
        <div id='result' style="width:888px; max-width:100%; font-size:16px; color:var(--indigo-500)"></div>
    </div>
</div>

<script type="text/javascript">
    const checkboxes = document.querySelectorAll('.mutex-checkbox');
    checkboxes.forEach(cb => {
        cb.addEventListener('change', function() {
            if (this.checked) {
                checkboxes.forEach(otherCb => {
                    if (otherCb !== this) {
                        otherCb.checked = false;
                    }
                });
            }
        });
    });
    let umk = document.getElementById('umk');
    umk.addEventListener('click',function() {
        let cid = document.getElementById('companyId').value;
        const mk = Array.from(document.querySelectorAll("input[type='checkbox'][name='mk']:checked"))
            .map(cb => cb.value)
            .join(",");
        let env = document.querySelector("input[name='env']:checked").value;
        let cm = document.querySelector("input[name='cm']:checked").value;
        let data = JSON.stringify({
            "companyId": cid,
            "mk": mk,
            "env": env,
            "cm": cm
        })
        if (cid.length == 0 || mk.length == 0) {
            if (cid.length == 0) {
                showToast('企业id不能为空！');
                return;
            }
            if (mk.length == 0) {
                showToast('至少选择一个模块！');
                return;
            }
        }
        const result = document.getElementById('result');
        result.innerHTML = "<img src='../static/img/loading.gif' height='10'/>";
        axios.post(`/sv/companyModule`,data,{headers: header})
        .then(response => {
            var res = response.data;
            console.log('配置企业模块succ:', res);
            result.innerHTML = res.data;
            document.querySelectorAll("input[type='checkbox']").forEach( checkbox=>{
                checkbox.checked = false;
            })
        })
    });
</script>

{% endblock %}
