{% extends 'base.html' %}
{% block content %}
{% load static %}
<script src="{% static 'js/marked.min.js' %}?v={{ config.STATIC_VERSION }}"></script>
<style>
    .agent-page { width: 100%; height: 100vh; display: flex; flex-direction: row;
                  padding: 12px; background: #f0f2f5; gap: 12px; box-sizing: border-box; }

    .col-side { width: 220px; flex-shrink: 0; display: flex; flex-direction: column;
                background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.08);
                overflow: hidden; }
    .side-hd { padding: 14px 14px 10px; border-bottom: 1px solid #f0f0f0; }
    .btn-newchat { width: 100%; padding: 8px 0; border: 1px solid #e0e0e0; border-radius: 8px;
                   background: #fff; color: #333; cursor: pointer; font-size: 13px;
                   transition: all .15s; }
    .btn-newchat:hover { border-color: #4f6ef7; color: #4f6ef7; }
    .side-label { margin-top: 10px; font-size: 12px; color: #999; }
    .side-list { flex: 1; overflow-y: auto; padding: 8px; }
    .side-list::-webkit-scrollbar { width: 5px; }
    .side-list::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 5px; }
    .hht { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px;
           cursor: pointer; font-size: 13px; color: #333; margin-bottom: 2px; }
    .hht:hover { background: #f5f5f5; }
    .hht.active { background: #eef1fe; color: #4f6ef7; }
    .hht .tit { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hht .del-btn { color: #bbb; font-size: 12px; flex-shrink: 0; padding: 2px 4px; border-radius: 4px; }
    .hht .del-btn:hover { color: #ff4d4f; background: #fff0f0; }

    /* 右侧链接抽屉 */
    .drawer-mask { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 999;
                   display: none; }
    .drawer-mask.show { display: block; }
    .drawer { position: fixed; top: 0; right: 0; width: 62%; height: 100%; z-index: 1000;
              background: #fff; box-shadow: -4px 0 20px rgba(0,0,0,.15);
              display: flex; flex-direction: column; transform: translateX(100%);
              transition: transform .22s ease; }
    .drawer.show { transform: translateX(0); }
    .drawer-hd { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
                 border-bottom: 1px solid #f0f0f0; }
    .drawer-title { flex: 1; font-size: 14px; color: #333; overflow: hidden;
                    text-overflow: ellipsis; white-space: nowrap; }
    .drawer-btn { border: 0; background: none; cursor: pointer; color: #666; font-size: 13px;
                  padding: 6px 10px; border-radius: 6px; }
    .drawer-btn:hover { background: #f5f5f5; }
    .drawer-close { font-size: 16px; }
    .drawer-close:hover { color: #ff4d4f; }
    .drawer-open-new:hover { color: #4f6ef7; }
    .drawer-body { flex: 1; position: relative; }
    .drawer-iframe { width: 100%; height: 100%; border: 0; }

    .agent-card { flex: 1; display: flex; flex-direction: column; border-radius: 14px;
                  background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.08); overflow: hidden;
                  min-width: 0; }

    .agent-hd { padding: 12px 20px; border-bottom: 1px solid #f0f0f0;
                font-size: 15px; font-weight: 600; color: #333; display: flex;
                align-items: center; gap: 8px; }
    .agent-hd .tag { font-size: 12px; font-weight: 400; color: #999;
                     background: #f5f5f5; padding: 2px 8px; border-radius: 10px; }

    .chat-area { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex;
                 flex-direction: column; align-items: center; gap: 24px; }
    .chat-area::-webkit-scrollbar { width: 5px; }
    .chat-area::-webkit-scrollbar-thumb { background: #d9d9d9; border-radius: 5px; }

    .qa-block { width: 800px; max-width: 100%; background: #fff;
                border-radius: 12px; padding: 16px 20px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }

    .msg-row { display: flex; }
    .msg-row + .msg-row { margin-top: 14px; }
    .msg-row.user { justify-content: flex-end; }
    .msg-body { flex: 1; min-width: 0; line-height: 1.72;
                overflow-wrap: break-word; word-break: break-word; }
    .msg-body:not(.no-bubble) { padding: 10px 14px; border-radius: 10px; }
    .msg-row.user .msg-body:not(.no-bubble) { flex: 0 1 auto; text-align: left;
                                              background: #1a1a1a; color: #fff; }
    .msg-row.assistant .msg-body:not(.no-bubble) { background: #f7f7f8; }

    .msg-body h1,.msg-body h2,.msg-body h3 { margin: .5em 0 .25em; }
    .msg-body h2 { font-size: 1.15em; border-bottom: 1px solid #e8e8e8; padding-bottom: 3px; }
    .msg-body h3 { font-size: 1.05em; }
    .msg-body p { margin: .35em 0; }
    .msg-body ul,.msg-body ol { padding-left: 1.4em; margin: .25em 0; }
    .msg-body pre { background: #2d2d2d; color: #e8e8e8; padding: 12px 14px; border-radius: 8px;
                    overflow-x: auto; font-size: 13px; line-height: 1.45; margin: 6px 0;
                    white-space: pre-wrap; word-break: break-all; }
    .msg-body code { background: rgba(0,0,0,.05); padding: 2px 5px; border-radius: 3px; font-size: .88em; }
    .msg-body pre code { background: none; padding: 0; }
    .msg-body blockquote { border-left: 3px solid #ccc; padding-left: 10px; color: #666; margin: 6px 0; }
    .msg-body table { border-collapse: collapse; margin: 6px 0; width: 100%; }
    .msg-body th,.msg-body td { border: 1px solid #ddd; padding: 5px 8px; text-align: left; }
    .msg-body a { color: #4f6ef7; }
    .msg-row.user .msg-body code { background: rgba(255,255,255,.15); color: #fff; }
    .msg-row.user .msg-body pre { background: #444; color: #ddd; }
    .msg-row.user .msg-body a { color: #aac4ff; }

    .status-banner { font-size: 13px; color: #2c5cc5; margin-bottom: 6px; display: flex;
                     align-items: center; gap: 6px; }
    .status-banner.done { display: none; }
    .status-banner .fa-hourglass { animation: spin 1.5s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .stream-cursor { color: #4f6ef7; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* loading dots（等待动画） */
    .loading-dot { display: inline-block; width: 5px; height: 5px; margin-left: 3px;
                   border-radius: 50%; background: #4f6ef7; vertical-align: middle;
                   animation: dot-bounce 1.2s infinite ease-in-out; }
    .loading-dot:nth-child(2) { animation-delay: .2s; }
    .loading-dot:nth-child(3) { animation-delay: .4s; }
    @keyframes dot-bounce { 0%, 80%, 100% { transform: scale(0); opacity: .3; }
                            40% { transform: scale(1); opacity: 1; } }

    /* 执行日志流（可折叠） */
    .stream-logs { margin: 4px 0 8px; display: flex; flex-direction: column; gap: 4px; }
    .log-item { border: 1px solid #eee; border-radius: 6px; font-size: 12px; background: #fafafa;
                overflow: hidden; }
    .log-item summary { cursor: pointer; padding: 5px 10px; color: #555; user-select: none;
                        list-style: none; display: flex; align-items: center; gap: 6px; }
    .log-item summary::-webkit-details-marker { display: none; }
    .log-item summary:hover { background: #f0f0f0; }
    .log-item summary::before { content: '▸'; color: #999; transition: transform .15s; flex-shrink: 0; }
    .log-item[open] summary::before { transform: rotate(90deg); }
    .log-item pre { margin: 0; padding: 8px 10px; border-top: 1px solid #eee; background: #fff;
                    overflow: auto; white-space: pre-wrap; word-break: break-all; font-size: 12px;
                    color: #666; max-height: 200px; }
    .log-item.log-result summary { color: #2e7d32; }

    .welcome { flex: 1; display: flex; flex-direction: column; align-items: center;
               justify-content: center; color: #aaa; font-size: 20px; }

    .chat-foot { padding: 10px 20px 16px; display: flex; justify-content: center;
                 border-top: 1px solid #f0f0f0; }
    .input-wrap { width: 100%; max-width: 800px; display: flex; align-items: flex-end; gap: 8px;
                  border: 1px solid #e0e0e0; border-radius: 12px; padding: 10px 12px;
                  background: #fafafa; transition: border-color .2s; }
    .input-wrap:focus-within { border-color: #4f6ef7; box-shadow: 0 0 0 2px rgba(79,110,247,.1); }
    .input-editor { flex: 1; border: 0; outline: none; font-size: 14px; line-height: 1.5; margin: 5px 0;
                    max-height: 140px; overflow-y: auto; word-break: break-word; }
    .input-editor:empty::before { content: '输入问题… 支持查企业/用户信息、联网搜索、分析日志'; color: #aaa; }
    .btn-send, .btn-stop { width: 34px; height: 34px; border-radius: 8px; border: 0; cursor: pointer;
                           font-size: 16px; display: flex; align-items: center; justify-content: center;
                           flex-shrink: 0; transition: all .15s; }
    .btn-send { background: #4f6ef7; color: #fff; }
    .btn-send:hover { background: #3d5ce0; }
    .btn-send:disabled { background: #c5cff5; cursor: not-allowed; }
    .btn-stop { background: #fff; color: #999; border: 1px solid #e0e0e0; display: none; }
    .btn-stop:hover { color: #ff4d4f; border-color: #ff4d4f; }
</style>

<div class="agent-page">
    <div class="col-side">
        <div class="side-hd">
            <button class="btn-newchat" onclick="newChat()">＋ 新会话</button>
            <div class="side-label">历史会话</div>
        </div>
        <div class="side-list" id="hishh"></div>
    </div>
    <div class="agent-card">
        <div class="agent-hd">
            🤖 Agent
            <span class="tag">项目专属助手 · 企业/用户查询 · 联网搜索 · 日志分析</span>
        </div>
        <div class="chat-area" id="container">
            <div id="show-result"></div>
        </div>
        <div class="chat-foot">
            <div class="input-wrap" id="inputWrap">
                <div class="input-editor" id="askwords" contenteditable="true"
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();submitAsk();}"></div>
                <button class="btn-stop" id="btnStop" onclick="stopStream()" title="停止生成">■</button>
                <button class="btn-send" id="submit" onclick="submitAsk()" title="发送 (Enter)">↑</button>
            </div>
        </div>
    </div>
</div>

<!-- 右侧链接抽屉 -->
<div class="drawer-mask" id="drawerMask" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
    <div class="drawer-hd">
        <button class="drawer-btn drawer-close" onclick="closeDrawer()" title="关闭">✕</button>
        <span class="drawer-title" id="drawerTitle"></span>
        <button class="drawer-btn drawer-open-new" onclick="openInNewTab()" title="在新窗口打开">↗ 新窗口打开</button>
    </div>
    <div class="drawer-body">
        <iframe class="drawer-iframe" id="drawerFrame"></iframe>
    </div>
</div>

<script>
    let showresult = document.getElementById('show-result');
    let $editor = document.getElementById('askwords');
    let isSubmitting = false;
    let abortCtrl = null;
    let chatId = 0;
    let historyList = [];
    let loadHistoryLock = false;
    let currentDrawerUrl = '';

    marked.setOptions({ breaks: true, gfm: true });
    function renderMd(text) {
        if (!text) return '';
        try { return typeof marked !== 'undefined' ? marked.parse(text) : escapeHTML(text).replace(/\n/g, '<br>'); }
        catch(e) { return escapeHTML(text).replace(/\n/g, '<br>'); }
    }

    function showWelcome() {
        showresult.innerHTML = showWelcomeHTML();
    }

    function showWelcomeHTML() {
        return '<div class="welcome">你好，我是 Agent 🤖<br>可以帮你查企业/用户信息、联网搜索、分析报错日志</div>';
    }

    function scrollToBottom() {
        let c = document.getElementById('container');
        c.scrollTop = c.scrollHeight;
    }

    function renderLoading(ask) {
        let rawAsk = ask.replace(/"/g, '&quot;').replace(/&/g, '&amp;');
        return `<div class="qa-block"><div class="msg-row user">
            <div class="msg-body">${escapeHTML(ask)}</div></div>
            <div class="msg-row assistant">
            <div class="msg-body no-bubble" style="display:flex;align-items:center;gap:10px;color:#2c5cc5;font-size:13px;">
            <i class="fa-solid fa-hourglass"></i> AI 正在处理，请稍候</div></div></div>`;
    }

    function renderStreamBlock(ask) {
        let rawAsk = ask.replace(/"/g, '&quot;').replace(/&/g, '&amp;');
        return `<div class="qa-block" id="stream-block"><div class="msg-row user">
            <div class="msg-body">${escapeHTML(ask)}</div></div>
            <div class="msg-row assistant">
            <div class="msg-body" id="stream-body">
            <div class="status-banner" id="stream-status"><i class="fa-solid fa-hourglass"></i> 正在准备…</div>
            <div class="stream-logs" id="stream-logs"></div>
            <span id="stream-text"></span><span class="stream-cursor" id="stream-cursor"> ▌</span>
            </div></div></div>`;
    }

    function renderLogItem(d) {
        if (d.step === 'tool_call') {
            let args = '';
            try { args = JSON.stringify(d.args, null, 2); } catch(e) { args = String(d.args); }
            return `<details class="log-item"><summary>🔧 调用工具 ${escapeHTML(d.tool)}</summary><pre>${escapeHTML(args)}</pre></details>`;
        } else if (d.step === 'tool_result') {
            return `<details class="log-item log-result"><summary>✅ 工具 ${escapeHTML(d.tool)} 返回</summary><pre>${escapeHTML(d.result)}</pre></details>`;
        }
        return '';
    }

    async function submitAsk() {
        if (isSubmitting) return;
        let aw = $editor.innerText.trim();
        if (!aw) return;

        isSubmitting = true;
        document.getElementById('submit').disabled = true;
        document.getElementById('btnStop').style.display = 'flex';
        $editor.innerHTML = '';
        $editor.focus();

        cleanupStreamIds();
        let wel = showresult.querySelector('.welcome');
        if (wel) wel.remove();
        showresult.innerHTML += renderLoading(aw);
        scrollToBottom();

        abortCtrl = new AbortController();
        let textBuf = "";
        let streamStarted = false;

        try {
            let resp = await fetch('/pv/agent/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
                body: JSON.stringify({ input: aw, id: chatId || 0 }),
                signal: abortCtrl.signal,
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

            let reader = resp.body.getReader();
            let decoder = new TextDecoder();
            let buf = "";

            while (true) {
                let { done, value } = await reader.read();
                if (done) break;
                buf += decoder.decode(value, { stream: true });
                let parts = buf.split('\n\n');
                buf = parts.pop();
                for (let p of parts) {
                    if (!p.startsWith('data: ')) continue;
                    let ds = p.slice(6);
                    if (!ds || ds === '[DONE]') continue;
                    let ev;
                    try { ev = JSON.parse(ds); } catch(e) { continue; }

                    if (ev.type === 'start') {
                        streamStarted = true;
                        let idx = showresult.innerHTML.lastIndexOf('<div class="qa-block"');
                        if (idx !== -1)
                            showresult.innerHTML = showresult.innerHTML.substring(0, idx) + renderStreamBlock(aw);
                    } else if (ev.type === 'status') {
                        let el = document.getElementById('stream-status');
                        if (el) {
                            let msg;
                            if (ev.content === 'thinking') msg = '💭 分析中<span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>';
                            else if (ev.content.startsWith('调用工具')) msg = '🔧 ' + escapeHTML(ev.content) + '…';
                            else msg = escapeHTML(ev.content);
                            el.innerHTML = msg;
                        }
                    } else if (ev.type === 'log') {
                        let logEl = document.getElementById('stream-logs');
                        if (logEl) {
                            let d = null;
                            try { d = JSON.parse(ev.content); } catch(e) { d = null; }
                            if (d) logEl.innerHTML += renderLogItem(d);
                        }
                    } else if (ev.type === 'text') {
                        textBuf += ev.content;
                        let el = document.getElementById('stream-text');
                        if (el) el.innerHTML = renderMd(textBuf);
                        let st = document.getElementById('stream-status');
                        if (st) st.classList.add('done');
                    } else if (ev.type === 'done') {
                        if (ev.id) chatId = ev.id;
                        finalizeStream(textBuf);
                        loadHistory();
                    } else if (ev.type === 'error') {
                        showresult.innerHTML += `<div class="qa-block"><div class="msg-row assistant"><div class="msg-body no-bubble" style="color:red;">${escapeHTML(ev.content)}</div></div></div>`;
                    }
                }
                scrollToBottom();
            }
        } catch (err) {
            if (err.name === 'AbortError') {
                let blocks = showresult.querySelectorAll('.qa-block');
                let lastBlock = blocks[blocks.length - 1];
                if (lastBlock) {
                    let body = lastBlock.querySelector('.msg-row.assistant .msg-body');
                    if (body && body.classList.contains('no-bubble'))
                        body.innerHTML = '<span style="color:#999;">⏹ 已停止</span>';
                }
                if (streamStarted) finalizeStream(textBuf);
            } else {
                console.error('agent stream err:', err);
                if (streamStarted) finalizeStream(textBuf);
            }
        } finally {
            isSubmitting = false;
            document.getElementById('submit').disabled = false;
            document.getElementById('btnStop').style.display = 'none';
            abortCtrl = null;
        }
    }

    function finalizeStream(answerText) {
        let c = document.getElementById('stream-cursor');
        if (c) c.remove();
        let st = document.getElementById('stream-status');
        if (st) st.classList.add('done');
        cleanupStreamIds();
    }

    function cleanupStreamIds() {
        for (let id of ['stream-body','stream-text','stream-status','stream-logs','stream-block']) {
            let el = document.getElementById(id);
            if (el) el.removeAttribute('id');
        }
        let c = document.getElementById('stream-cursor');
        if (c) c.remove();
    }

    function stopStream() {
        if (abortCtrl) abortCtrl.abort();
    }

    // ── 历史会话 ──
    function renderQA(ask, answer) {
        return `<div class="qa-block"><div class="msg-row user">
            <div class="msg-body">${escapeHTML(ask)}</div></div>
            <div class="msg-row assistant"><div class="msg-body">${renderMd(answer)}</div></div></div>`;
    }

    function loadHistory() {
        if (loadHistoryLock) return;
        loadHistoryLock = true;
        axios.post('/pv/agent/history', JSON.stringify({type:"gethishh"}), {headers:header})
            .then(res => {
                let raw = res.data.data;
                historyList = Array.isArray(raw) ? raw : Object.values(raw || {});
                let str = "";
                for (let i = 0; i < historyList.length; i++) {
                    let h = historyList[i];
                    let cls = (h.id == chatId) ? ' active' : '';
                    str += `<div class="hht${cls}" data-id="${h.id}">
                        <span class="tit" onclick="switchChat(${h.id})">${escapeHTML(h.title)}</span>
                        <span class="del-btn" onclick="event.stopPropagation();delHistory(${h.id})">✕</span>
                    </div>`;
                }
                document.getElementById('hishh').innerHTML = str;
            }).catch(err => console.log('loadHistory err:', err))
            .finally(() => { loadHistoryLock = false; });
    }

    function switchChat(did) {
        if (did == chatId) return;
        let item = historyList.find(h => h.id == did);
        if (!item) return;
        chatId = did;
        let arr = null;
        try { arr = JSON.parse(item.content); } catch(e) {}
        if (!Array.isArray(arr)) arr = [];
        showresult.innerHTML = arr.map(c => renderQA(c.ask, c.answer)).join('') || showWelcomeHTML();
        scrollToBottom();
        loadHistory();
    }

    function delHistory(did) {
        if (!confirm('确定删除这条会话吗？')) return;
        axios.post('/pv/agent/history', JSON.stringify({type:"delhistory", id: did}), {headers:header})
            .then(() => {
                if (did == chatId) { chatId = 0; showWelcome(); }
                loadHistory();
            }).catch(err => console.log('delHistory err:', err));
    }

    function newChat() {
        chatId = 0;
        $editor.innerHTML = '';
        showWelcome();
        loadHistory();
    }

    // ── 链接右侧抽屉 ──
    function openDrawer(url) {
        if (!url) return;
        currentDrawerUrl = url;
        document.getElementById('drawerTitle').textContent = url;
        document.getElementById('drawerFrame').src = url;
        document.getElementById('drawerMask').classList.add('show');
        document.getElementById('drawer').classList.add('show');
    }
    function closeDrawer() {
        document.getElementById('drawerMask').classList.remove('show');
        document.getElementById('drawer').classList.remove('show');
        document.getElementById('drawerFrame').src = 'about:blank';
        currentDrawerUrl = '';
    }
    function openInNewTab() {
        if (currentDrawerUrl) window.open(currentDrawerUrl, '_blank');
    }

    // 拦截回答里的链接点击（右侧抽屉打开，不跳走 iframe）
    document.getElementById('container').addEventListener('click', function(e) {
        let a = e.target.closest('a');
        if (!a) return;
        let href = a.getAttribute('href');
        if (!href) return;
        if (href.startsWith('#')) return;
        e.preventDefault();
        openDrawer(href);
    });

    showWelcome();
    loadHistory();
</script>

{% endblock %}
