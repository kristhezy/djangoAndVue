<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面不存在</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               background: #f0f2f5; }
        .box { text-align: center; }
        .box .code { font-size: 96px; font-weight: 700; color: #ddd; line-height: 1.2; }
        .box .msg  { font-size: 20px; color: #888; margin: 10px 0 30px; }
        .box .btn  { display: inline-block; padding: 10px 28px; border-radius: 8px;
                     background: #4f6ef7; color: #fff; text-decoration: none; font-size: 15px;
                     transition: background .15s; cursor: pointer; border: 0; }
        .box .btn:hover { background: #3b54d4; }
        .box .btn.ghost { background: transparent; color: #999; margin-left: 12px; }
        .box .btn.ghost:hover { color: #666; }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">404</div>
        <div class="msg">抱歉，您访问的页面不存在</div>
        <button class="btn" id="goBack">←  返回</button>
        <a class="btn ghost" href="/">回首页</a>
    </div>
    <script>
    document.getElementById('goBack').onclick = function() {
        if (document.referrer && new URL(document.referrer).origin === location.origin) {
            history.back();
        } else {
            location.href = '/';
        }
    };
    </script>
</body>
</html>
