{% extends 'base.html' %}
{% block content %}

<style>
    /* 企微工具：本页布局结构（控件 btn/input/select/pill/result 仍走 components.css） */
    .wecom-cols {
        height: 100vh;
        display: flex;
        gap: 16px;
        padding: 16px;
        background: #f0f2f5;
        overflow: hidden;
    }
    .wecom-card {
        flex: 1;
        min-width: 0;
        background: #fff;
        border: 1px solid var(--gray-100);
        border-radius: var(--radius-2xl);
        box-shadow: var(--shadow-md);
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-y: auto;
    }
    .wecom-title {
        width: 100%;
        font-size: 20px;
        font-weight: 600;
        color: var(--gray-900);
        padding-bottom: 8px;
        margin-bottom: 16px;
        border-bottom: 2px solid var(--gray-100);
        text-align: center;
    }
    .wecom-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
    }
    .wecom-label {
        text-align: right;
        min-width: 80px;
        font-size: 14px;
    }
    .wecom-label--wide { min-width: 100px; }
    .wecom-actions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin: 12px 0;
    }
    /* 只读结果文本域（企微链接/密文） */
    .wecom-result-ta {
        width: 100%;
        height: 100px;
        text-align: center;
        background: transparent;
        color: var(--indigo-500);
        border: 0;
        resize: none;
        outline: none;
    }
</style>

<div class="wecom-cols">

    <!-- 卡片1: 生成企微应用链接 -->
    <div class="wecom-card" style="max-width:500px">
        <h1 class="wecom-title">生成企微应用链接</h1>
        <div class="wecom-row">
            <label class="wecom-label wecom-label--wide"><span class="required">* </span>企业ID:</label>
            <input id='companyId' type='text' required onkeydown="return banInputSapce(event);" onKeyup="return inputSapceTrim(event,this);" class="input"/>
        </div>
        <div class="wecom-row">
            <label class="wecom-label wecom-label--wide"><span class="required">* </span>应用ID:</label>
            <select id="appId" class="select">
                <option value="cpe_tong" selected>通讯录</option>
                <option value="cpe_radar">雷达</option>
                <option value="cpe_file">文件</option>
                <option value="cpe_article">文章</option>
                <option value="cpe_video">视频</option>
                <option value="cpe_poster">海报</option>
                <option value="cpe_manual">宣传册</option>
                <option value="cpe_case">案例</option>
            </select>
        </div>
        <div class="wecom-actions">
            <label class="pill"><input id='p' name="env" type="radio" value="prod" checked/> 生产环境</label>
            <label class="pill"><input id='t' name="env" type="radio" value="test"/> 测试环境</label>
        </div>
        <div class="wecom-actions">
            <button id="btn1" class="btn btn--primary" type="button">提交</button>
            <button type="button" class="btn btn--secondary" data-draft-reset style="margin-left:12px">重置</button>
        </div>
        <div id='rltdiv' style="flex:1; margin-top:10px; width:100%; overflow-y:auto">
            <textarea id="result" readonly disabled class="wecom-result-ta"></textarea>
        </div>
    </div>

    <!-- 卡片2: 获取密文企微ID -->
    <div class="wecom-card" style="max-width:500px">
        <h1 class="wecom-title">获取密文企微ID</h1>
        <div class="wecom-row">
            <label class="wecom-label wecom-label--wide"><span class="required">* </span>企微ID(明文):</label>
            <input id='corpId' type='text' required onkeydown="return banInputSapce(event);" onKeyup="return inputSapceTrim(event,this);" class="input"/>
        </div>
        <div class="wecom-actions">
            <label class="pill"><input id='p1' name="env2" type="radio" value="prod" checked/> 生产环境</label>
            <label class="pill"><input id='t1' name="env2" type="radio" value="test"/> 测试环境</label>
        </div>
        <div class="wecom-actions">
            <button id="btn2" class="btn btn--primary" type="button">提交</button>
            <button type="button" class="btn btn--secondary" data-draft-reset style="margin-left:12px">重置</button>
        </div>
        <div id='rltdiv2' style="flex:1; margin-top:10px; width:100%; overflow-y:auto">
            <textarea id="result2" readonly disabled class="wecom-result-ta"></textarea>
        </div>
    </div>
</div>

<script>
    document.getElementById('btn1').addEventListener('click',function () {
        var cid = document.getElementById('companyId').value;
        var aid = document.getElementById('appId').value;
        var env = document.querySelector("input[name='env']:checked").value;
        var data = JSON.stringify({
            "companyId": cid,
            "appId": aid,
            "env": env,
            "type": 1
        })
        if (!cid || cid.length < 18 || cid.length > 19 || isNaN(cid)) {
            alert('企业ID只能是18或19位的纯数字！');
            return;
        }
        const rltdiv = document.getElementById('rltdiv');
        rltdiv.innerHTML = "<img src='../static/img/loading.gif' />";
        axios.post(`/sv/forWeCom`,data,{headers: header})
        .then(response => {
            var res = response.data;
            rltdiv.innerHTML = '<textarea id="result" readonly disabled class="wecom-result-ta"></textarea>';
            document.getElementById('result').value = res.data;
            if(res.data.includes('http')){
                window.open(res.data);
            }
        })
        .catch(err => {console.log(`生成企微应用链接err: ${err}`)})
    });
    document.getElementById('btn2').addEventListener('click',function () {
        var corpid = document.getElementById('corpId').value;
        var env = document.querySelector("input[name='env2']:checked").value;
        var data = JSON.stringify({
            "corpId": corpid,
            "env": env,
            "type": 2
        })
        if (!corpid) {
            alert('"企微ID(明文)"不能为空！');
            return;
        };
        const rltdiv2 = document.getElementById('rltdiv2');
        rltdiv2.innerHTML = "<img src='../static/img/loading.gif'/>";
        axios.post(`/sv/forWeCom`,data,{headers: header})
        .then(response => {
            var res = response.data;
            rltdiv2.innerHTML = '<textarea id="result2" readonly disabled class="wecom-result-ta"></textarea>';
            document.getElementById('result2').value = res.data;
        })
        .catch(err => {console.log(`获取密文企微ID err: ${err}`)})
    });
</script>

{% endblock %}
